# cargo-nextest's configuration (CI: .github/workflows/ci.yml runs `cargo llvm-cov nextest`).
# It holds hang guards and nothing else: no test asserts how long it takes, and no test has a
# timeout of its own. A test that waits for something that never comes is stopped by nextest's
# slow-timeout with terminate-after (the test is killed and fails once period x terminate-after
# has passed), instead of hanging the run.
#
# For each setting nextest takes the FIRST matching override, so a specific budget (longer or
# shorter) goes ABOVE the general one, which is last: a block for the same tests placed after
# `all()` would never apply.

# The tests of the tierstore local cache that wait for a task (a fill, an eviction, a counter) wait
# on the cache's own signals, never on a deadline in the test: one that waits for ever is stopped
# after two minutes (60 s x 2) and fails.
[[profile.default.overrides]]
filter = 'package(tierstore) & (test(~local_cache::) | test(~cache_cli_tests::) | test(~cache_node::) | test(~grant_server_tests::a_grant_reads_through))'
slow-timeout = { period = "60s", terminate-after = 2 }

# The general budget: every other test, of every package, is ended after eight minutes (120
# seconds x 4).
[[profile.default.overrides]]
filter = 'all()'
slow-timeout = { period = "120s", terminate-after = 4 }
