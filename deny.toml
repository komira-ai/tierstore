# cargo-deny configuration. Run: cargo deny check
# CI (ci.yml) checks bans, licences and sources; the advisories are checked by advisories.yml.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. Anything not listed, including every copyleft licence
# (GPL, LGPL, AGPL, MPL, EPL, CDDL, EUPL, OSL), is refused.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are not published; their licence is the workspace's Apache-2.0.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every crate comes from crates.io or this workspace, but one: the release before this one, the
# `tierstore_prev` workspace dependency (a dev-dependency of crates/compat), taken from this repository's own public URL at
# a pinned commit, which is what lets the compatibility tests run the previous release's code.
#
# And hostkeeper's own code for its package, from hostkeeper's public repository at pinned commits:
# dependencies of crates/xtask, which writes the release index and unpacks and loads each package
# with them, and dev-dependencies its tests read the package with (the root `Cargo.toml` names the
# commits).
#
# And `nfsserve`, the NFSv3 protocol of `tierstore fs` on macOS, from our fork at a pinned commit:
# `nfsserve` 0.11.0 plus the patches the frontend needs (the root `Cargo.toml` names the commit and
# what they are). It returns to crates.io once upstream releases such a change.
#
# And `fuser`, from our fork at a pinned commit: `fuser` 0.18.0 plus the change that lets a session
# resume on an initialised /dev/fuse descriptor, which `tierstore fs` needs for crash recovery and
# hand-over (the root `Cargo.toml` names the commit and the upstream pull request). It returns to
# crates.io once upstream releases the change.
allow-git = ["https://github.com/komira-ai/tierstore", "https://github.com/komira-ai/hostkeeper", "https://github.com/komira-ai/fuser", "https://github.com/komira-ai/nfsserve"]
