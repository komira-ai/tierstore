[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/komira-ai/tierstore"
publish = false

# Every external dependency is declared here once and used from a member as
# `name.workspace = true` (members add features they need). The versions and features are
# those of the repository this code came from, at the moment of the import.
[workspace.dependencies]
# The backend trait is used as `dyn Backend`, so its async methods are boxed.
async-trait = "0.1.92"
# A stock S3 SDK, to prove it works against the tierstore S3 front (tierstore's tests only).
# Pinned exactly, so that the test is of one SDK version. No default features: the default
# HTTP client brings a TLS provider (aws-lc), which the front, plain HTTP, does not need; the
# HTTP client below has no TLS either. Apache-2.0.
aws-sdk-s3 = { version = "=1.96.0", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
# The SDK's own hyper-based HTTP client, built without TLS (`build_http`) for a plain-HTTP
# endpoint. Apache-2.0.
aws-smithy-http-client = { version = "1.1.4", default-features = false, features = ["default-client"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
# CRC-64/NVMe, the checksum that the AWS SDKs send by default (MIT or Apache-2.0).
crc = "3.4.0"
# The hardware CRC-32C (SSE4.2 / ARMv8) with a portable fallback.
crc32c = "0.6.8"
crc32fast = "1.5.2"
futures = "0.3.34"
# The FUSE protocol of `tierstore fs` (Linux only; the crate's `server` feature). It mounts as
# root through mount(2), and as another user through `fusermount3`. MIT.
fuser = { version = "0.18.0", default-features = false }
hex = "0.4.3"
# Header maps; already in the tree through hyper.
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hmac = "0.13.0"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
# `kill` and the descriptor calls of the test helpers (tierstore-testkit).
libc = "0.2.190"
md-5 = "0.11.0"
# The NFSv3 and MOUNT protocol of `tierstore fs` on macOS (BSD-3-Clause), `nfsserve` 0.11.0 from
# crates.io plus one commit on the branch `komira-0.11` of our fork: the transaction tracker
# sweeps its map once a second and not on every request (the largest single factor of a cold walk
# of a tree, about 3x), `NFSFileSystem::authorize` and `NFSFileSystem::access` hooks (the uid
# fence, and execute that follows the mode bits), and `NFSTcpListener::from_listener` (a socket
# handed over by the instance a new one replaces). An upstream pull request is not opened. This
# returns to crates.io once upstream releases such a change.
nfsserve = { git = "https://github.com/komira-ai/nfsserve", rev = "cc3754176179df4425819f33b3bffb942522e46e", default-features = false }
percent-encoding = "2.3.2"
# Test certificates only. ring is the crypto provider the rustls below uses too.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Plain HTTP only: TLS brings a crypto provider, added with the first TLS endpoint.
reqwest = { version = "0.13.5", default-features = false }
ring = "0.17.14"
roxmltree = "0.21.1"
# The zstd encoder of the hostkeeper package (`cargo xtask release hostkeeper-package`): pure Rust,
# the crate hostkeeper's unpacker decodes the package with, its frames with a content checksum
# (`hash`). MIT.
ruzstd = { version = "0.9.1", default-features = false, features = ["hash", "std"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
# Directory-relative, no-follow file access, the effective uid and the free space of a file system.
rustix = "1.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
# The `--config` file of the `tierstore` binary; no datetime or display support.
toml = { version = "1.1.8", default-features = false, features = ["display", "parse", "serde", "std"] }
tokio = "1.53.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing = "0.1.44"
# Reads the fields of a client certificate (IP subjectAltNames) that the OCI front's start checks.
x509-parser = "0.18.1"

# The workspace's own crates.
# The object store trait and the S3 client, with no dependency on another workspace crate.
objstore-s3 = { path = "crates/objstore-s3" }
# The hot/cold object store library; it depends on no other workspace crate unless its `s3`
# feature is on.
tierstore = { path = "crates/tierstore" }
# Scratch directories, loopback ports and child processes for tests.
tierstore-testkit = { path = "crates/tierstore-testkit" }
# The previous release: `v0.3.17`, the tag of the commit below, taken from the public repository
# at that commit alone (the `rev` is what pins it; a tag can be moved). Used only by the
# dev-dependencies of `crates/compat`. When a release is made, move both to the new release's
# commit: the tests then hold this branch to the release before.
tierstore_prev = { package = "tierstore", git = "https://github.com/komira-ai/tierstore", rev = "6b60319efd148fba3d7fc0f7e6217d64b097642e" }

# hostkeeper's own code for its package, taken from hostkeeper's public repository at one pinned
# commit, so the package is unpacked and its manifest loaded with the code a host runs.
# `hostkeeper-config` (the manifest loader, and the release index `index.json`, its strict reader
# and canonical writer) and `hostkeeper-unpack` (the unpacker) are dependencies of `crates/xtask`:
# `release hostkeeper-index` writes the index with them and `verify-assets hostkeeper-*` checks the
# packages with them; the tests of the hostkeeper package use them too, with the placed-path lint
# `hostkeeper-placed` (a dev-dependency of `crates/xtask`). The commit is the one that merged
# komira-ai/hostkeeper#135 into main, whose unpacker keeps the staging directory writable until it
# is renamed into place and only then makes it 0555, so an unpack as a user other than root
# publishes the version on macOS; its loader reads the manifest's `platform` key and a launchd
# plist as a unit file (komira-ai/hostkeeper#32).
hostkeeper-config = { git = "https://github.com/komira-ai/hostkeeper", rev = "383c5cd6aae6c86d877f8e96d6ba7375ad8e723d" }
hostkeeper-unpack = { git = "https://github.com/komira-ai/hostkeeper", rev = "383c5cd6aae6c86d877f8e96d6ba7375ad8e723d" }
hostkeeper-placed = { git = "https://github.com/komira-ai/hostkeeper", rev = "383c5cd6aae6c86d877f8e96d6ba7375ad8e723d" }

[workspace.lints.rust]
# `coverage` is set by cargo-llvm-cov.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
# No unsafe code (AGENTS.md R2). `deny`, not `forbid`, so the two modules of
# tierstore-testkit that call libc or edit the environment can each `expect` it with a
# reason; `tierstore` forbids it in its own `lib.rs`.
unsafe_code = "deny"

[workspace.lints.clippy]
# The methods and types `clippy.toml` bans, each with the reason clippy prints.
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# Production code does not panic on a `None` or an `Err` (AGENTS.md R3). Tests may: the
# `allow-*-in-tests` keys of `clippy.toml` leave them out of these two.
unwrap_used = "deny"
expect_used = "deny"

# Dev and test builds: a test binary with full debug info is ~0.5 GB and a target
# directory holds thousands of them, plus incremental state. Line tables keep panic
# backtraces and profilers at file:line; variable-level debug info is the part dropped.
# `test` inherits `dev`; it is spelled out so the two cannot drift. Release is untouched.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

# The model check (crates/tierstore-model) explores millions of states: optimise that crate in
# dev and test builds so its tests run in seconds, not minutes.
[profile.dev.package.tierstore-model]
opt-level = 3

[profile.test.package.tierstore-model]
opt-level = 3
