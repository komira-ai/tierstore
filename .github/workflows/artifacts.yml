# A scratch branch's stand-in for artifacts.yml, run by hand only: the listener test
# server::oci::listener_tests::the_door_waits_for_a_free_slot_no_longer_than_its_grace, many
# times on macos-15, at three commits: the fix (`fixed`), main before it (`main`), and the fix with
# its clock hold left out (`unheld`). It builds the tests and runs them; it uploads, signs and
# saves nothing.
name: artifacts

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - commit: fixed
            sha: a0d0940acd3da2cb32bb483a0412535d0ad6b8f9
            suites: 3
          - commit: main
            sha: 399b154fcad62df1d02b2666f80d36a8163dce27
            suites: 3
          - commit: unheld
            sha: 7238cfd25af9b9120b9aa1a0c23ddb15f272f6e1
            suites: 0
    name: ${{ matrix.commit }}
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TEST: server::oci::listener_tests::the_door_waits_for_a_free_slot_no_longer_than_its_grace
      RUNS: 2000
      PARALLEL: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}
      - run: rustup toolchain install
      - name: Build the tests of tierstore's library
        run: cargo test --locked -p tierstore --lib --features s3 --no-run --message-format=json | jq -r 'select(.executable != null and .target.kind == ["lib"]) | .executable' > "$RUNNER_TEMP/binary"
      - name: The test alone, RUNS times, PARALLEL at once
        working-directory: crates/tierstore
        run: |
          binary="$(cat "$RUNNER_TEMP/binary")"
          seq "$RUNS" | xargs -P "$PARALLEL" -I{} sh -c "\"$binary\" --exact \"$TEST\" > \"$RUNNER_TEMP/run-{}.log\" 2>&1 || echo {}" > "$RUNNER_TEMP/failed"
          failed="$(wc -l < "$RUNNER_TEMP/failed" | tr -d ' ')"
          echo "${{ matrix.commit }} (${{ matrix.sha }}): $failed of $RUNS runs of the test alone failed" | tee -a "$GITHUB_STEP_SUMMARY"
          first="$(head -1 "$RUNNER_TEMP/failed")"
          if [ -n "$first" ]; then grep -E "panicked|left|right" "$RUNNER_TEMP/run-$first.log" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "$failed" > "$RUNNER_TEMP/alone"
      - name: The whole library suite, with the others beside it, `suites` times
        if: ${{ matrix.suites > 0 }}
        run: |
          failed=0
          for run in $(seq "${{ matrix.suites }}"); do
            if ! cargo test --locked -p tierstore --lib --features s3 > "$RUNNER_TEMP/suite-$run.log" 2>&1; then
              failed=$((failed + 1))
              grep -E "^test .*FAILED|^    server::" "$RUNNER_TEMP/suite-$run.log" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "${{ matrix.commit }}: $failed of ${{ matrix.suites }} runs of the whole suite failed" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$failed" > "$RUNNER_TEMP/suites"
      - name: Any failure fails the job
        run: |
          alone="$(cat "$RUNNER_TEMP/alone")"
          suites="$(cat "$RUNNER_TEMP/suites" 2>/dev/null || echo 0)"
          test "$alone" = 0 && test "$suites" = 0
