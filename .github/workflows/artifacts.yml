# The release files: the `tierstore` binary (built with its `server` feature) for linux-x86_64,
# linux-arm64 and macos-arm64, built once per commit, each as a tarball with a CycloneDX SBOM, one SHA256SUMS
# over the commit's files, and the build-provenance and SBOM attestations of this repository.
# The files are named `tierstore-<commit>-<platform>.tar.gz`, `tierstore-<commit>-<platform>.cdx.json`
# and `tierstore-<commit>-<platform>.tar.gz.sigstore.json` (the bundle of that tarball's own
# provenance attestation, for an offline check with `gh attestation verify --bundle`), where
# `<commit>` is the full commit SHA and `<platform>` is `linux-x86_64`, `linux-arm64` or
# `macos-arm64`. Each build job runs on a GitHub-hosted runner of its own platform, so each
# binary is run where it is built and must say the commit and the version there.
#
# The Linux binaries are linked against glibc 2.28 (`cargo zigbuild`, target `<triple>.2.28`), not
# against the glibc of the runner image, so they start on every distribution from Debian 10 and
# RHEL 8 on, which the .deb and .rpm packages require (`libc6 (>= 2.28)`, `glibc >= 2.28`). Each
# Linux job reads the binary's symbol versions and fails when one is above 2.28
# (`cargo xtask release check-glibc`). zig and cargo-zigbuild are downloaded by URL and checked
# against their SHA-256, as cargo-cyclonedx is.
#
# Beside them, the hostkeeper packages of the same binaries: `tierstore-<version>-<platform>.tar.zst`
# (`cargo xtask release hostkeeper-package`, where `<version>` is what `tierstore --version`
# prints, `X.Y.Z+<12 hex>`), each with the bundle of its own provenance attestation,
# `tierstore-<version>-<platform>.tar.zst.sigstore.json`, and one release index, `index.json`
# (`cargo xtask release hostkeeper-index`, in the sums job), which lists the package of every
# platform: hostkeeper refuses a host whose platform the index lacks. Each build job unpacks its
# package with hostkeeper's own unpacker (`cargo xtask verify-assets hostkeeper-package`), and the
# macOS job checks the code signature of the binary it unpacked (`codesign --verify --strict`).
# SHA256SUMS lists the packages and the index; the attest job signs them as it signs the tarballs.
#
# And the files the distribution channels download. Each platform's tarball is also written as
# `tierstore-<version>-<target>.tar.gz`, where `<version>` is the release's `X.Y.Z` (the `version`
# job's output) and `<target>` is `linux-x86_64`, `linux-aarch64` or `macos-arm64`, the names the
# Homebrew tap accepts (`cargo xtask release tap-tarball`: a copy, the same bytes). Each Linux
# platform also has a Debian package, `tierstore_<version>_<arch>.deb` with `<arch>` `amd64` or
# `arm64` (`cargo xtask release deb`), which `dpkg-deb` reads in the build job, and an RPM package,
# `tierstore-<version>-1.<arch>.rpm` with `<arch>` `x86_64` or `aarch64` (`cargo xtask release
# rpm`), which the build job reads back with `cargo xtask release rpm-info`. Each of these is
# listed in SHA256SUMS and signed by `attest` as a subject of its own, with its
# `<file>.sigstore.json`. Uploading them to the tap, apt or a bucket is not done here.
#
# A pull request runs on Linux x86_64 alone: it builds, packages and sums the linux-x86_64 files,
# their hostkeeper package included, and attests nothing. The other platforms (linux-arm64 and
# macos-arm64) are the beta stage of the release: their jobs test the workspace, then build and
# check their files, on a push to main or by hand, and do not run for a pull request, so the pull
# request's sums cover the linux-x86_64 files alone and it has no release index.
# A push to main builds every platform, also signs, in the `attest` job, and then checks what it signed (`verify`), as a deployment does. A
# run by hand (workflow_dispatch) on a branch builds every platform, the macOS one included, and
# sums them, and signs nothing: it is how a change to the macOS build is tried before it merges.
# The attest job is in THIS file for one reason: the signer identity of an attestation is the
# workflow file that ran the signing step, and the host installer verifies exactly
# `.github/workflows/artifacts.yml`. Do not move or rename it. Only `attest` may hold
# `id-token: write` and `attestations: write`, and only under its exact `if:` (the workflow
# lint, crates/xtask/tests/workflows, requires both): no pull request holds a token that can
# sign, and every attestation this repository signs names refs/heads/main.
#
# The attest job signs and does nothing else: while it holds `id-token: write` no repository code
# runs and nothing is built, only the pinned actions below, two `sha256sum --check` commands that
# run first (bash-specific: the workflow pins its shell) and a `cp` that names each bundle. The
# files it signs come from the build jobs through the run's artifact store, where a job that runs
# repository code could have replaced them, so the first step refuses sums other than the ones
# the sums job published (its digest is passed in as a job output), and the second refuses a
# file that differs from the sums.
#
# The version the binary reports. The `version` job computes the version the next release has
# (`cargo xtask release version`: the patch after the highest vX.Y.Z tag, or the VERSION file at
# the root when that is higher), before anything is built, and every build job writes it into the
# crate (`cargo xtask release set-version`, from RELEASE_VERSION) before building, so
# `tierstore --version` prints `X.Y.Z+<12 hex>`. The job also records the version on the run as
# the name of an artifact, `version-<X.Y.Z>`. The release plan (release.yml) names its tag with
# the same computation and releases only a commit whose run recorded that version (a commit built
# before a newer release was published is passed over, and a newer commit's release carries it);
# the release is refused unless the downloaded binary says that tag. The names of the tarballs and SBOMs carry the commit,
# not the version, and are unchanged; the hostkeeper packages are named by the version the binary
# reports, which holds both. A pull request builds under the version its base would release next.
#
# The files are kept as workflow artifacts for 90 days, GitHub's limit. release.yml, started by
# the completion of this workflow and ci.yml on a push to main (or by hand), attaches these exact
# files for a commit on main to a GitHub release, checked again against these attestations, and
# never rebuilds.
name: artifacts

on:
  pull_request:
  push:
    branches: [main]
  # By hand, on any branch: the build jobs (the macOS one included) and the sums, nothing signed
  # (attest and verify run for a push to main alone).
  workflow_dispatch:

permissions: {}

# A pull request's newer run replaces its older one; a push to main always runs to its end,
# so a commit that is signed is never left half checked. A push has a group per commit: two
# runs for one commit (a re-run) queue behind each other, and different commits do not wait for
# each other. This workflow only builds and attests; it never tags, publishes or deploys, so it
# is outside the release group of release.yml (the workflow lint lists it as exempt).
concurrency:
  group: artifacts-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # cargo-cyclonedx makes the SBOMs. Its release binaries, checked against their SHA-256 before
  # use (the values the project publishes with them, recomputed when pinned).
  CYCLONEDX_VERSION: 0.5.9
  CYCLONEDX_SHA256_X86_64_LINUX: fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8
  CYCLONEDX_SHA256_AARCH64_LINUX: 7bf131ca5389b07a4f10c182bcf8a5ad339d64408b6f0d8f6834a0bd6120a06a
  CYCLONEDX_SHA256_AARCH64_MACOS: 4c53dfa21e70b65bf7f8d2592aadde3bcb02c1a40b6ec63b877e5ca65a29e180
  # The Linux binaries are linked by `cargo zigbuild` against this glibc (zig supplies its headers
  # and symbol versions), and no `GLIBC_` symbol version above it may be in them. It is the
  # `libc6` and `glibc` floor of the .deb and .rpm (`FLOOR` in crates/xtask/src/release/glibc.rs;
  # a test holds the two equal).
  GLIBC_FLOOR: "2.28"
  # zig (the C compiler and linker of the Linux builds) and cargo-zigbuild, their release files
  # checked against their SHA-256 before use (zig's from ziglang.org/download/index.json,
  # cargo-zigbuild's from the `.sha256` beside each file; both recomputed when pinned).
  ZIG_VERSION: 0.15.2
  ZIG_SHA256_X86_64_LINUX: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
  ZIG_SHA256_AARCH64_LINUX: 958ed7d1e00d0ea76590d27666efbf7a932281b3d7ba0c6b01b0ff26498f667f
  ZIGBUILD_VERSION: 0.24.1
  ZIGBUILD_SHA256_X86_64_LINUX: 32581c8e13f27a807bb244aaaac870522f5b51263c766cf77b1a99771ce9fa5c
  ZIGBUILD_SHA256_AARCH64_LINUX: 70bb4c9cc71a6d16211b9079996e3cd588671053312adeff4d043499ed887601

defaults:
  run:
    shell: bash

jobs:
  # The one computation of the version every build gives the binary (see the header). It reads the
  # tags and the VERSION file only; xtask is compiled before the step that holds the token.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: The version of the next release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release version --repo "$GITHUB_REPOSITORY" --version-file VERSION --output "$GITHUB_OUTPUT" --record "$RUNNER_TEMP/version"
      # The version this run builds under, recorded on the run as the name of an artifact,
      # version-<X.Y.Z>: the release plan reads it to release only a commit whose binary says the
      # tag the plan would give it, and passes over one built before a newer release.
      - name: Record the version on the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: version-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/version
          if-no-files-found: error

  # glibc: the binary is linked against glibc 2.28 (GLIBC_FLOOR) and needs that or newer.
  linux-x86_64:
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: x86_64-unknown-linux-gnu
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          # On a push (to main: the build the attest job signs) nothing is restored: the signed
          # binary is built from a clean target/, never on a cached one. The lookup still tells
          # the save step below whether this key exists.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_X86_64_LINUX" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      # The crate's version is the release's: the binary reports the version of `Cargo.toml`.
      # `Cargo.lock` gets the same version, so the `--locked` build below accepts it; the SBOM
      # step must leave it exactly as this step wrote it.
      - name: The crate takes the version of the release
        run: cargo xtask release set-version --version "$RELEASE_VERSION"
      - name: Keep the lock file as written
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      # `tierstore` is built by itself: its binary needs the crate's `server` feature
      # (`required-features`), and `-p tierstore --bins` without it builds no binary and says
      # nothing.
      # zig and cargo-zigbuild, pinned by URL and SHA-256. zig is a directory (its compiler and
      # its library files), installed whole under $HOME/zig.
      - name: Install zig (pinned version and checksum)
        run: cargo xtask fetch --url "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" --sha256 "$ZIG_SHA256_X86_64_LINUX" --out "$HOME/zig" --extract tar.xz --tree
      - name: Install cargo-zigbuild (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION/cargo-zigbuild-$TARGET.tar.xz" --sha256 "$ZIGBUILD_SHA256_X86_64_LINUX" --out "$HOME/.cargo/bin/cargo-zigbuild" --extract tar.xz --member "cargo-zigbuild-$TARGET/cargo-zigbuild"
      - run: PATH="$HOME/zig:$PATH" zig version
      # Linked against glibc 2.28 (the target's `.2.28`); the binary lands in target/$TARGET/release
      # as it does for `cargo build`.
      - run: PATH="$HOME/zig:$PATH" cargo zigbuild --locked --release --target "$TARGET.$GLIBC_FLOOR" -p tierstore --features server --bin tierstore
      # The binary asks for no glibc symbol version above the floor: read from its ELF file, so
      # a binary linked against the runner's newer glibc fails here and not on a host.
      - name: tierstore needs no glibc newer than the floor
        run: cargo xtask release check-glibc "target/$TARGET/release/tierstore" --max "$GLIBC_FLOOR"
      # The binary runs here (a runner of its own architecture built it) and says the commit.
      - name: tierstore names the commit and the version
        run: cargo xtask build-commit "target/$TARGET/release/tierstore" "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: cmp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      # The notice of the third-party crates the binary links (their licence texts), from the
      # resolution of this build: the same crate, feature and target as the build above. It
      # goes into the tarball beside the binary; a crate that declares no licence fails here.
      - name: Resolve the crates of this build
        run: cargo metadata --locked --format-version 1 --manifest-path crates/tierstore/Cargo.toml --features server --filter-platform "$TARGET" > "$RUNNER_TEMP/metadata.json"
      - name: Third-party licence notice
        run: cargo xtask licenses --metadata "$RUNNER_TEMP/metadata.json" --package tierstore --out "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
      - name: Package tierstore
        run: cargo xtask package --binary "target/$TARGET/release/tierstore" --sbom crates/tierstore/tierstore_bin.cdx.json --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" --platform linux-x86_64 --commit "$GITHUB_SHA" --out dist
      # The tarball as a host takes it: unpacked with this runner's own tar, the binary in it runs
      # and must say the commit and the version, as the built one did.
      - run: mkdir "$RUNNER_TEMP/unpacked"
      - run: tar -xzf "dist/tierstore-${GITHUB_SHA}-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/unpacked" tierstore
      - name: The packaged tierstore names the commit and the version
        run: cargo xtask build-commit "$RUNNER_TEMP/unpacked/tierstore" "$GITHUB_SHA" --version "$RELEASE_VERSION"
      # The hostkeeper package of the same binary, tierstore-<version>-linux-x86_64.tar.zst, named
      # by the version the binary reports, with its line in dist/SHA256SUMS.linux-x86_64. It needs
      # hostkeeper 0.1.0, whose loader reads the manifest's `platform` key.
      - name: The hostkeeper package
        run: cargo xtask release hostkeeper-package --binary "target/$TARGET/release/tierstore" --version "$RELEASE_VERSION+${GITHUB_SHA::12}" --min-hostkeeper 0.1.0 --platform linux-x86_64 --out dist
      # The package as a host takes it: unpacked by hostkeeper's own unpacker, under its rules,
      # with no extended attribute.
      - name: The hostkeeper package unpacks as a host unpacks it
        run: cargo xtask verify-assets hostkeeper-package dist --version "$RELEASE_VERSION+${GITHUB_SHA::12}" --platform linux-x86_64 --scratch "$RUNNER_TEMP/hostkeeper"
      # The tarball the Homebrew tap's formula downloads, tierstore-<version>-linux-x86_64.tar.gz
      # (<version> is X.Y.Z): a copy of the tarball above, so the same bytes, with its line in
      # dist/SHA256SUMS.linux-x86_64.
      - name: The tarball named as the Homebrew tap downloads it
        run: cargo xtask release tap-tarball dist --commit "$GITHUB_SHA" --version "$RELEASE_VERSION" --platform linux-x86_64
      # The Debian package of the same binary, tierstore_<version>_amd64.deb (<version> is X.Y.Z),
      # with its line in dist/SHA256SUMS.linux-x86_64; dpkg then reads it as apt will.
      - name: The Debian package
        run: cargo xtask release deb --binary "target/$TARGET/release/tierstore" --version "$RELEASE_VERSION" --platform linux-x86_64 --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" --out dist
      - name: dpkg reads the control file of the Debian package
        run: dpkg-deb --info "dist/tierstore_${RELEASE_VERSION}_amd64.deb"
      - name: dpkg reads the files of the Debian package
        run: dpkg-deb --contents "dist/tierstore_${RELEASE_VERSION}_amd64.deb"
      # The RPM package of the same binary, tierstore-<version>-1.x86_64.rpm (<version> is X.Y.Z),
      # with its line in dist/SHA256SUMS.linux-x86_64; the xtask reader then checks its digests and
      # prints its header and files (the runner has no rpm to read it with).
      - name: The RPM package
        run: cargo xtask release rpm --binary "target/$TARGET/release/tierstore" --version "$RELEASE_VERSION" --platform linux-x86_64 --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" --out dist
      - name: The RPM package reads back
        run: cargo xtask release rpm-info "dist/tierstore-${RELEASE_VERSION}-1.x86_64.rpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-linux-x86_64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The beta stage, with macos-arm64: not for a pull request (a pull request builds linux-x86_64
  # alone), on a push and by hand. Its tests of the workspace run before it builds, so the
  # linux-arm64 files reach `sums` and are signed only when they pass.
  linux-arm64:
    needs: [version]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: aarch64-unknown-linux-gnu
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-zigbuild-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          # On a push (to main: the build the attest job signs) nothing is restored: the signed
          # binary is built from a clean target/, never on a cached one. The lookup still tells
          # the save step below whether this key exists.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_AARCH64_LINUX" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      # Every test of every crate of the workspace, on linux-arm64.
      - name: The tests of the workspace, on linux-arm64
        run: cargo test --locked --workspace --features tierstore/s3 --no-fail-fast
      # The crate's version is the release's: the binary reports the version of `Cargo.toml`.
      # `Cargo.lock` gets the same version, so the `--locked` build below accepts it; the SBOM
      # step must leave it exactly as this step wrote it.
      - name: The crate takes the version of the release
        run: cargo xtask release set-version --version "$RELEASE_VERSION"
      - name: Keep the lock file as written
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      # `tierstore` is built by itself: its binary needs the crate's `server` feature
      # (`required-features`), and `-p tierstore --bins` without it builds no binary and says
      # nothing.
      # zig and cargo-zigbuild, pinned by URL and SHA-256. zig is a directory (its compiler and
      # its library files), installed whole under $HOME/zig.
      - name: Install zig (pinned version and checksum)
        run: cargo xtask fetch --url "https://ziglang.org/download/$ZIG_VERSION/zig-aarch64-linux-$ZIG_VERSION.tar.xz" --sha256 "$ZIG_SHA256_AARCH64_LINUX" --out "$HOME/zig" --extract tar.xz --tree
      - name: Install cargo-zigbuild (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION/cargo-zigbuild-$TARGET.tar.xz" --sha256 "$ZIGBUILD_SHA256_AARCH64_LINUX" --out "$HOME/.cargo/bin/cargo-zigbuild" --extract tar.xz --member "cargo-zigbuild-$TARGET/cargo-zigbuild"
      - run: PATH="$HOME/zig:$PATH" zig version
      # Linked against glibc 2.28 (the target's `.2.28`); the binary lands in target/$TARGET/release
      # as it does for `cargo build`.
      - run: PATH="$HOME/zig:$PATH" cargo zigbuild --locked --release --target "$TARGET.$GLIBC_FLOOR" -p tierstore --features server --bin tierstore
      # The binary asks for no glibc symbol version above the floor: read from its ELF file, so
      # a binary linked against the runner's newer glibc fails here and not on a host.
      - name: tierstore needs no glibc newer than the floor
        run: cargo xtask release check-glibc "target/$TARGET/release/tierstore" --max "$GLIBC_FLOOR"
      # The binary runs here (a runner of its own architecture built it) and says the commit.
      - name: tierstore names the commit and the version
        run: cargo xtask build-commit "target/$TARGET/release/tierstore" "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: cmp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      # The notice of the third-party crates the binary links (their licence texts), from the
      # resolution of this build: the same crate, feature and target as the build above. It
      # goes into the tarball beside the binary; a crate that declares no licence fails here.
      - name: Resolve the crates of this build
        run: cargo metadata --locked --format-version 1 --manifest-path crates/tierstore/Cargo.toml --features server --filter-platform "$TARGET" > "$RUNNER_TEMP/metadata.json"
      - name: Third-party licence notice
        run: cargo xtask licenses --metadata "$RUNNER_TEMP/metadata.json" --package tierstore --out "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
      - name: Package tierstore
        run: cargo xtask package --binary "target/$TARGET/release/tierstore" --sbom crates/tierstore/tierstore_bin.cdx.json --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" --platform linux-arm64 --commit "$GITHUB_SHA" --out dist
      # The tarball as a host takes it: unpacked with this runner's own tar, the binary in it runs
      # and must say the commit and the version, as the built one did.
      - run: mkdir "$RUNNER_TEMP/unpacked"
      - run: tar -xzf "dist/tierstore-${GITHUB_SHA}-linux-arm64.tar.gz" -C "$RUNNER_TEMP/unpacked" tierstore
      - name: The packaged tierstore names the commit and the version
        run: cargo xtask build-commit "$RUNNER_TEMP/unpacked/tierstore" "$GITHUB_SHA" --version "$RELEASE_VERSION"
      # The hostkeeper package of the same binary, tierstore-<version>-linux-arm64.tar.zst, named
      # by the version the binary reports, with its line in dist/SHA256SUMS.linux-arm64. It needs
      # hostkeeper 0.1.0, whose loader reads the manifest's `platform` key.
      - name: The hostkeeper package
        run: cargo xtask release hostkeeper-package --binary "target/$TARGET/release/tierstore" --version "$RELEASE_VERSION+${GITHUB_SHA::12}" --min-hostkeeper 0.1.0 --platform linux-arm64 --out dist
      # The package as a host takes it: unpacked by hostkeeper's own unpacker, under its rules,
      # with no extended attribute.
      - name: The hostkeeper package unpacks as a host unpacks it
        run: cargo xtask verify-assets hostkeeper-package dist --version "$RELEASE_VERSION+${GITHUB_SHA::12}" --platform linux-arm64 --scratch "$RUNNER_TEMP/hostkeeper"
      # The tarball the Homebrew tap's formula downloads, tierstore-<version>-linux-aarch64.tar.gz
      # (<version> is X.Y.Z): a copy of the tarball above, so the same bytes, with its line in
      # dist/SHA256SUMS.linux-arm64.
      - name: The tarball named as the Homebrew tap downloads it
        run: cargo xtask release tap-tarball dist --commit "$GITHUB_SHA" --version "$RELEASE_VERSION" --platform linux-arm64
      # The Debian package of the same binary, tierstore_<version>_arm64.deb (<version> is X.Y.Z),
      # with its line in dist/SHA256SUMS.linux-arm64; dpkg then reads it as apt will.
      - name: The Debian package
        run: cargo xtask release deb --binary "target/$TARGET/release/tierstore" --version "$RELEASE_VERSION" --platform linux-arm64 --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" --out dist
      - name: dpkg reads the control file of the Debian package
        run: dpkg-deb --info "dist/tierstore_${RELEASE_VERSION}_arm64.deb"
      - name: dpkg reads the files of the Debian package
        run: dpkg-deb --contents "dist/tierstore_${RELEASE_VERSION}_arm64.deb"
      # The RPM package of the same binary, tierstore-<version>-1.aarch64.rpm (<version> is X.Y.Z),
      # with its line in dist/SHA256SUMS.linux-arm64; the xtask reader then checks its digests and
      # prints its header and files (the runner has no rpm to read it with).
      - name: The RPM package
        run: cargo xtask release rpm --binary "target/$TARGET/release/tierstore" --version "$RELEASE_VERSION" --platform linux-arm64 --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" --out dist
      - name: The RPM package reads back
        run: cargo xtask release rpm-info "dist/tierstore-${RELEASE_VERSION}-1.aarch64.rpm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-linux-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # macOS on Apple silicon. The binary is ad-hoc signed by the linker, as every arm64 macOS
  # binary must be to run, and is not notarized. Only this job can run it: release.yml's
  # check-binary runs the linux-x86_64 binary alone, so the build-commit steps below are the
  # version check of the macOS binary. It also runs every test of the workspace, which ci.yml
  # runs on Linux only. The beta stage, with linux-arm64: not for a pull request, on a push and by
  # hand. Its files reach `sums` and are signed only when its tests and checks pass.
  macos-arm64:
    needs: [version]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TARGET: aarch64-apple-darwin
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          # On a push (to main: the build the attest job signs) nothing is restored: the signed
          # binary is built from a clean target/, never on a cached one. The lookup still tells
          # the save step below whether this key exists.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_AARCH64_MACOS" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      # Every test of every crate of the workspace, on macOS: the update hook's launchd steps, the
      # listener hand-off, packaging/macos (tests/packaging_macos.rs) and the xtask verbs among them.
      - name: The tests of the workspace, on macOS
        run: cargo test --locked --workspace --features tierstore/s3 --no-fail-fast
      # The crate's version is the release's: the binary reports the version of `Cargo.toml`.
      # `Cargo.lock` gets the same version, so the `--locked` build below accepts it; the SBOM
      # step must leave it exactly as this step wrote it.
      - name: The crate takes the version of the release
        run: cargo xtask release set-version --version "$RELEASE_VERSION"
      - name: Keep the lock file as written
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      # `tierstore` is built by itself: its binary needs the crate's `server` feature
      # (`required-features`), and `-p tierstore --bins` without it builds no binary and says
      # nothing.
      - run: cargo build --locked --release --target "$TARGET" -p tierstore --features server --bin tierstore
      # The binary runs here (a runner of its own architecture built it) and says the commit.
      - name: tierstore names the commit and the version
        run: cargo xtask build-commit "target/$TARGET/release/tierstore" "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: cmp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      # The notice of the third-party crates the binary links (their licence texts), from the
      # resolution of this build: the same crate, feature and target as the build above. It
      # goes into the tarball beside the binary; a crate that declares no licence fails here.
      - name: Resolve the crates of this build
        run: cargo metadata --locked --format-version 1 --manifest-path crates/tierstore/Cargo.toml --features server --filter-platform "$TARGET" > "$RUNNER_TEMP/metadata.json"
      - name: Third-party licence notice
        run: cargo xtask licenses --metadata "$RUNNER_TEMP/metadata.json" --package tierstore --out "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
      - name: Package tierstore
        run: cargo xtask package --binary "target/$TARGET/release/tierstore" --sbom crates/tierstore/tierstore_bin.cdx.json --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" --platform macos-arm64 --commit "$GITHUB_SHA" --out dist
      # The tarball as a host takes it: unpacked with this runner's own tar, the binary in it runs
      # and must say the commit and the version, as the built one did.
      - run: mkdir "$RUNNER_TEMP/unpacked"
      - run: tar -xzf "dist/tierstore-${GITHUB_SHA}-macos-arm64.tar.gz" -C "$RUNNER_TEMP/unpacked" tierstore
      - name: The packaged tierstore names the commit and the version
        run: cargo xtask build-commit "$RUNNER_TEMP/unpacked/tierstore" "$GITHUB_SHA" --version "$RELEASE_VERSION"
      # The hostkeeper package of the same binary, tierstore-<version>-macos-arm64.tar.zst, named
      # by the version the binary reports, with its line in dist/SHA256SUMS.macos-arm64. It needs
      # hostkeeper 0.1.0, whose loader reads the manifest's `platform` key.
      - name: The hostkeeper package
        run: cargo xtask release hostkeeper-package --binary "target/$TARGET/release/tierstore" --version "$RELEASE_VERSION+${GITHUB_SHA::12}" --min-hostkeeper 0.1.0 --platform macos-arm64 --out dist
      # The package as a host takes it: unpacked by hostkeeper's own unpacker, under its rules,
      # with no extended attribute.
      - name: The hostkeeper package unpacks as a host unpacks it
        run: cargo xtask verify-assets hostkeeper-package dist --version "$RELEASE_VERSION+${GITHUB_SHA::12}" --platform macos-arm64 --scratch "$RUNNER_TEMP/hostkeeper"
      # The tarball the Homebrew tap's formula downloads, tierstore-<version>-macos-arm64.tar.gz
      # (<version> is X.Y.Z): a copy of the tarball above, so the same bytes, with its line in
      # dist/SHA256SUMS.macos-arm64.
      - name: The tarball named as the Homebrew tap downloads it
        run: cargo xtask release tap-tarball dist --commit "$GITHUB_SHA" --version "$RELEASE_VERSION" --platform macos-arm64
      # The signature the linker gave the binary (ad hoc: an arm64 Mac runs no binary without a
      # valid one) is intact in the package as a host unpacks it, checked here, where a Mach-O
      # can be.
      - name: The packaged binary carries a valid code signature
        run: codesign --verify --strict "$RUNNER_TEMP/hostkeeper/packages/tierstore/$RELEASE_VERSION+${GITHUB_SHA::12}/bin/tierstore"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assets-macos-arm64
          path: dist/
          retention-days: 90
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # SHA256SUMS over every platform's files and the release index of the hostkeeper packages,
  # checked against the files and a flipped copy. The attest job signs these sums, so they are the
  # one list of what a release holds.
  # For a pull request the beta jobs (linux-arm64, macos-arm64) are skipped, the sums are those
  # of the linux-x86_64 files, and no index is written (an index lists every platform); for a push or a run by hand every build job
  # must have succeeded, and the index is refused without the macOS package.
  sums:
    needs: [linux-x86_64, linux-arm64, macos-arm64]
    if: ${{ !cancelled() && needs.linux-x86_64.result == 'success' && ((needs.linux-arm64.result == 'success' && needs.macos-arm64.result == 'success') || (github.event_name == 'pull_request' && needs.linux-arm64.result == 'skipped' && needs.macos-arm64.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # The SHA-256 of the SHA256SUMS this job uploads, for the attest job to hold the sums it
    # downloads to, and the version of the hostkeeper packages, which the attest job names them by.
    outputs:
      sha256: ${{ steps.assemble.outputs.sha256 }}
      package-version: ${{ steps.index.outputs.package-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `assets-*` is the build jobs' artifacts, one per platform, and nothing else: the run's
      # other artifacts are `sha256sums` and `bundles`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - run: rustup toolchain install
      # index.json, hostkeeper's release index of the three packages (each one's file, size and
      # SHA-256, canonical JSON), and its line in dist/SHA256SUMS.index. For a pull request it
      # checks the two Linux packages are there and writes nothing.
      - name: The release index of the hostkeeper packages
        id: index
        run: cargo xtask release hostkeeper-index dist --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" --output "$GITHUB_OUTPUT"
      - name: Assemble SHA256SUMS
        id: assemble
        run: cargo xtask sums assemble dist --summary "$GITHUB_STEP_SUMMARY" --digest-output "$GITHUB_OUTPUT"
      - run: cargo xtask verify-assets sums dist
      # The sums and the index (none for a pull request): the attest job checks the index against
      # the sums before it signs, so it must have it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums
          path: |
            dist/SHA256SUMS
            dist/index.json
          retention-days: 90
          if-no-files-found: error

  # Push to main only: build provenance for every file, an SBOM attestation for every tarball, and
  # a provenance attestation (and its bundle) of each tarball and each hostkeeper package alone.
  # See the top of this file.
  attest:
    needs: [version, sums]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # `assets-*` is the build jobs' artifacts, one per platform, and nothing else: the run's
      # other artifacts are `sha256sums` and `bundles`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: dist
      - name: Refuse sums other than the build's
        env:
          SUMS_SHA256: ${{ needs.sums.outputs.sha256 }}
        run: /usr/bin/sha256sum --check --strict <<< "$SUMS_SHA256  dist/SHA256SUMS"
      - name: Refuse listed files that differ from the sums
        working-directory: dist
        run: /usr/bin/sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/tierstore-${{ github.sha }}-linux-x86_64.tar.gz
          sbom-path: dist/tierstore-${{ github.sha }}-linux-x86_64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/tierstore-${{ github.sha }}-linux-arm64.tar.gz
          sbom-path: dist/tierstore-${{ github.sha }}-linux-arm64.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/tierstore-${{ github.sha }}-macos-arm64.tar.gz
          sbom-path: dist/tierstore-${{ github.sha }}-macos-arm64.cdx.json
      # Each tarball is also attested as its own subject, and the bundle of that attestation (the
      # file `gh attestation verify --bundle` takes offline) is copied beside the tarball as
      # `<tarball>.sigstore.json`, for the release and for a host that verifies without GitHub.
      - id: provenance-tierstore-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ github.sha }}-linux-x86_64.tar.gz
      - name: Name the bundle of tierstore for linux-x86_64
        env:
          BUNDLE: ${{ steps.provenance-tierstore-linux-x86_64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/tierstore-${GITHUB_SHA}-linux-x86_64.tar.gz.sigstore.json"
      - id: provenance-tierstore-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ github.sha }}-linux-arm64.tar.gz
      - name: Name the bundle of tierstore for linux-arm64
        env:
          BUNDLE: ${{ steps.provenance-tierstore-linux-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/tierstore-${GITHUB_SHA}-linux-arm64.tar.gz.sigstore.json"
      - id: provenance-tierstore-macos-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ github.sha }}-macos-arm64.tar.gz
      - name: Name the bundle of tierstore for macos-arm64
        env:
          BUNDLE: ${{ steps.provenance-tierstore-macos-arm64.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/tierstore-${GITHUB_SHA}-macos-arm64.tar.gz.sigstore.json"
      # Each hostkeeper package too, as its own subject, its bundle beside it as
      # `<package>.sigstore.json`: the file hostkeeper verifies a package with, offline.
      - id: provenance-hostkeeper-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ needs.sums.outputs.package-version }}-linux-x86_64.tar.zst
      - name: Name the bundle of the hostkeeper package for linux-x86_64
        env:
          BUNDLE: ${{ steps.provenance-hostkeeper-linux-x86_64.outputs.bundle-path }}
          PACKAGE_VERSION: ${{ needs.sums.outputs.package-version }}
        run: cp "$BUNDLE" "dist/tierstore-${PACKAGE_VERSION}-linux-x86_64.tar.zst.sigstore.json"
      - id: provenance-hostkeeper-linux-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ needs.sums.outputs.package-version }}-linux-arm64.tar.zst
      - name: Name the bundle of the hostkeeper package for linux-arm64
        env:
          BUNDLE: ${{ steps.provenance-hostkeeper-linux-arm64.outputs.bundle-path }}
          PACKAGE_VERSION: ${{ needs.sums.outputs.package-version }}
        run: cp "$BUNDLE" "dist/tierstore-${PACKAGE_VERSION}-linux-arm64.tar.zst.sigstore.json"
      - id: provenance-hostkeeper-macos-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ needs.sums.outputs.package-version }}-macos-arm64.tar.zst
      - name: Name the bundle of the hostkeeper package for macos-arm64
        env:
          BUNDLE: ${{ steps.provenance-hostkeeper-macos-arm64.outputs.bundle-path }}
          PACKAGE_VERSION: ${{ needs.sums.outputs.package-version }}
        run: cp "$BUNDLE" "dist/tierstore-${PACKAGE_VERSION}-macos-arm64.tar.zst.sigstore.json"
      # The tarball of each platform under the name the Homebrew tap downloads it by, and the Debian
      # package of each Linux platform, are signed the same way: each its own subject, its bundle
      # beside it as `<file>.sigstore.json`. They are named by the release's version (X.Y.Z), the
      # `version` job's output, which the build jobs gave the binary. The tap tarball is a copy of
      # the tarball above, so its SBOM attestation (by digest) is the one made above.
      - id: provenance-tap-linux-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
      - name: Name the bundle of the tap tarball for linux-x86_64
        env:
          BUNDLE: ${{ steps.provenance-tap-linux-x86_64.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cp "$BUNDLE" "dist/tierstore-${RELEASE_VERSION}-linux-x86_64.tar.gz.sigstore.json"
      - id: provenance-tap-linux-aarch64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ needs.version.outputs.version }}-linux-aarch64.tar.gz
      - name: Name the bundle of the tap tarball for linux-arm64
        env:
          BUNDLE: ${{ steps.provenance-tap-linux-aarch64.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cp "$BUNDLE" "dist/tierstore-${RELEASE_VERSION}-linux-aarch64.tar.gz.sigstore.json"
      - id: provenance-tap-macos-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ needs.version.outputs.version }}-macos-arm64.tar.gz
      - name: Name the bundle of the tap tarball for macos-arm64
        env:
          BUNDLE: ${{ steps.provenance-tap-macos-arm64.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cp "$BUNDLE" "dist/tierstore-${RELEASE_VERSION}-macos-arm64.tar.gz.sigstore.json"
      - id: provenance-deb-amd64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore_${{ needs.version.outputs.version }}_amd64.deb
      - name: Name the bundle of the Debian package for linux-x86_64
        env:
          BUNDLE: ${{ steps.provenance-deb-amd64.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cp "$BUNDLE" "dist/tierstore_${RELEASE_VERSION}_amd64.deb.sigstore.json"
      - id: provenance-deb-arm64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore_${{ needs.version.outputs.version }}_arm64.deb
      - name: Name the bundle of the Debian package for linux-arm64
        env:
          BUNDLE: ${{ steps.provenance-deb-arm64.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cp "$BUNDLE" "dist/tierstore_${RELEASE_VERSION}_arm64.deb.sigstore.json"
      - id: provenance-rpm-x86_64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ needs.version.outputs.version }}-1.x86_64.rpm
      - name: Name the bundle of the RPM package for linux-x86_64
        env:
          BUNDLE: ${{ steps.provenance-rpm-x86_64.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cp "$BUNDLE" "dist/tierstore-${RELEASE_VERSION}-1.x86_64.rpm.sigstore.json"
      - id: provenance-rpm-aarch64
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tierstore-${{ needs.version.outputs.version }}-1.aarch64.rpm
      - name: Name the bundle of the RPM package for linux-arm64
        env:
          BUNDLE: ${{ steps.provenance-rpm-aarch64.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cp "$BUNDLE" "dist/tierstore-${RELEASE_VERSION}-1.aarch64.rpm.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles
          path: dist/*.sigstore.json
          retention-days: 90
          if-no-files-found: error

  # Push to main only, after attest: the checks a deployment makes (cargo xtask verify-assets,
  # crates/xtask/src/sums.rs), for the branch that was pushed (`--source-ref "$GITHUB_REF"`),
  # with read-only scopes. The release index is made again and the files are assembled again into
  # a SHA256SUMS that must be byte for byte the one the sums job published and the attest job
  # signed, then checked against it, then each verified, each bundle offline as a host does; the
  # set must be exactly the assets of this commit (cargo xtask release check); and the hostkeeper
  # packages are taken as hostkeeper takes them (cargo xtask verify-assets hostkeeper-index).
  verify:
    needs: [attest]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # `assets-*` is the build jobs' artifacts, one per platform, and nothing else: the run's
      # other artifacts are `sha256sums` and `bundles`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: published
      # The bundles go in beside the files; the sums do not list them (the attestation that made
      # them signed the files the sums list), and the check below holds them to one per tarball.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist
      # The release index is made again from the packages, as the sums job made it; the sums
      # below, which list it, must then be the published ones byte for byte.
      - name: The release index, made again from the packages
        run: cargo xtask release hostkeeper-index dist --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME"
      - name: Assemble SHA256SUMS, which must be the published one
        run: cargo xtask sums assemble dist --expect published/SHA256SUMS
      - name: Check the files against SHA256SUMS
        run: cargo xtask verify-assets sums dist
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify as a deployment does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --source-ref "$GITHUB_REF" --commit "$GITHUB_SHA" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: The files are exactly the assets of this commit, each tarball and package with its bundle
        run: cargo xtask release check dist --commit "$GITHUB_SHA"
      # As hostkeeper takes a release: the index lists a package for every platform, each the size
      # and SHA-256 of its file, and each unpacks under hostkeeper's rules.
      - name: Each hostkeeper package as a host takes it from the release index
        run: cargo xtask verify-assets hostkeeper-index dist --commit "$GITHUB_SHA" --scratch "$RUNNER_TEMP/hostkeeper"
