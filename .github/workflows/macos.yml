# The macOS checks of every pull request: every test of the workspace on macOS, and the macOS
# build, package and checks that artifacts.yml's `macos-arm64` job makes after a merge.
#
# - `version` (Linux) computes the version the build is given, as the `version` job of
#   artifacts.yml does (it reads the repository's tags with the token), so the macOS job needs no
#   token.
# - `macos` (macOS, GitHub-hosted, macos-15): every test of the workspace on macOS, then the
#   build, the package, the hostkeeper package and the checks of them (the binary names the commit
#   and the version, built and unpacked from the tarball; the package unpacks with hostkeeper's own
#   unpacker; the unpacked binary's code signature is valid). It uploads nothing, saves no cache
#   and signs nothing; it holds `contents: read` alone and no secret, no token and no OIDC scope.
#   Its name is not `macos-arm64`: a pull request's run of artifacts.yml has a job of that name,
#   skipped, and a check named `macos-arm64` would pass on it. If `version` fails, `macos` is
#   skipped and the run fails on `version`.
#
# A pull request's newer run cancels its older one, so a burst of pushes holds one macOS runner.
# Pull requests only: a push to main builds and tests macOS in artifacts.yml, unchanged. The
# workflow lint (crates/xtask/tests/workflows/macos_pr.rs) pins this file: its jobs, the commands
# of each (the macOS job's are artifacts.yml's, with the workspace's tests), the cache it
# restores, the cargo-cyclonedx pins (artifacts.yml's), and no secret or write scope in a macOS
# job.
name: macos

on:
  pull_request:

permissions: {}

concurrency:
  group: macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # cargo-cyclonedx makes the SBOM, as in artifacts.yml (the lint holds these to its pins).
  CYCLONEDX_VERSION: 0.5.9
  CYCLONEDX_SHA256_AARCH64_MACOS: 4c53dfa21e70b65bf7f8d2592aadde3bcb02c1a40b6ec63b877e5ca65a29e180

defaults:
  run:
    shell: bash

jobs:
  # The version of the build: the version the base of the pull request would release next.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: The version of the next release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release version --repo "$GITHUB_REPOSITORY" --version-file VERSION --output "$GITHUB_OUTPUT"

  # The tests of the workspace and the macOS build of artifacts.yml. The cache is artifacts.yml's
  # macOS cache: its key names that job, `macos-arm64`, where artifacts.yml's has
  # `${{ github.job }}`, so this job restores what a push to main saves there; it saves nothing.
  macos:
    needs: [version]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TARGET: aarch64-apple-darwin
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-macos-arm64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-macos-arm64-
      - name: Install cargo-cyclonedx (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-$CYCLONEDX_VERSION/cargo-cyclonedx-$TARGET.tar.xz" --sha256 "$CYCLONEDX_SHA256_AARCH64_MACOS" --out "$HOME/.cargo/bin/cargo-cyclonedx" --extract tar.xz --member "cargo-cyclonedx-$TARGET/cargo-cyclonedx"
      - run: cargo cyclonedx --version
      # Every test of every crate of the workspace, on macOS: the update hook's launchd steps, the
      # listener hand-off, packaging/macos (tests/packaging_macos.rs) and the xtask verbs among
      # them.
      - name: The tests of the workspace, on macOS
        run: cargo test --locked --workspace --features tierstore/s3 --no-fail-fast
      # From here, the commands of artifacts.yml's macos-arm64 job, in its order.
      - name: The crate takes the version of the release
        run: cargo xtask release set-version --version "$RELEASE_VERSION"
      - name: Keep the lock file as written
        run: cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      - run: cargo build --locked --release --target "$TARGET" -p tierstore --features server --bin tierstore
      - name: tierstore names the commit and the version
        run: cargo xtask build-commit "target/$TARGET/release/tierstore" "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - name: SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --describe binaries --target "$TARGET"
      - name: The SBOM step left Cargo.lock unchanged
        run: cmp Cargo.lock "$RUNNER_TEMP/Cargo.lock.release"
      - name: Resolve the crates of this build
        run: cargo metadata --locked --format-version 1 --manifest-path crates/tierstore/Cargo.toml --features server --filter-platform "$TARGET" > "$RUNNER_TEMP/metadata.json"
      - name: Third-party licence notice
        run: cargo xtask licenses --metadata "$RUNNER_TEMP/metadata.json" --package tierstore --out "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
      - name: Package tierstore
        run: cargo xtask package --binary "target/$TARGET/release/tierstore" --sbom crates/tierstore/tierstore_bin.cdx.json --licenses "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" --platform macos-arm64 --commit "$GITHUB_SHA" --out dist
      - run: mkdir "$RUNNER_TEMP/unpacked"
      - run: tar -xzf "dist/tierstore-${GITHUB_SHA}-macos-arm64.tar.gz" -C "$RUNNER_TEMP/unpacked" tierstore
      - name: The packaged tierstore names the commit and the version
        run: cargo xtask build-commit "$RUNNER_TEMP/unpacked/tierstore" "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - name: The hostkeeper package
        run: cargo xtask release hostkeeper-package --binary "target/$TARGET/release/tierstore" --version "$RELEASE_VERSION+${GITHUB_SHA::12}" --min-hostkeeper 0.1.0 --platform macos-arm64 --out dist
      - name: The hostkeeper package unpacks as a host unpacks it
        run: cargo xtask verify-assets hostkeeper-package dist --version "$RELEASE_VERSION+${GITHUB_SHA::12}" --platform macos-arm64 --scratch "$RUNNER_TEMP/hostkeeper"
      - name: The tarball named as the Homebrew tap downloads it
        run: cargo xtask release tap-tarball dist --commit "$GITHUB_SHA" --version "$RELEASE_VERSION" --platform macos-arm64
      - name: The packaged binary carries a valid code signature
        run: codesign --verify --strict "$RUNNER_TEMP/hostkeeper/packages/tierstore/$RELEASE_VERSION+${GITHUB_SHA::12}/bin/tierstore"
