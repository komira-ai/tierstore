# Publishes tierstore.dev: the site (crates/tierstore/site) built, tested and uploaded on every
# push to main that changes it, or by hand from main. A GitHub environment holds the settings,
# the job proves who it is to the cloud with an OIDC token (no stored key), and a role that can
# only write this site's bucket and invalidate its distribution does the upload. The file name is
# part of the contract: the role's trust names this workflow file at refs/heads/main, the
# environment below, and the id of this repository.
#
# The upload is OFF until the repository variable TIERSTORE_SITE_PUBLISH is set to `true`: the
# `build` job runs and the `deploy` job is skipped. The one-time setup is done by a maintainer
# (a maintainer, once): the environment `prod-site-tierstore`, its three variables, the role
# whose trust is pinned to this repository, and then this variable.
#
# Two jobs, so that nothing built from the repository's code ever runs beside the cloud token:
#  - build  (no token, no environment): the same steps as tierstore-site.yml (typecheck, the
#           tests, the build), then the built dist/ alone is handed on as an artifact (the pages
#           are data; no program travels);
#  - deploy (the token, the environment): checks out the commit's publish program
#           (tools/publish.ts) and the Node version file, nothing else, downloads the pages, and
#           runs the program from source with Node's type stripping. It installs and builds
#           nothing, and the program imports `node:` built-ins only, so no code that ran in the
#           build job (dependencies, tsc, the tests) is ever what holds the credentials.
# The job that holds `id-token: write` is the only one with `environment:`, runs only for a push
# to main or a manual run of main once the variable is set, and needs the build. The workflow
# lint (crates/xtask/tests/workflows) holds the scope to that exact condition.
#
# Settings are repository variables of the environment: the bucket (TIERSTORE_SITE_BUCKET), the
# distribution id (TIERSTORE_SITE_DISTRIBUTION_ID) and the role ARN
# (TIERSTORE_SITE_PUBLISH_ROLE_ARN). There is no secret. An unset variable is an empty flag and
# the program refuses it.
name: tierstore-site-publish

on:
  push:
    branches: [main]
    paths:
      - crates/tierstore/site/**
      - crates/tierstore/docs/**
      - crates/tierstore/src/**
      - .github/workflows/tierstore-site-publish.yml
  workflow_dispatch:

permissions: {}

# Two deploys never overlap and a deploy that has started is never cancelled; a later push waits
# its turn.
concurrency:
  group: tierstore-site-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/tierstore/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/tierstore/site/.node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tierstore-site
          path: crates/tierstore/site/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.TIERSTORE_SITE_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: prod-site-tierstore
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            crates/tierstore/site/.node-version
            crates/tierstore/site/tools/publish.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/tierstore/site/.node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tierstore-site
          path: dist
      - name: Upload the site and invalidate the distribution
        env:
          BUCKET: ${{ vars.TIERSTORE_SITE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.TIERSTORE_SITE_DISTRIBUTION_ID }}
          ROLE_ARN: ${{ vars.TIERSTORE_SITE_PUBLISH_ROLE_ARN }}
          COMMIT: ${{ github.sha }}
        run: node crates/tierstore/site/tools/publish.ts --dist dist --bucket "$BUCKET" --distribution-id "$DISTRIBUTION_ID" --role-arn "$ROLE_ARN" --region us-east-1 --commit "$COMMIT"
