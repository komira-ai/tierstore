    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the signing key and on the read (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.testing-apt-read-3.outputs.enabled }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: cargo xtask channels gate --label testing-apt-index-3 --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --setting "APT_GPG_FINGERPRINT=${APT_GPG_FINGERPRINT:+set}" --setting "APT_GPG_PRIVATE_KEY=${APT_GPG_PRIVATE_KEY:+set}" --setting "APT_GPG_PASSPHRASE=${APT_GPG_PASSPHRASE:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-current-3
          path: ${{ runner.temp }}/apt-current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-assets
          path: dist
      - name: The files are exactly the assets of this commit, and match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          cargo xtask release check dist --commit "$COMMIT"
      - name: Merge the .debs into the index that was read (the entries of every other product are kept)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: cargo xtask channels apt index --suite testing --current "$RUNNER_TEMP/apt-current" --out "$RUNNER_TEMP/apt-next" --debs dist --version "${TAG#v}" --origin "$OWNER" --label "$OWNER" --description "$OWNER packages" --date "$(date +%s)"
      - name: Sign Release with the signing subkey (InRelease and Release.gpg), then remove the key
        id: sign
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          umask 077
          printf '%s' "$APT_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/apt-key.asc"
          printf '%s' "$APT_GPG_PASSPHRASE" > "$RUNNER_TEMP/apt-passphrase"
          cargo xtask channels apt sign --dir "$RUNNER_TEMP/apt-next/dists/testing" --work "$RUNNER_TEMP/apt-sign" --fingerprint "$APT_GPG_FINGERPRINT" --key-file "$RUNNER_TEMP/apt-key.asc" --passphrase-file "$RUNNER_TEMP/apt-passphrase" --output "$GITHUB_OUTPUT"
