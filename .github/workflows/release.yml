# A GitHub release of the exact files a push to main built and signed for one commit
# (artifacts.yml). Nothing is built or signed here: the files are the ones that push left in its
# run, checked again, so a host can pin a release asset, which outlives the run's 90-day
# workflow artifacts.
#
# Every push to main that changes code and passes ci.yml and artifacts.yml is released by itself.
# There are two triggers and no others (the workflow lint, crates/xtask/tests/workflows, pins
# them):
#
# - `workflow_run`: the completion of a run of `ci` or of `artifacts` on main. Both workflows run
#   on every push to main, side by side, so this starts once for each of them. Only a run that
#   succeeded, for a push, to main of this repository, is acted on (the `if:` of `plan`); and the
#   plan lets the run that finishes last go on, because it looks for a successful push run of
#   both for that commit (`cargo xtask release plan`). The other starts, finds one missing, and
#   ends green with nothing to do. No tag starts this workflow.
# - `workflow_dispatch`: the manual override, from main, with the tag (`v<major>.<minor>.<patch>`)
#   and the full SHA of the commit, as before. It is not held by the freeze.
#
# Why not one workflow that calls ci and artifacts, as a pipeline would: artifacts.yml is the
# signer identity the installers verify, and ci.yml and artifacts.yml are also the checks of a
# pull request. Making them callable would move the push runs `release locate` and the
# attestation check look for. `workflow_run` leaves both files as they are.
#
# plan     read-only. Decides whether this commit is released and as which tag, and prints it
#          (cargo xtask release plan; by hand, cargo xtask release manual). No release when the
#          repository variable RELEASE_FREEZE is set to anything but empty or `false`; when ci or artifacts has no successful
#          push run for the commit yet; when an existing release already covers it; or when
#          everything since the highest release tag is documentation (the paths are listed in
#          docs/ci-and-release.md and held by a test). Otherwise the tag is the patch after the
#          highest v<major>.<minor>.<patch> tag, or the version in the VERSION file at the root
#          when that is higher. The change is measured from the highest tag, not from the push,
#          so the code of a push whose run was replaced or failed is in the next release. The note
#          lists the titles of the commits since that tag.
# verify   refuses a commit that is not on main, or that lacks a successful push run of
#          artifacts.yml (the files and their signatures) or of ci.yml (the lint and the tests)
#          (cargo xtask release locate), downloads the files of that run, checks them against
#          SHA256SUMS and against the assets of the commit (cargo xtask release check), and verifies
#          every attestation as a deployment does and every bundle offline as a host does. Read-only,
#          and it runs before anything is tagged.
# publish  the one job that holds `contents: write`. It checks the same files again, creates the
#          release as a draft at the commit with those files, reads the draft's assets back, and
#          only then publishes it, which is when GitHub creates the tag (cargo xtask release
#          publish). A tag or a release that exists is refused; a draft a failed run left is
#          replaced. Re-run the failed jobs of a run, not the whole run.
# gamma    the last stage. Sets the published release as the desired version of the service
#          `tierstore` on the farm's update coordinator and waits for the farm to converge
#          (kbf's `cargo xtask deploy-farm --service tierstore`); it passes with a notice when
#          the repository variable KBF_COORDINATOR_URL is unset. The one job that holds
#          `id-token: write`, and no write scope; the lint pins its needs, `if:`, environment
#          and permissions.
#
# verify also runs the downloaded linux-x86_64 binary with `--version` and refuses to go on
# unless it says exactly the tag (without the v) and the first 12 digits of the commit
# (cargo xtask release check-binary): artifacts.yml built it under the version that
# `cargo xtask release version` computed, and the plan names the tag with the same computation,
# so they differ only when a tag appeared between the build and the release, and then nothing
# is published.
#
# One release action at a time, never cancelled: the group is kbf's release.yml group with two
# more conditions (`release-main` for a run that succeeded for a push to this repository, a group
# of its own for any other, so that it cannot replace the release that is waiting: a pull request
# from a fork's branch named main also matches `branches: [main]` above). Every workflow that
# tags, publishes or deploys is in that group, the farm deploy included when it is added; the
# workflow lint finds them by what they do and holds each to it (artifacts.yml, which only
# builds and attests, is exempt and has a group per commit).
# GitHub keeps one waiting run per group, so a third replaces the second; nothing is lost by
# that, since the plan measures from the highest tag. A manual run of this workflow takes a group
# of its own (publish refuses a tag or release that exists). The lint also holds `contents: write`
# to the `publish` job alone, `plan` to read access, and this file to no build and no signing
# step.
name: release

on:
  workflow_run:
    workflows: [ci, artifacts]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, v<major>.<minor>.<patch>"
        type: string
        required: true
      commit:
        description: "The full SHA of a commit on main whose push run built and signed the files"
        type: string
        required: true
      note:
        description: "A paragraph for the release notes (where the files came from, what changed)"
        type: string
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  plan:
    # A manual run of main, or a finished run of ci or artifacts that succeeded, for a push to
    # main of this repository (not a pull request, not a fork's branch named main).
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.auto.outputs.release || steps.manual.outputs.release }}
      tag: ${{ steps.auto.outputs.tag || steps.manual.outputs.tag }}
      commit: ${{ steps.auto.outputs.commit || steps.manual.outputs.commit }}
      note: ${{ steps.auto.outputs.note || steps.manual.outputs.note }}
    steps:
      # The commit the run built, not `github.sha` (for a `workflow_run`, the newest commit of
      # main): its VERSION file is the one read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Whether this push is released, and as which tag
        id: auto
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          # The stop switch: `true` releases nothing until an admin clears it.
          FREEZE: ${{ vars.RELEASE_FREEZE }}
        run: cargo xtask release plan --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --version-file VERSION --freeze "$FREEZE" --output "$GITHUB_OUTPUT"
      # The inputs are read as environment variables of the step, never spliced into a script.
      - name: The tag and commit of a manual run
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          NOTE: ${{ inputs.note }}
        run: cargo xtask release manual --repo "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$COMMIT" --note "$NOTE" --output "$GITHUB_OUTPUT"

  verify:
    needs: [plan]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    outputs:
      run-id: ${{ steps.locate.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      # xtask is compiled here, before any step holds a token, so no build script runs beside one.
      - name: Compile xtask
        run: cargo xtask --help
      - name: Refuse a commit not on main, without a green build and tests, or that lost an artifact
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release locate --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-linux-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: published
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      # The provenance bundle of each tarball (`<tarball>.sigstore.json`), which the sums do not
      # list: the attestation that made it signed the files they list.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-linux
          path: dist
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      # The assets artifacts carry the SHA256SUMS.<platform> files the sums were made from;
      # assembling them must give the published SHA256SUMS, and removes them from dist (they
      # are not release assets).
      - name: Assemble SHA256SUMS, which must be the published one
        run: cargo xtask sums assemble dist --expect published/SHA256SUMS
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are exactly the assets of this commit, each tarball with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      # The runner is linux-x86_64: the binary of that tarball is run, and refused unless it says
      # the tag (without the v) and the commit. Unpacked outside dist, which holds the assets.
      - name: The binary says the tag and the commit it is released under
        run: cargo xtask release check-binary dist --tag "$TAG" --commit "$COMMIT" --scratch "$RUNNER_TEMP/binary"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation as a deployment does, and every bundle as a host does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --source-ref refs/heads/main --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [plan, verify]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The same checks as the verify job, on the files this job downloaded: they crossed the
      # run's artifact store.
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are exactly the assets of this commit, each tarball with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation again
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --source-ref refs/heads/main --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Create the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.verify.outputs.run-id }}
          NOTE: ${{ needs.plan.outputs.note }}
        run: cargo xtask release publish dist --repo "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$COMMIT" --run-id "$RUN_ID" --notes-file "$RUNNER_TEMP/release-notes.md" --note "$NOTE"

  # The gamma stage, the last step of a release: tell the farm's update coordinator "the desired
  # version of the service `tierstore` is this release" and wait until the farm converges
  # (docs/ci-and-release.md, "The gamma stage"). It runs only after the release is published,
  # under the same `if:` as verify and publish, in this workflow's non-cancelling `release-main`
  # group. It holds no write scope and no secret, and holds the run's OIDC token (`id-token:
  # write`) for the one thing it is for: the coordinator accepts a token of this workflow on
  # main, for the `release` environment, for the service `tierstore` and nothing else. The
  # coordinator's address is a repository variable, never written here: unset, the job prints a
  # notice and passes without fetching or compiling anything, so a fork, or a repository whose
  # coordinator does not know tierstore yet, is unaffected. The verb is kbf's `cargo xtask
  # deploy-farm` (komira-ai/kbf, at the commit pinned in KBF_DEPLOY_REF). It is bounded (its `--deadline-min`, 60 by default,
  # under this job's timeout), and a farm that is blocked, stalled or out of time fails the job;
  # the release stays published whatever this job says. No kbf minimums are passed: for a
  # service other than kbf the coordinator's services file holds them.
  gamma:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # The kbf commit whose deploy verb this job builds and runs, pinned here so that a change
      # of it is a reviewed pull request, and a kbf main that moves or breaks does not move or
      # break a release. It must contain `deploy-farm --service` (komira-ai/kbf#2218) before
      # KBF_COORDINATOR_URL is set. The lint holds it to 40 lowercase hex digits.
      KBF_DEPLOY_REF: 06517a755e46e21fb540a89ef5f919746ee5c1d5
    steps:
      - name: The deploy step is off
        if: ${{ vars.KBF_COORDINATOR_URL == '' }}
        run: |
          echo "::notice::the gamma stage is off, the repository variable KBF_COORDINATOR_URL is unset: no farm was told about this release"
      # The verb is kbf's. It is checked out and built before the token is used, and the token
      # service's address and key are in the environment of every step of this job, the build's
      # scripts included: kbf builds from its locked dependency set, and the coordinator's
      # allow-list (this workflow, on main, for `release`, for `tierstore`) and the hosts' own
      # signature and hash checks bound what a token can do.
      - name: Check out kbf, for the deploy verb
        if: ${{ vars.KBF_COORDINATOR_URL != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: komira-ai/kbf
          ref: ${{ env.KBF_DEPLOY_REF }}
          path: kbf
          persist-credentials: false
      - name: Build the deploy verb
        if: ${{ vars.KBF_COORDINATOR_URL != '' }}
        working-directory: kbf
        run: |
          rustup toolchain install
          cargo xtask --help
          echo "kbf commit: $(git rev-parse HEAD)"
      # When the coordinator is reachable only on a Tailscale network: join it, after the build
      # (its scripts never see that network), as an ephemeral node. Tailscale's workload identity
      # federation takes this run's OIDC token, so the job still holds no secret. The client id
      # and the audience are the variables TS_CLIENT_ID and TS_AUDIENCE, as in kbf's release.
      - name: Join the farm's Tailscale network
        if: ${{ vars.KBF_COORDINATOR_URL != '' && vars.TS_CLIENT_ID != '' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      # The version is the one tierstore's hosts report (`tierstore --version` and the build
      # gauge's `version` label): the tag without its `v`, `+`, the first 12 digits of the
      # commit, which verify checked the published binary says.
      - name: Set this release as tierstore's desired version, and wait for the farm to converge
        if: ${{ vars.KBF_COORDINATOR_URL != '' }}
        working-directory: kbf
        env:
          COORDINATOR_URL: ${{ vars.KBF_COORDINATOR_URL }}
          # The farm CA's certificate (public), which the coordinator's certificate chains to.
          COORDINATOR_CA: ${{ vars.KBF_COORDINATOR_CA }}
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: cargo xtask deploy-farm --service tierstore --url "$COORDINATOR_URL" --ca-pem "$COORDINATOR_CA" --version "${TAG#v}+${COMMIT:0:12}"
