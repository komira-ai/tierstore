# A GitHub release of the exact files a push to main built and signed for one commit
# (artifacts.yml). Nothing is built or signed here: the files are the ones that push left in its
# run, checked again, so a host can pin a release asset, which outlives the run's 90-day
# workflow artifacts.
#
# It is started by hand (`workflow_dispatch`) from main, with the tag (`v<major>.<minor>.<patch>`)
# and the full SHA of the commit. There is no other trigger: nothing tags or releases by itself.
# The workflow lint (crates/xtask/tests/workflows) holds `contents: write` to the `publish` job
# alone, and holds this file to no build and no signing step.
#
# verify   refuses a commit that is not on main, or that lacks a successful push run of
#          artifacts.yml (the files and their signatures) or of ci.yml (the lint and the tests)
#          (cargo xtask release locate), downloads the files of that run, checks them against
#          SHA256SUMS and against the assets of the commit (cargo xtask release check), and verifies
#          every attestation as a deployment does and every bundle offline as a host does. Read-only,
#          and it runs before anything is tagged.
# publish  the one job that holds `contents: write`. It checks the same files again, creates the
#          release as a draft at the commit with those files, reads the draft's assets back, and
#          only then publishes it, which is when GitHub creates the tag (cargo xtask release
#          publish). A tag or a release that exists is refused; a draft a failed run left is
#          replaced. Re-run the failed jobs of a run, not the whole run.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, v<major>.<minor>.<patch>"
        type: string
        required: true
      commit:
        description: "The full SHA of a commit on main whose push run built and signed the files"
        type: string
        required: true
      note:
        description: "A paragraph for the release notes (where the files came from, what changed)"
        type: string
        required: false
        default: ''

permissions: {}

# One release at a time, none cancelled: a second one waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The inputs are read as environment variables of the steps, never spliced into a script.
  COMMIT: ${{ inputs.commit }}
  TAG: ${{ inputs.tag }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      run-id: ${{ steps.locate.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      # xtask is compiled here, before any step holds a token, so no build script runs beside one.
      - name: Compile xtask
        run: cargo xtask --help
      - name: Refuse a commit not on main, without a green build and tests, or that lost an artifact
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release locate --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-linux-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: published
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      # The provenance bundle of each tarball (`<tarball>.sigstore.json`), which the sums do not
      # list: the attestation that made it signed the files they list.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles-linux
          path: dist
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      # The assets artifacts carry the SHA256SUMS.<platform> files the sums were made from;
      # assembling them must give the published SHA256SUMS, and removes them from dist (they
      # are not release assets).
      - name: Assemble SHA256SUMS, which must be the published one
        run: cargo xtask sums assemble dist --expect published/SHA256SUMS
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are exactly the assets of this commit, each tarball with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation as a deployment does, and every bundle as a host does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --source-ref refs/heads/main --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [verify]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The same checks as the verify job, on the files this job downloaded: they crossed the
      # run's artifact store.
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are exactly the assets of this commit, each tarball with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation again
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --source-ref refs/heads/main --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Create the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.verify.outputs.run-id }}
          NOTE: ${{ inputs.note }}
        run: cargo xtask release publish dist --repo "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$COMMIT" --run-id "$RUN_ID" --notes-file "$RUNNER_TEMP/release-notes.md" --note "$NOTE"
