          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels apt write --suite testing --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/apt-next" --debs dist --version "${TAG#v}" --last --output "$GITHUB_OUTPUT"

  # TESTING, the rpm tree of the repository packages.komira.ai: the release's RPM packages, signed,
  # into the pool and the repodata of the suite `testing` (docs/design/distribution.md, sections 5
  # and 8). The same three jobs and up to three attempts as the apt repository, and the same
  # environments, settings and key; no job holds both the signing key and the cloud role:
  #   testing-rpm-read   (environment apt-publish: the role, no key) reads repomd.xml and
  #                      repomd.xml.asc of each architecture, with their ETags, and the files they
  #                      list, from S3;
  #   testing-rpm-index  (environment apt-signing: the key, no role) signs the .rpms (the signature
  #                      header only: the unsigned bytes are the attested ones), merges them into
  #                      that repodata, keeping every other product's packages, and signs
  #                      repomd.xml;
  #   testing-rpm-write  (environment apt-publish) checks the signed packages against SHA256SUMS,
  #                      uploads them once each, then the repodata, with If-Match on the ETags that
  #                      were read.
  # A write that finds repomd.xml changed in between (another product's release) reports
  # conflict=true and ends green; attempt 2 (the jobs with the suffix -2), and then 3, read, merge
  # and sign again, and the last one fails instead of asking for a fourth. A job without its
  # settings ends green with a notice and writes nothing; so does one while the repository variable
  # RPM_REPO_READY is not `true` (it is set once the rpm tree of the repository is deployed, so a
  # release before that does not fail on AccessDenied).

  testing-rpm-read:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository (a job without them does nothing and ends green)
        id: gate
        env:
          RPM_REPO_READY: ${{ vars.RPM_REPO_READY }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label testing-rpm-read --output "$GITHUB_OUTPUT" --require "RPM_REPO_READY=$RPM_REPO_READY" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Read the current repodata and the ETag of repomd.xml and its signature from S3 (never through the CDN, which caches the index)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: cargo xtask channels rpm repo read --suite testing --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/rpm-current"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: rpm-current
          path: ${{ runner.temp }}/rpm-current
          if-no-files-found: error
          retention-days: 1

  testing-rpm-index:
    needs: [plan, testing-rpm-read]
