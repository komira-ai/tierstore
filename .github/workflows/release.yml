          cargo xtask channels rpm sign --rpms dist --out "$RUNNER_TEMP/rpm-signed" --version "${TAG#v}" --sums dist/SHA256SUMS --work "$RUNNER_TEMP/rpm-sign-packages" --fingerprint "$APT_GPG_FINGERPRINT" --key-file "$RUNNER_TEMP/rpm-key.asc" --passphrase-file "$RUNNER_TEMP/rpm-passphrase" --signed-at "$(git show --no-patch --format=%ct HEAD)"
