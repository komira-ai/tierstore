      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Install tierstore from the suite testing in a clean Ubuntu container
        env:
          ARCH: ${{ matrix.arch }}
        run: docker run --rm --volume "$PWD/target/debug/xtask:/usr/local/bin/xtask:ro" ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852 xtask channels check-apt --arch "$ARCH" --version "${TAG#v}" --commit "$COMMIT"

  # check-rpm: the release installed with dnf from the suite testing, in a clean container of each
  # of three distributions (the current Fedora, AlmaLinux 9 and Amazon Linux 2023, each pinned by
  # digest), on a hosted runner of each architecture. The container is the system that is checked
  # and the verb runs on the runner (`docker exec`): the runner's binary is built against a newer C
  # library than these distributions have.
  check-rpm:
    needs: [plan, testing-rpm-write, testing-rpm-write-2, testing-rpm-write-3]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && (needs.testing-rpm-write.outputs.conflict == 'false' || needs.testing-rpm-write-2.outputs.conflict == 'false' || needs.testing-rpm-write-3.outputs.conflict == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image:
          - fedora@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c
          - almalinux@sha256:245f8aab832fe800aa42bdab5fad75ebbd8e0b4c9f24820a83c638b177857ae2
          - amazonlinux@sha256:3ccfbe800f864982b0a4e124a614b2382518cbd04b3c1cd35202bd46f392675b
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Start a clean container of the image
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --detach --name check-rpm "$IMAGE" sleep infinity
      - name: Install tierstore from the suite testing in it with dnf, and hold the installed system to what the package promises
        env:
          ARCH: ${{ matrix.arch }}
        run: cargo xtask channels check-rpm --container check-rpm --arch "$ARCH" --version "${TAG#v}" --commit "$COMMIT"

  # check-brew: the rendered formula installed with Homebrew from a local tap (brew refuses a
  # bare path), on the hosted macos-15 runner, and the binary it installed says the release.
  check-brew:
    needs: [plan, formula]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formula
          path: ${{ runner.temp }}/formula
      - name: Install the rendered formula from a local tap and run the binary it installed
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
        run: cargo xtask channels check-brew --formula "$RUNNER_TEMP/formula/tierstore.rb" --version "${TAG#v}" --commit "$COMMIT"

  # check-install-sh: install.sh as tierstore.dev serves it, with --version <version>, on Linux
  # and on macOS; it needs the files testing-upload put at tierstore.dev/releases/<version>/, so
  # it is off when that job was.
  check-install-sh:
    needs: [plan, testing-upload]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.testing-upload.outputs.enabled == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Install the version with install.sh from tierstore.dev and run the binary it installed
        run: cargo xtask channels check-install-sh --version "${TAG#v}" --commit "$COMMIT" --work "$RUNNER_TEMP/install-sh"

  # THE LAB (docs/design/distribution.md, section 5.3), after the install checks: the release is in
  # testing, installed on clean machines, and now hostkeeper installs the Debian package from the
  # suite testing on the lab. Three jobs.
  #
  #   farm-check  (read; the settings are repository variables, as hostkeeper-desired has them)
  #               the gate (`channels gate`: none of HOSTKEEPER_COORDINATOR_URL and
  #               HOSTKEEPER_COORDINATOR_CA set is a green no-op, some is red, and the tailnet's
  #               three variables are all or none), then `release desired-deb` for the release
  #               just published: the testing suite, read as a client reads it, lists the
  #               package of both architectures with the digests of the release's SHA256SUMS.
  #               Its package-version (the package's, `X.Y.Z`) and package-digest are what the
  #               coordinator is given.
  #   farm        hostkeeper's reusable workflow set-desired.yml, pinned as hostkeeper-desired
  #               pins it (a job that calls a workflow has no steps, which is why the gate is the
  #               job before it): it proves the pinned hostkeeper, joins the tailnet when the
  #               tailnet's variables are set, sets the desired version of the service tierstore
  #               with this job's OIDC token and reads the convergence every 10 seconds until the
  #               coordinator reports the service converged. It fails otherwise, and so nothing
  #               public follows. The only job here that holds `id-token: write`.
  #   soak        FARM_SOAK_HOURS hours (a repository variable; empty is 0, which ends at once)
  #               after the lab converged (`channels soak`). It runs only when `farm` converged.
  #
  # With no lab configured (the coordinator's two repository variables empty) farm-check is a
  # green no-op with a notice, `farm` and `soak` are skipped, and the release goes on to the
  # promotion: `promote-check` accepts exactly that. With the lab configured it must converge
  # and soak, or nothing public follows.
  farm-check:
    needs: [plan, check-apt, check-brew, check-install-sh]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      tailnet: ${{ steps.tailnet.outputs.enabled }}
      package-version: ${{ steps.desired.outputs.package-version }}
      package-digest: ${{ steps.desired.outputs.package-digest }}
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the coordinator (a job without them does nothing and ends green)
        id: gate
        env:
          HOSTKEEPER_COORDINATOR_URL: ${{ vars.HOSTKEEPER_COORDINATOR_URL }}
          HOSTKEEPER_COORDINATOR_CA: ${{ vars.HOSTKEEPER_COORDINATOR_CA }}
        run: cargo xtask channels gate --label farm --output "$GITHUB_OUTPUT" --setting "HOSTKEEPER_COORDINATOR_URL=${HOSTKEEPER_COORDINATOR_URL:+set}" --setting "HOSTKEEPER_COORDINATOR_CA=${HOSTKEEPER_COORDINATOR_CA:+set}"
      # Only when the coordinator is reached over the tailnet: its three variables are all set or
      # none. None is not a failure here, it is a coordinator the runner reaches without a join.
      - name: Gate on the settings of the tailnet (none means no join)
        id: tailnet
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          HOSTKEEPER_TAILNET_CLIENT_ID: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID }}
          HOSTKEEPER_TAILNET_AUDIENCE: ${{ vars.HOSTKEEPER_TAILNET_AUDIENCE }}
          HOSTKEEPER_TAILNET_COORDINATOR: ${{ vars.HOSTKEEPER_TAILNET_COORDINATOR }}
        run: cargo xtask channels gate --label farm-tailnet --output "$GITHUB_OUTPUT" --setting "HOSTKEEPER_TAILNET_CLIENT_ID=${HOSTKEEPER_TAILNET_CLIENT_ID:+set}" --setting "HOSTKEEPER_TAILNET_AUDIENCE=${HOSTKEEPER_TAILNET_AUDIENCE:+set}" --setting "HOSTKEEPER_TAILNET_COORDINATOR=${HOSTKEEPER_TAILNET_COORDINATOR:+set}"
      # The testing suite is read as a client reads it, through the CDN (the write invalidated
      # /apt/dists/*), so the lab is only sent to a version a client can install. curl retries a
      # CDN that has not caught up for a few minutes.
      - name: Refuse a release the testing suite does not list with the digests of its SHA256SUMS
        id: desired
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release desired-deb --repo "$GITHUB_REPOSITORY" --version "${TAG#v}" --dir "$RUNNER_TEMP/desired" --output "$GITHUB_OUTPUT"

  farm:
    needs: [plan, farm-check]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.farm-check.outputs.enabled == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: komira-ai/hostkeeper/.github/workflows/set-desired.yml@32a9cc6f8242d0efbc3476391302062ff444dd47 # v0.1.44
    with:
      service: tierstore
      version: ${{ needs.farm-check.outputs.package-version }}
      package_digest: ${{ needs.farm-check.outputs.package-digest }}
      hostkeeper_version: 0.1.44
      hostkeeper_commit: 32a9cc6f8242d0efbc3476391302062ff444dd47
      coordinator_url: ${{ vars.HOSTKEEPER_COORDINATOR_URL }}
      coordinator_ca: ${{ vars.HOSTKEEPER_COORDINATOR_CA }}
      audience: tierstore-hostkeeper-release
      wait: true
      # One read every 10 seconds: the default, 360, waits about an hour for the farm.
      max_polls: ${{ fromJSON(vars.FARM_MAX_POLLS || '360') }}
      join_tailnet: ${{ needs.farm-check.outputs.tailnet == 'true' }}
      tailnet_client_id: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID }}
      tailnet_audience: ${{ vars.HOSTKEEPER_TAILNET_AUDIENCE }}
      tailnet_coordinator: ${{ vars.HOSTKEEPER_TAILNET_COORDINATOR }}

  # A timer, not a verdict: nobody approves it. Its hours start when the farm was read converged,
  # which `farm` (a called workflow, with no step of its own to stamp the time) leaves to this job's
  # first step; it is later by the queueing of one job, which only lengthens the soak. A job lives
  # 6 hours at most, so the tool refuses more than 5. It holds no token: the reads of a soak of
  # more than 0 hours need a call hostkeeper's CI client does not have yet (`channels soak` says
  # so and fails), so FARM_SOAK_HOURS stays 0 until then.
  soak:
    needs: [plan, farm-check, farm]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.farm.outputs.converged == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Keep reading the farm until the soak has passed (0 hours ends at once)
        env:
          FARM_SOAK_HOURS: ${{ vars.FARM_SOAK_HOURS }}
          PACKAGE_VERSION: ${{ needs.farm-check.outputs.package-version }}
        run: cargo xtask channels soak --hours "${FARM_SOAK_HOURS:-0}" --reached-at "$(date +%s)" --version "$PACKAGE_VERSION"

  # PROMOTION. promote-check re-reads the results of everything before it (cargo xtask channels
  # decide): the release is promoted when it was published to testing, installed from there on
  # clean machines, and, if the lab is configured, converged and soaked. An unconfigured lab is
  # skipped with a notice and does not hold the release. Re-running the failed jobs of a run
  # resumes: every write is write-once or idempotent and this job reads the results again.
  promote-check:
    needs: [plan, testing-upload, testing-apt-write, testing-apt-write-2, testing-apt-write-3, testing-rpm-write, testing-rpm-write-2, testing-rpm-write-3, check-apt, check-rpm, check-brew, check-install-sh, farm-check, farm, soak]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      promote: ${{ steps.decide.outputs.promote }}
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Decide whether the release in testing is promoted
        id: decide
        env:
          TESTING_UPLOAD: ${{ needs.testing-upload.result }}
          TESTING_APT_WRITE: ${{ needs.testing-apt-write.result }}
          TESTING_APT_WRITE_2: ${{ needs.testing-apt-write-2.result }}
          TESTING_APT_WRITE_3: ${{ needs.testing-apt-write-3.result }}
          TESTING_RPM_WRITE: ${{ needs.testing-rpm-write.result }}
          TESTING_RPM_WRITE_2: ${{ needs.testing-rpm-write-2.result }}
          TESTING_RPM_WRITE_3: ${{ needs.testing-rpm-write-3.result }}
          CHECK_APT: ${{ needs.check-apt.result }}
          CHECK_RPM: ${{ needs.check-rpm.result }}
          CHECK_BREW: ${{ needs.check-brew.result }}
          CHECK_INSTALL_SH: ${{ needs.check-install-sh.result }}
          FARM_CHECK: ${{ needs.farm-check.result }}
          FARM: ${{ needs.farm.result }}
          SOAK: ${{ needs.soak.result }}
          FARM_ENABLED: ${{ needs.farm-check.outputs.enabled }}
        run: cargo xtask channels decide --result "testing-upload=$TESTING_UPLOAD" --result "testing-apt-write=$TESTING_APT_WRITE" --result "testing-apt-write-2=$TESTING_APT_WRITE_2" --result "testing-apt-write-3=$TESTING_APT_WRITE_3" --result "testing-rpm-write=$TESTING_RPM_WRITE" --result "testing-rpm-write-2=$TESTING_RPM_WRITE_2" --result "testing-rpm-write-3=$TESTING_RPM_WRITE_3" --result "check-apt=$CHECK_APT" --result "check-rpm=$CHECK_RPM" --result "check-brew=$CHECK_BREW" --result "check-install-sh=$CHECK_INSTALL_SH" --result "farm-check=$FARM_CHECK" --result "farm=$FARM" --result "soak=$SOAK" --farm-enabled "$FARM_ENABLED" --output "$GITHUB_OUTPUT"

  # promote-latest: releases/latest.json, the pointer the install script and users follow, replaced
  # by this release after the bucket is read back and held to SHA256SUMS (cargo xtask channels
  # latest): nothing is uploaded again, the bytes that were installed and checked are the bytes
  # that become the newest. Same environment and role as testing-upload.
  promote-latest:
    needs: [plan, promote-check, testing-upload]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.promote-check.outputs.promote == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod-releases-tierstore
    permissions:
      contents: read
      id-token: write
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the release files and on testing-upload (a job without them does nothing and ends green)
        id: gate
        env:
          UPLOADED: ${{ needs.testing-upload.outputs.enabled }}
          BUCKET: ${{ vars.TIERSTORE_RELEASES_BUCKET }}
          ROLE_ARN: ${{ vars.TIERSTORE_RELEASES_ROLE_ARN }}
        run: cargo xtask channels gate --label promote-latest --output "$GITHUB_OUTPUT" --require "UPLOADED=$UPLOADED" --setting "TIERSTORE_RELEASES_BUCKET=${BUCKET:+set}" --setting "TIERSTORE_RELEASES_ROLE_ARN=${ROLE_ARN:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-assets
          path: dist
      - name: The files are exactly the assets of this commit
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Assume the release-files role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TIERSTORE_RELEASES_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Read the files of the version back, hold them to SHA256SUMS, then replace latest.json
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          BUCKET: ${{ vars.TIERSTORE_RELEASES_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.TIERSTORE_RELEASES_DISTRIBUTION_ID }}
        run: cargo xtask channels latest dist --tag "$TAG" --commit "$COMMIT" --bucket "$BUCKET" --distribution-id "$DISTRIBUTION_ID" --work "$RUNNER_TEMP/releases-upload"

  # The Homebrew formula of the release, as a pull request in the organisation's tap, which admits
  # only the renderer's exact output (its guard), opened after the promotion from the artifact
  # `formula` that check-brew installed. The job holds `contents: read`; the release bot's token is
  # for the tap repository alone, minted in the second to last step and given to the last one
  # alone. Until RELEASE_BOT_APP_ID and RELEASE_BOT_PRIVATE_KEY exist the job is a green no-op.
  tap:
    needs: [plan, promote-check, formula]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.promote-check.outputs.promote == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the release bot (a job without them does nothing and ends green)
        id: gate
        env:
          APP_ID: ${{ vars.RELEASE_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: cargo xtask channels gate --label tap --output "$GITHUB_OUTPUT" --setting "RELEASE_BOT_APP_ID=${APP_ID:+set}" --setting "RELEASE_BOT_PRIVATE_KEY=${PRIVATE_KEY:+set}"
      - name: The formula that check-brew installed
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formula
          path: ${{ runner.temp }}/formula
      - name: The token of the release bot, for the tap repository alone
        id: bot
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: The pull request that puts the formula of this release in the tap, with auto-merge when the tap allows it
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: cargo xtask channels tap --version "${TAG#v}" --formula-file "$RUNNER_TEMP/formula/tierstore.rb" --repo "$GITHUB_REPOSITORY" --tap-repo "$GITHUB_REPOSITORY_OWNER/homebrew-tap"

  # PROMOTION, the apt repository: the same three jobs for the suite `stable`. The read job reads
  # the index of testing and of stable; the index job lists the entries of this release that
  # testing holds in the index of stable (cargo xtask channels apt promote: held to the digests
  # of SHA256SUMS, every other product's entries kept, an older version or other bytes at the
  # same version refused); the write job writes the index with If-Match (apt write --no-pool: the
  # packages are in the pool already, none is uploaded). They run after promote-check, and only
  # when testing-apt-read had its settings.
  stable-apt-read:
    needs: [plan, promote-check, testing-apt-read]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && needs.promote-check.outputs.promote == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the apt repository (a job without them does nothing and ends green)
        id: gate
        env:
          TESTING_ENABLED: ${{ needs.testing-apt-read.outputs.enabled }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: cargo xtask channels gate --label stable-apt-read --output "$GITHUB_OUTPUT" --require "TESTING_ENABLED=$TESTING_ENABLED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
