      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: rpm-promoted-3
          path: |
            ${{ runner.temp }}/rpm-next/stable
            ${{ runner.temp }}/rpm-next/etags.txt
          if-no-files-found: error
          retention-days: 1

