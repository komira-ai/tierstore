# A GitHub release of the exact files a push to main built and signed for one commit
# (artifacts.yml). Nothing is built or signed here: the files are the ones that push left in its
# run, checked again, so a host can pin a release asset, which outlives the run's 90-day
# workflow artifacts.
#
# Every push to main that changes code and passes ci.yml and artifacts.yml is released by itself.
# There are two triggers and no others (the workflow lint, crates/xtask/tests/workflows, pins
# them):
#
# - `workflow_run`: the completion of a run of `ci` or of `artifacts` on main. Both workflows run
#   on every push to main, side by side, so this starts once for each of them. Only a run that
#   succeeded, for a push, to main of this repository, is acted on (the `if:` of `plan`). The plan
#   does not plan the commit that run built: it walks the first-parent history of the tip of main
#   (`github.sha`) down to the highest release tag, newest first, and releases the newest commit
#   that is ready (`cargo xtask release plan`). So a run that a newer one replaced in the group
#   below, or one that started before the other workflow finished, leaves nothing behind. No tag
#   starts this workflow.
# - `workflow_dispatch`: the manual override, from main, with the tag (`v<major>.<minor>.<patch>`)
#   and the full SHA of the commit, as before. It is not held by the freeze.
#
# Why not one workflow that calls ci and artifacts, as a pipeline would: artifacts.yml is the
# signer identity the installers verify, and ci.yml and artifacts.yml are also the checks of a
# pull request. Making them callable would move the push runs `release locate` and the
# attestation check look for. `workflow_run` leaves both files as they are.
#
# plan     read-only. Decides which commit is released and as which tag, and prints it
#          (cargo xtask release plan; by hand, cargo xtask release manual). The tag is the patch
#          after the highest v<major>.<minor>.<patch> tag, or the version in the VERSION file at
#          the root when that is higher. The commit is the newest of main, down to the highest
#          tag, that is ready: ci and artifacts each have a successful push run for it, and its
#          artifacts run recorded that version (the `version-<X.Y.Z>` artifact), so its binary
#          says the tag. A commit built under an older version (a release was published after its
#          build) is passed over, not retried: a newer commit's release carries its changes. No
#          release when the repository variable RELEASE_FREEZE is set to anything but empty or
#          `false`; when an existing release already covers the tip; when no commit is ready; or
#          when everything since the highest release tag is documentation (the paths are listed
#          in docs/ci-and-release.md and held by a test). The change is measured from the highest
#          tag, not from the push, so the code of a push whose run was replaced, failed or was
#          passed over is in the next release. The note lists the titles of the commits since
#          that tag.
# verify   refuses a commit that is not on main, or that lacks a successful push run of
#          artifacts.yml (the files and their signatures) or of ci.yml (the lint and the tests)
#          (cargo xtask release locate), downloads the files of that run, makes the release index
#          of the hostkeeper packages again, checks them against SHA256SUMS and against the assets
#          of the commit (cargo xtask release check), verifies every attestation as a deployment
#          does and every bundle offline as a host does, and takes each hostkeeper package from the
#          index and unpacks it as hostkeeper does. Read-only, and it runs before anything is
#          tagged.
# publish  the one job that holds `contents: write`. It checks the same files again, creates the
#          release as a draft at the commit with those files (the tarballs, SBOMs, hostkeeper
#          packages, bundles, index.json and SHA256SUMS), reads the draft's assets back, and
#          only then publishes it, which is when GitHub creates the tag (cargo xtask release
#          publish). A tag or a release that exists is refused; a draft a failed run left is
#          replaced. Re-run the failed jobs of a run, not the whole run.
#
# The order of a release (docs/design/distribution.md, section 5): the files are published to
# TESTING, installed from there on clean machines, put on the lab, and only then promoted, as the
# same bytes: nothing is rebuilt and nothing is uploaded again.
#
# 1. testing    formula (renders Formula/tierstore.rb and keeps it as an artifact; no pull
#               request yet), testing-upload (the files at tierstore.dev/releases/<version>/,
#               write-once, WITHOUT releases/latest.json: cargo xtask channels upload --no-latest;
#               environment `prod-releases-tierstore`, `id-token: write`, no repository write) and
#               the nine testing-apt-* jobs (the Debian packages into the pool and the index of
#               the suite `testing` of packages.komira.ai) and the nine testing-rpm-* jobs (the
#               RPM packages, signed, into the pool and the repodata of the suite `testing` of
#               the same repository, once the repository variable RPM_REPO_READY is `true`).
# 2. checks     check-apt (a clean Ubuntu container pinned by digest, amd64 and arm64: adds the
#               repository with its published keyring and the suite testing, installs
#               tierstore=<version>, the binary says the release, the unit, sysusers.d entry and
#               conffile are there, the service is neither enabled nor running), check-brew (the
#               rendered formula from a local tap, on macos-15) and check-install-sh (install.sh
#               from tierstore.dev with --version, on Linux and on macOS) and check-rpm (clean
#               containers of Fedora, AlmaLinux 9 and Amazon Linux 2023 pinned by digest, x86_64
#               and aarch64: adds the repository file of the suite testing, installs
#               tierstore-<version> with dnf, `rpm -K` accepts the package, the binary says the
#               release, the unit and the conffile are there, the service is not enabled). A
#               failure stops the
#               release before anything public changes.
# 3. the lab    farm-check, farm, soak: hostkeeper installs the Debian package of the suite testing
#               on the lab and the coordinator moves it. Without the lab's settings the stage is
#               skipped with a notice and does not hold the release; with them it must converge
#               and then soak FARM_SOAK_HOURS (empty is 0, which ends at once).
# 4. promotion  promote-check (cargo xtask channels decide: the results of the jobs above) and
#               then, automatically, promote-latest (releases/latest.json, after the bucket is
#               read back against SHA256SUMS), tap (the pull request in the Homebrew tap, from the
#               formula that was installed), the nine stable-apt-* jobs (the entries of the
#               release copied from the index of testing to the index of stable, digests checked
#               against SHA256SUMS, no package written) and the nine stable-rpm-* jobs (the same
#               for the repodata of the rpm tree). Nobody approves a step (B12).
#
# Each job that writes starts with `cargo xtask channels gate`: with none of its settings set the
# job ends green with a notice and writes nothing, with some it ends red naming the missing ones,
# and every later step runs only when the gate said `enabled=true`. A failed job un-releases
# nothing: re-run the failed jobs. The re-run resumes, since every write is write-once or
# idempotent and promote-check reads the results again.
#
# The three apt jobs (read, index, write; and their attempts 2 and 3, the jobs with the suffix -2
# and -3) exist once for the suite testing and once for the suite stable, so that no job holds
# both the signing key and the cloud role: the read job (environment `apt-publish`, `id-token:
# write`) reads the index and the ETag of each object from S3; the index job (environment
# `apt-signing`, `contents: read`) merges the two .debs into the index of testing, or promotes
# their entries into the index of stable, and signs it; the write job (environment `apt-publish`)
# uploads the .debs once each (testing only) and then the index with If-Match on the ETags that
# were read. A write that finds the index changed in between ends green with conflict=true, and
# the next attempt reads, merges and signs again; the third attempt fails instead of asking for a
# fourth.
#
# The nine rpm jobs of each suite (testing-rpm-*, stable-rpm-*) are the same three, in the same
# environments with the same settings and the same key, for the rpm tree (`channels rpm`): the
# index job also signs the .rpms, which adds one entry to the signature header and changes nothing
# else, so the unsigned packages SHA256SUMS lists are the signed ones minus that entry
# (`channels rpm check-signed`). They end green with a notice and write nothing, besides the
# apt settings, while the repository variable RPM_REPO_READY is not `true`.
#
# verify also runs the downloaded linux-x86_64 binary with `--version` and refuses to go on
# unless it says exactly the tag (without the v) and the first 12 digits of the commit
# (cargo xtask release check-binary): artifacts.yml built it under the version that
# `cargo xtask release version` computed and recorded, and the plan chose a commit whose record
# is the tag, so this holds unless a tag appeared between the plan and the check, and then
# nothing is published.
#
# One release action at a time, never cancelled: the group has two
# conditions (`release-main` for a run that succeeded for a push to this repository, a group
# of its own for any other, so that it cannot replace the release that is waiting: a pull request
# from a fork's branch named main also matches `branches: [main]` above). Every workflow that
# tags or publishes is in that group; the
# workflow lint finds them by what they do and holds each to it (artifacts.yml, which only
# builds and attests, is exempt and has a group per commit).
# GitHub keeps one waiting run per group, so a third replaces the second; nothing is lost by
# that, since every plan walks from the tip of main and measures from the highest tag. A manual run of this workflow takes a group
# of its own (publish refuses a tag or release that exists). The lint also holds `contents: write`
# to the `publish` job alone, `plan` to read access, and this file to no build and no signing
# step.
name: release

on:
  workflow_run:
    workflows: [ci, artifacts]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, v<major>.<minor>.<patch>"
        type: string
        required: true
      commit:
        description: "The full SHA of a commit on main whose push run built and signed the files"
        type: string
        required: true
      note:
        description: "A paragraph for the release notes (where the files came from, what changed)"
        type: string
        required: false
        default: ''

permissions: {}

concurrency:
  group: release-${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  plan:
    # A manual run of main, or a finished run of ci or artifacts that succeeded, for a push to
    # main of this repository (not a pull request, not a fork's branch named main).
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.auto.outputs.release || steps.manual.outputs.release }}
      tag: ${{ steps.auto.outputs.tag || steps.manual.outputs.tag }}
      commit: ${{ steps.auto.outputs.commit || steps.manual.outputs.commit }}
      note: ${{ steps.auto.outputs.note || steps.manual.outputs.note }}
    steps:
      # For a `workflow_run`, `github.sha`: the newest commit of main, the tip the plan walks
      # from, not the commit the completed run built. Its VERSION file is the one read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.sha || inputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Which commit of main is released, and as which tag
        id: auto
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          # The stop switch: `true` releases nothing until an admin clears it.
          FREEZE: ${{ vars.RELEASE_FREEZE }}
        run: cargo xtask release plan --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --version-file VERSION --freeze "$FREEZE" --output "$GITHUB_OUTPUT"
      # The inputs are read as environment variables of the step, never spliced into a script.
      - name: The tag and commit of a manual run
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          NOTE: ${{ inputs.note }}
        run: cargo xtask release manual --repo "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$COMMIT" --note "$NOTE" --output "$GITHUB_OUTPUT"

  verify:
    needs: [plan]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    outputs:
      run-id: ${{ steps.locate.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      # xtask is compiled here, before any step holds a token, so no build script runs beside one.
      - name: Compile xtask
        run: cargo xtask --help
      - name: Refuse a commit not on main, without a green build and tests, or that lost an artifact
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release locate --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sha256sums
          path: published
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      # The provenance bundle of each tarball (`<tarball>.sigstore.json`), which the sums do not
      # list: the attestation that made it signed the files they list.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}
      # The release index of the hostkeeper packages, made again from them as the build's sums job
      # made it, with its sums line (dist/SHA256SUMS.index): the published SHA256SUMS lists it, so
      # the assembly below holds it to the bytes the build signed.
      - name: The release index, made again from the packages
        run: cargo xtask release hostkeeper-index dist --commit "$COMMIT" --event "$GITHUB_EVENT_NAME"
      # The assets artifacts carry the SHA256SUMS.<platform> files the sums were made from;
      # assembling them (and the index's) must give the published SHA256SUMS, and removes them
      # from dist (they are not release assets).
      - name: Assemble SHA256SUMS, which must be the published one
        run: cargo xtask sums assemble dist --expect published/SHA256SUMS
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are exactly the assets of this commit, each tarball and package with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      # The runner is linux-x86_64: the binary of that tarball is run, and refused unless it says
      # the tag (without the v) and the commit. Unpacked outside dist, which holds the assets.
      # The linux-arm64 and macos-arm64 binaries cannot run here: each was run and checked the
      # same way by its own build job in artifacts.yml, whose run a release requires to be green.
      - name: The binary says the tag and the commit it is released under
        run: cargo xtask release check-binary dist --tag "$TAG" --commit "$COMMIT" --scratch "$RUNNER_TEMP/binary"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation as a deployment does, and every bundle as a host does
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --source-ref refs/heads/main --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      # As hostkeeper takes the release: the index lists a package for every platform, each the
      # size and SHA-256 of its file, and each unpacks under hostkeeper's rules (outside dist).
      - name: Each hostkeeper package as a host takes it from the release index
        run: cargo xtask verify-assets hostkeeper-index dist --commit "$COMMIT" --scratch "$RUNNER_TEMP/hostkeeper"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [plan, verify]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The same checks as the verify job, on the files this job downloaded: they crossed the
      # run's artifact store.
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The files are exactly the assets of this commit, each tarball and package with its bundle
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Fetch the Sigstore trusted root, for the offline check of the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation trusted-root > "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Verify every attestation again
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify-assets attestations dist --repo "$GITHUB_REPOSITORY" --workflow-ref "$GITHUB_REPOSITORY/.github/workflows/artifacts.yml" --source-ref refs/heads/main --commit "$COMMIT" --trusted-root "$RUNNER_TEMP/trusted_root.jsonl"
      - name: Each hostkeeper package as a host takes it from the release index
        run: cargo xtask verify-assets hostkeeper-index dist --commit "$COMMIT" --scratch "$RUNNER_TEMP/hostkeeper"
      - name: Create the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.verify.outputs.run-id }}
          NOTE: ${{ needs.plan.outputs.note }}
        run: cargo xtask release publish dist --repo "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$COMMIT" --run-id "$RUN_ID" --notes-file "$RUNNER_TEMP/release-notes.md" --note "$NOTE"

  # The Homebrew formula of the release, rendered from the verified SHA256SUMS and kept as the
  # artifact `formula`. It opens no pull request here: `check-brew` installs it from a local tap,
  # and `tap` (after the promotion) opens the pull request from this very file.
  formula:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: The files are exactly the assets of this commit, and match SHA256SUMS
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          cargo xtask release check dist --commit "$COMMIT"
      - name: Render Formula/tierstore.rb from the verified SHA256SUMS
        run: cargo xtask channels formula --sums dist/SHA256SUMS --version "${TAG#v}" --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/formula/tierstore.rb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formula
          path: ${{ runner.temp }}/formula/tierstore.rb
          if-no-files-found: error
          retention-days: 7

  # TESTING. tierstore.dev/releases/<version>/ (write-once) and nothing else: this job does not
  # move releases/latest.json, so no install script or user that asks for the newest version is
  # pointed at a release that has not been installed and checked yet (`promote-latest` does that,
  # after the checks). The environment holds the settings
  # (TIERSTORE_RELEASES_BUCKET, TIERSTORE_RELEASES_ROLE_ARN and, optionally,
  # TIERSTORE_RELEASES_DISTRIBUTION_ID); the role's trust names this file at refs/heads/main, this
  # environment and this repository's id. No stored key: the credentials are the role's, for the
  # job. The files are the release-assets artifact, checked again here because they crossed the
  # artifact store. Until the settings exist the job is a green no-op.
  testing-upload:
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod-releases-tierstore
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Gate on the settings of the release files (a job without them does nothing and ends green)
        id: gate
        env:
          BUCKET: ${{ vars.TIERSTORE_RELEASES_BUCKET }}
          ROLE_ARN: ${{ vars.TIERSTORE_RELEASES_ROLE_ARN }}
        run: cargo xtask channels gate --label testing-upload --output "$GITHUB_OUTPUT" --setting "TIERSTORE_RELEASES_BUCKET=${BUCKET:+set}" --setting "TIERSTORE_RELEASES_ROLE_ARN=${ROLE_ARN:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-assets
          path: dist
      - name: The files are exactly the assets of this commit
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: cargo xtask release check dist --commit "$COMMIT"
      - name: Assume the release-files role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.TIERSTORE_RELEASES_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Put the files of the version once each (latest.json is not touched)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          BUCKET: ${{ vars.TIERSTORE_RELEASES_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.TIERSTORE_RELEASES_DISTRIBUTION_ID }}
        run: cargo xtask channels upload dist --no-latest --tag "$TAG" --commit "$COMMIT" --bucket "$BUCKET" --distribution-id "$DISTRIBUTION_ID" --work "$RUNNER_TEMP/releases-upload"

  # TESTING, the apt repository packages.komira.ai, which the organisation's products share, in
  # three jobs and up to three attempts: the release's Debian packages into the pool and the
  # index of the suite `testing` (docs/design/distribution.md, sections 5 and 8). No job holds
  # both the signing key and the cloud role, so a compromise of one step cannot sign and publish:
  #   testing-apt-read   (environment apt-publish: the role, no key) reads the current index and the
  #                      ETag of each of its objects from S3;
  #   testing-apt-index  (environment apt-signing: the key, no role) merges the .debs into that
  #                      index, keeping every other product's entries, and signs it;
