        if: ${{ steps.gate.outputs.enabled == 'true' }}
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          cargo xtask release check dist --commit "$COMMIT"
      - name: Sign the .rpms with the signing subkey (the signature header only; the same bytes for the same commit), then remove the key
        id: sign-rpms
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
