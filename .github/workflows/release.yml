      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: rpm-next
          path: |
            ${{ runner.temp }}/rpm-next/testing
            ${{ runner.temp }}/rpm-next/etags.txt
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: rpm-signed
          path: ${{ runner.temp }}/rpm-signed
          if-no-files-found: error
          retention-days: 1

