# Sets the desired version of tierstore on the hostkeeper coordinator to a published release, by
# its targets, by hand: each host is ordered the package of its own platform. One way in,
# `workflow_dispatch` from main ("Run workflow"), with one input, the released version `X.Y.Z`
# (its tag without the v), an older one included (a rollback).
#
# A release is deployed by release.yml itself, by its jobs `deploy-check`, `deploy` and
# `deploy-mac`, as soon as the suite `testing` lists its .debs: the same command, pin, audience and
# inputs as the jobs below, so the same allow-list entries of the coordinator admit both. This
# workflow is for a rollback or to set a release again; nothing starts it but a person.
#
# It is OFF until the repository variable TIERSTORE_SETS_DESIRED is `true`, exactly: unset, or
# anything else, every job is skipped (their job-level `if:`), and so are release.yml's deploy
# jobs. Its other settings are repository variables too; none is a secret:
#  - HOSTKEEPER_COORDINATOR_URL      the coordinator's private listener, https://<host>[:<port>],
#                                    by the name it has on the tailnet and in its certificate;
#  - HOSTKEEPER_COORDINATOR_CA       the PEM certificates of the CA that listener chains to;
#  - HOSTKEEPER_TAILNET_CLIENT_ID    the client ID of the tailnet's federated identity for this
#                                    repository; empty: the runner does not join the tailnet;
#  - HOSTKEEPER_TAILNET_AUDIENCE     the audience of that federated identity;
#  - HOSTKEEPER_TAILNET_COORDINATOR  the coordinator's name on the tailnet, which the join pings;
#  - HOSTKEEPER_TAILNET_TAG          the tag the join gives the runner's node, the one that
#                                    identity's trust credential issues (such as `tag:ci`).
# The coordinator lets the job's OIDC token set the version only through an allow-list entry for
# this repository (by id), refs/heads/main, the events workflow_run and workflow_dispatch, the
# audience below, the service tierstore, the host group all-in-one (an entry that names `host_groups`
# must list it), and the `job_workflow_ref` of the called workflow pinned
# below (komira-ai/hostkeeper/.github/workflows/set-desired.yml@<that commit>). Moving the pin
# moves the `job_workflow_ref`, so the entry moves with it.
#
# The jobs, in order:
#  - check        holds no token that writes, and is the one job that runs code of this
#                 repository. `cargo xtask release desired` (crates/xtask,
#                 src/release/desired.rs) checks the release named by `--version` and hands on
#                 what the lab stage of release.yml sets for the release (the same command, with
#                 the same `--min-hostkeeper`; the apt lists are src/release/desired_apt.rs's): the package
#                 version `X.Y.Z` and the targets, one `apt` entry for each of linux-x86_64 and
#                 linux-arm64, of the hosts' repository entry `komira-testing`, pinned by the
#                 `.deb`'s SHA-256. It refuses a release unless the suite `testing`, read as a
#                 client reads it, lists both `.deb`s with the digests the release's SHA256SUMS
#                 lists. The farm nodes install tierstore with apt, so a list of
#                 `hostkeeper-archive` entries would order none of them (`installer_dropped`).
#                 And, with `--macos-pkg`, in the same targets, the `macos-arm64` list: one `macos-pkg` entry of the
#                 release's signed `.pkg` (`tierstore-<X.Y.Z>-macos-arm64.pkg`, downloaded from the
#                 release and held to the digest of its SHA256SUMS), for the Macs. No release
#                 index: it would list archive entries the targets do not have.
#  - set-desired  needs check, and is hostkeeper's reusable workflow (the CI client), pinned below
#                 with the hostkeeper release whose hkctl makes the call (komira-ai/hostkeeper,
#                 docs/deploy/ci-client.md; its hkctl sends the targets as they are, the `apt`
#                 entries included): it proves that release (SHA256SUMS, the attestation by its
#                 artifacts.yml on refs/heads/main, the attested commit, `hkctl --version`) before
#                 any step can hold a token, joins the runner to the tailnet when
#                 HOSTKEEPER_TAILNET_CLIENT_ID is set (the coordinator's private listener is on the
#                 tailnet only), calls `releases set-desired` with the job's OIDC token, naming the
#                 release by its targets alone, and then waits for the fleet (`wait: true`), one
#                 call the coordinator holds for at most `max_polls` times 10 seconds, the most the
#                 client takes (half an hour). The job is green only when the coordinator reports
#                 the service converged on the version (`reason` `converged`). A version no host
#                 can be ordered (every host `installer_dropped` or `no_build_for_host`) never
#                 converges, so the job ends red (`not_converged`) instead of green with
#                 `not_waited`; so does a rollout still going after half an hour, a halt
#                 (`halted`) and a newer version set meanwhile (`superseded`). The roll goes on
#                 whatever the job says; `hkctl releases status --service tierstore` says where.
#  - set-desired-mac  the same call a second time, for the host group `mac-build` (the Macs): the
#                 same `targets` output, same pin, same wait. A Mac installs its `macos-pkg` entry;
#                 the Linux entries are ignored there, as the macOS entry is on the Linux hosts.
#                 The targets must be the same as the first call's: the coordinator keeps one
#                 release per version, whatever the host group, and refuses the version set again
#                 with other targets (`release_exists`). It needs an entry of the coordinator's
#                 allow-list for the host group mac-build, as the first call has one for all-in-one.
#
# One run at a time, never cancelled (the group `hostkeeper-desired`): a second run by hand waits
# for the first. The deploy of a release run is not in this group; a release set after a rollback
# by hand replaces it, as a newer release always does.
#
# The workflow lint (crates/xtask/tests/workflows, desired.rs) holds this file to what is said here.
name: hostkeeper-desired

on:
  workflow_dispatch:
    inputs:
      version:
        description: "A released version of tierstore, X.Y.Z (the tag without the v)"
        type: string
        required: true

permissions: {}

concurrency:
  group: hostkeeper-desired
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' && vars.TIERSTORE_SETS_DESIRED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      set: ${{ steps.desired.outputs.set }}
      package-version: ${{ steps.desired.outputs.package-version }}
      targets: ${{ steps.desired.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      # The input is read as an environment variable of the step, never spliced into a script.
      # The testing suite is read through the CDN, as a host's apt reads it; curl retries a CDN
      # that has not caught up for a few minutes.
      - name: The release to set, refused unless the testing suite lists its .debs with the digests of its SHA256SUMS
        id: desired
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: cargo xtask release desired --repo "$GITHUB_REPOSITORY" --version "$VERSION" --min-hostkeeper 0.1.225 --macos-pkg --dir "$RUNNER_TEMP/desired" --output "$GITHUB_OUTPUT"

  set-desired:
    needs: [check]
    if: ${{ github.ref == 'refs/heads/main' && vars.TIERSTORE_SETS_DESIRED == 'true' && needs.check.outputs.set == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: komira-ai/hostkeeper/.github/workflows/set-desired.yml@30141591c292d8881ce5bc16c9d0b3ba7fcfdca1 # v0.1.317
    with:
      service: tierstore
      host_group: all-in-one
      version: ${{ needs.check.outputs.package-version }}
      targets: ${{ needs.check.outputs.targets }}
      hostkeeper_version: 0.1.317
      hostkeeper_commit: 30141591c292d8881ce5bc16c9d0b3ba7fcfdca1
      coordinator_url: ${{ vars.HOSTKEEPER_COORDINATOR_URL }}
      coordinator_ca: ${{ vars.HOSTKEEPER_COORDINATOR_CA }}
      audience: tierstore-hostkeeper-desired
      wait: true
      max_polls: 180
      join_tailnet: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID != '' }}
      tailnet_client_id: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID }}
      tailnet_audience: ${{ vars.HOSTKEEPER_TAILNET_AUDIENCE }}
      tailnet_coordinator: ${{ vars.HOSTKEEPER_TAILNET_COORDINATOR }}
      tailnet_tag: ${{ vars.HOSTKEEPER_TAILNET_TAG }}

  set-desired-mac:
    needs: [check]
    if: ${{ github.ref == 'refs/heads/main' && vars.TIERSTORE_SETS_DESIRED == 'true' && needs.check.outputs.set == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: komira-ai/hostkeeper/.github/workflows/set-desired.yml@30141591c292d8881ce5bc16c9d0b3ba7fcfdca1 # v0.1.317
    with:
      service: tierstore
      host_group: mac-build
      version: ${{ needs.check.outputs.package-version }}
      targets: ${{ needs.check.outputs.targets }}
      hostkeeper_version: 0.1.317
      hostkeeper_commit: 30141591c292d8881ce5bc16c9d0b3ba7fcfdca1
      coordinator_url: ${{ vars.HOSTKEEPER_COORDINATOR_URL }}
      coordinator_ca: ${{ vars.HOSTKEEPER_COORDINATOR_CA }}
      audience: tierstore-hostkeeper-desired
      wait: true
      max_polls: 180
      join_tailnet: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID != '' }}
      tailnet_client_id: ${{ vars.HOSTKEEPER_TAILNET_CLIENT_ID }}
      tailnet_audience: ${{ vars.HOSTKEEPER_TAILNET_AUDIENCE }}
      tailnet_coordinator: ${{ vars.HOSTKEEPER_TAILNET_COORDINATOR }}
      tailnet_tag: ${{ vars.HOSTKEEPER_TAILNET_TAG }}
