# Build and tests of the tierstore.dev website (crates/tierstore/site): TypeScript compiled by
# tsc, a build program that prerenders the pages, and node:test tests over the built tree (golden
# output, links, the Content-Security-Policy rules, the pinned theme, the white-paper slot, a
# public-repo scan). Runs only when the site (or the guide it is made from, or the crate's source
# that test/claims.test.ts holds its statements to, or this file) changes. The Node version is
# exactly the one in the site's .node-version. The network is touched by `npm ci` alone, with
# install scripts off. Nothing here deploys, and this file holds no cloud access: a push to main
# is published by tierstore-site-publish.yml, which builds and tests again and uploads (it is the
# file the site's cloud role trusts).
# GitHub-hosted runner, commit-pinned actions, no token rights beyond reading the checkout.
name: tierstore-site

on:
  pull_request:
    paths:
      - crates/tierstore/site/**
      - crates/tierstore/docs/**
      - crates/tierstore/src/**
      - .github/workflows/tierstore-site.yml
  push:
    branches: [main]
    paths:
      - crates/tierstore/site/**
      - crates/tierstore/docs/**
      - crates/tierstore/src/**
      - .github/workflows/tierstore-site.yml

permissions: {}

concurrency:
  group: tierstore-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/tierstore/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/tierstore/site/.node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
