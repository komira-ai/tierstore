# The farm lane: `buck2 build //:ci` of the Cargo workspace through buildrules (BUCK,
# buildrules.bzl, .buckconfig), with every action run on the build farm or taken from its cache
# (docs/farm.md). `//:ci` is every member's `:fmt` (rustfmt), `:lint` (clippy with `-D warnings`)
# and `:test` (each test target run as a build action), but for the members whose
# `[package.metadata.buildrules]` keeps their tests in ci.yml (among them every member with FUSE
# tests); docs/farm.md says which and why.
#
# It is additive and advisory. ci.yml stays the pull-request gate: its tests run under coverage,
# the 99% gate is there, and so are the tests the farm cannot run (FUSE mounts, the tests that read
# the git checkout or run cargo, git or a shell). A farm outage turns this check red and blocks
# nothing; a fix to the farm itself is built and tested by ci.yml alone.
#
# The farm is reached through komira's farm-connect action, pinned by commit (komira tags no
# release of it). It joins the farm's private network with this job's OIDC token (workload identity
# federation: the farm trusts a token GitHub issues to this repository, and nothing is stored),
# refuses to go on unless the farm answers, and writes the farm's buckconfig under ~/.buckconfig.d.
# Its inputs are the organisation's variables TS_CLIENT_ID and TS_AUDIENCE (the tailnet identity),
# FARM_ADDRESS, FARM_INSTANCE, FARM_LINUX_X86_64_PROPERTIES and FARM_TLS; this repository holds no
# endpoint and no worker property set. That is why the one job holds `id-token: write` on a pull
# request, which the workflow lint allows to this job alone, under its exact `if:`
# (crates/xtask/tests/workflows/farm_lane.rs): a push to main, or a pull request from a branch of
# this repository that is not Dependabot's. A fork's pull request gets no OIDC token, and is skipped.
#
# buck2 is the release buildrules is tested with (its tools/buck2), installed by `cargo xtask
# fetch` only once its SHA-256 matches.
#
# The build runs through komira's buck2-farm action, pinned to the same komira commit as
# farm-connect (komira-ai/komira#2439 is in it). The action runs `buck2 build //:ci` again, once
# the farm answers, when a run failed on a cut connection to the farm or hung on a dead one (its
# watchdog reads the runner's connections to the farm from the kernel, and ends a run whose
# connection has heard nothing from the farm for 5 minutes, which a live farm never does), at most
# three runs, and fails the step unless every summary line says `local: 0`. Its tool,
# assert_remote, is built here from komira's sources at that commit, with the pinned Zig 0.15.2
# its build names; no copy of it is kept in this repository. Every step has a time limit of its
# own, under the job's (docs/farm.md, "Time limits"; the workflow lint holds both).
name: farm

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A pull request's newer run replaces its older one; a push to main always runs to its end.
concurrency:
  group: farm-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'dependabot/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      # For farm-connect's tailnet join alone: the OIDC token the farm's network trusts.
      id-token: write
    env:
      BUCK2_VERSION: 2026-09-15
      BUCK2_SHA256: 1268fce33fb61273091dd5dd8c60b65de1521a3caa36b88983813e882b7ffd89
      # The Zig komira builds assert_remote with (its toolchain `zig_next`).
      ZIG_VERSION: 0.15.2
      ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          persist-credentials: false
      - run: rustup toolchain install
        timeout-minutes: 10
      # xtask is built on the runner (the one cargo build of this job); its own cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-farm-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-farm-
      - name: Install buck2 (pinned version and checksum)
        timeout-minutes: 20
        run: cargo xtask fetch --url "https://github.com/facebook/buck2/releases/download/$BUCK2_VERSION/buck2-x86_64-unknown-linux-gnu.zst" --sha256 "$BUCK2_SHA256" --out "$RUNNER_TEMP/bin/buck2" --extract zst
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 10
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Install Zig (pinned version and checksum)
        timeout-minutes: 10
        run: cargo xtask fetch --url "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" --sha256 "$ZIG_SHA256" --out "$RUNNER_TEMP/zig" --extract tar.xz --tree
      # The sources of the buck2-farm action's tool, and nothing else of komira, at the commit
      # the two komira actions below are pinned to.
      - name: komira's assert_remote sources, at the actions' commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          repository: komira-ai/komira
          ref: b2080fe989248adf9b47d4bd14c0ecefa0802f79
          path: target/komira
          sparse-checkout: tools/build/ci/assert_remote/*.zig
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # Built as komira builds it (its zig_exe: -OReleaseSafe -fstrip, a static musl binary).
      - name: Build assert_remote
        timeout-minutes: 10
        run: '"$RUNNER_TEMP/zig/zig" build-exe -OReleaseSafe -fstrip -target x86_64-linux-musl -femit-bin="$RUNNER_TEMP/bin/assert_remote" target/komira/tools/build/ci/assert_remote/assert_remote.zig'
      # Its own wait for the farm is at most 20 minutes (its `farm-wait-minutes`).
      - name: Connect to the farm
        uses: komira-ai/komira/.github/actions/farm-connect@b2080fe989248adf9b47d4bd14c0ecefa0802f79
        timeout-minutes: 30
        with:
          ts-client-id: ${{ vars.TS_CLIENT_ID }}
          ts-audience: ${{ vars.TS_AUDIENCE }}
          farm-address: ${{ vars.FARM_ADDRESS }}
          farm-instance: ${{ vars.FARM_INSTANCE }}
          farm-properties: ${{ vars.FARM_LINUX_X86_64_PROPERTIES }}
          tls: ${{ vars.FARM_TLS || 'false' }}
      # crates/xtask/src/farm.rs: refuses to go on unless .buckconfig hands farm-connect's worker
      # property set to buildrules, so a build with no farm to run on says so first.
      - name: buck2 has the farm's worker property set
        timeout-minutes: 10
        run: cargo xtask farm-check --buck2 "$RUNNER_TEMP/bin/buck2"
      # buck2's progress goes to this log as it comes; a run cut or hung on the farm's connection
      # is run again (at most three runs), and the step fails unless every summary line says
      # `local: 0` (every action ran on the farm or came from its cache).
      - name: buck2 build //:ci on the farm, local 0
        uses: komira-ai/komira/.github/actions/buck2-farm@b2080fe989248adf9b47d4bd14c0ecefa0802f79
        timeout-minutes: 120
        with:
          args: build //:ci
          assert-remote: ${{ runner.temp }}/bin/assert_remote
          buck2: ${{ runner.temp }}/bin/buck2
      # The daemon outlives the build: stop it however the build ended.
      - name: Stop buck2
        if: ${{ always() }}
        timeout-minutes: 5
        run: '"$RUNNER_TEMP/bin/buck2" kill'
