# Clippy's configuration for every crate of the workspace. The lint levels are in the root
# `Cargo.toml` (`[workspace.lints]`); this file says what the `disallowed_*` lints refuse.
# A site that must call one of these says why with `#[expect(clippy::disallowed_methods,
# reason = "...")]` on the smallest item around it.

# Configuration comes in as flags, not environment variables (AGENTS.md S2). Reading the
# environment is refused, and so is changing it, which edition 2024 also makes unsafe.
disallowed-methods = [
    { path = "std::env::var", reason = "configuration is a flag, not an environment variable (AGENTS.md S2)" },
    { path = "std::env::var_os", reason = "configuration is a flag, not an environment variable (AGENTS.md S2)" },
    { path = "std::env::vars", reason = "configuration is a flag, not an environment variable (AGENTS.md S2)" },
    { path = "std::env::vars_os", reason = "configuration is a flag, not an environment variable (AGENTS.md S2)" },
    { path = "std::env::set_var", reason = "a process does not change its own environment (AGENTS.md S2)" },
    { path = "std::env::remove_var", reason = "a process does not change its own environment (AGENTS.md S2)" },
    # A real clock is read in the clock modules only; everything else is handed a clock, so a
    # test can move time without waiting for it (AGENTS.md T10).
    { path = "std::time::Instant::now", reason = "read the time through a clock, not the machine's (AGENTS.md T10)" },
    { path = "std::time::SystemTime::now", reason = "read the time through a clock, not the machine's (AGENTS.md T10)" },
]

# Operator messages go through `tracing`, not the process's standard streams. The output of a
# command that answers the person who ran it (`--version`, `--print-config`) and of a build
# script is not logging; its site says so with `#[expect(clippy::disallowed_macros, reason)]`.
disallowed-macros = [
    { path = "std::println", reason = "operator messages go through tracing" },
    { path = "std::print", reason = "operator messages go through tracing" },
    { path = "std::eprintln", reason = "operator messages go through tracing" },
    { path = "std::eprint", reason = "operator messages go through tracing" },
    { path = "std::dbg", reason = "a debugging aid does not ship" },
]

# Tests may `unwrap` and `expect`: a failed one is the failure the test reports. The lints
# `clippy::unwrap_used` and `clippy::expect_used` (AGENTS.md R3) then judge production code only.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
