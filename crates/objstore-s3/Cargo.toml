[package]
name = "objstore-s3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The object store trait, its key and page types and an S3 client (SigV4, multipart, conditional
# writes), with no dependency on another crate of this workspace, so that it can move to a
# repository of its own with `tierstore`, which adapts the client
# (crates/kbf-integration-test/tests/layering.rs keeps it that way). `kbf-objstore` re-exports
# all of it. The one kbf crate among the dev-dependencies, `kbf-testkit` (the loopback port
# helpers of `tests/s3_wire.rs`), stays behind when it moves.

[features]
# `testkit`: `s3::fake`, an S3 service on loopback that keeps multipart uploads, for
# other crates' tests (and this one's, through the dev-dependency on itself).
testkit = ["tokio/net", "tokio/io-util", "tokio/sync"]

[dependencies]
base64.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
# The body of a part streamed to the store (`s3::parts`).
http-body.workspace = true
md-5.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true

[dev-dependencies]
# `http::Response` for the unit test that builds a `reqwest::Response`.
http.workspace = true
# Loopback ports nothing can take (kbf_testkit::port).
kbf-testkit.workspace = true
objstore-s3 = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
