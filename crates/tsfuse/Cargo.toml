[package]
name = "tsfuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The FUSE library of tierstore (docs/design/fetch-cache-serve.md, 5.2): the dispatch interface `Fs`/`Handled`/`Replier` with replies bound to their originating device, cancel tokens registered at read time and an atomic complete. The ABI (T-F1) and the transports (T-F2, T-F5) build on it."

# No dependency on a FUSE crate: the library speaks the protocol itself (5.2).
[dependencies]
# The waker of a cancel token.
futures.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
