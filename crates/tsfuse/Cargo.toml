[package]
name = "tsfuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The FUSE library of tierstore (docs/design/fetch-cache-serve.md, 5.2): the dispatch interface `Fs`/`Handled`/`Replier` with replies bound to their originating device, cancel tokens registered at read time and an atomic complete, the kernel ABI (`abi`: wire structs, per-opcode parse, reply payloads, INIT negotiation), and on Linux the `/dev/fuse` transport: mount(2) or fusermount3, cloned readers on AsyncFd, writev replies, stop and abort; the READ reply path: splice through pooled pipes sized with F_SETPIPE_SZ above a threshold, pread and writev below it, and the DONTNEED helper; takeover: the handover a supervisor keeps (every descriptor and the INIT terms, passed by SCM_RIGHTS) and its resume without INIT after FUSE_NOTIFY_RESEND; and the io_uring transport: REGISTER of every queue, COMMIT_AND_FETCH, the hybrid /dev/fuse reader for INTERRUPT and FORGET, depth, registered-memory accounting and the fallback to /dev/fuse."

# No dependency on a FUSE crate: the library speaks the protocol itself (5.2).
[dependencies]
# The waker of a cancel token.
futures.workspace = true
# The typed errors of the ABI's parse and INIT negotiation (AGENTS.md R3).
thiserror.workspace = true
# The wire structs of the ABI: derives that refuse a struct with implicit padding and read and
# write it as bytes with no `unsafe` here.
zerocopy.workspace = true

# The `/dev/fuse` transport (Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
# open, fcntl, statx, mount and umount2, socketpair and SCM_RIGHTS, read and writev, the
# sealed memfd of a handover's terms, and the one ioctl (FUSE_DEV_IOC_CLONE); for the splice
# reply path pipes, `splice`, `F_SETPIPE_SZ`, `pread`, `posix_fadvise` and the page size.
# For the io_uring transport `io_uring_setup`, `io_uring_enter`, `mmap` and `munmap` of the rings,
# and `sched_setaffinity` of each queue's thread.
rustix = { workspace = true, features = ["fs", "io_uring", "mm", "mount", "net", "param", "pipe", "process", "thread"] }
# A reader's current-thread runtime, `AsyncFd` and the stop notification.
tokio = { workspace = true, features = ["net", "rt", "sync"] }

[dev-dependencies]
# The digest of the pinned uapi header, checked by `tests/abi_layout.rs`.
sha2.workspace = true
# The scratch directory `tests/abi_probe.rs` compiles the layout probe into.
tierstore-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }

# Socket pairs, `fcntl` and the device numbers of the tests; for the kernel checks
# (`tests/kernel_*_integration.rs`) also `poll` and its `Timespec`, `splice` and pipe sizes, memfd seals
# and `fadvise`.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["event", "fs", "net", "pipe", "process", "time"] }

[lints]
workspace = true
