[package]
name = "tierstore-trees-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The wire contract of the jobscheduler mount provider tierstore serves (provider.proto, package jobscheduler.provider.v1): its generated messages, client and server stubs."

# The types are generated from `proto/jobscheduler/provider/v1/provider.proto` by `build.rs`, with the
# pure-Rust protobuf compiler `protox`, so no build or CI host needs `protoc`. The crate holds no
# logic: `tierstore` serves it behind its `server` feature, a client takes the `client` feature.

[features]
# The generated client stub (`MountProviderClient`).
client = []
# The generated server trait and service (`MountProviderServer`).
server = []

[dependencies]
# The generated service is a `tower` service over tonic's body type; no transport, no TLS.
prost.workspace = true
tonic = { workspace = true, features = ["codegen"] }
tonic-prost.workspace = true

[build-dependencies]
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
# The wire test compiles the proto as `build.rs` does, to compare its names with the crate's.
protox.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# Policy only: `actions = { name = ["lint", "test"] }`, `default-action`, `[package.metadata.buildrules.lint]`.
# Absent keys inherit [workspace.metadata.buildrules]. See docs/contract.md.
