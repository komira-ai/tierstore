[package]
name = "coverage-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "Per-crate line and branch coverage from an lcov tracefile, and the 99% gate CI applies."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"

[lints]
workspace = true

[package.metadata.buildrules]
# Policy only: `actions = { name = ["lint", "test"] }`, `default-action`, `[package.metadata.buildrules.lint]`.
# Absent keys inherit [workspace.metadata.buildrules]. See docs/contract.md.
# A comment that changes this manifest's bytes and so its hash in buildrules.lock.bzl: the farm lane's table check fails on it.
