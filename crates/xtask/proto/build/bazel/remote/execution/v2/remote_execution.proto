// The part of the Remote Execution API v2 that `cargo xtask mac-farm` speaks
// (crates/xtask/src/mac_farm.rs): the messages and calls it sends and reads, written for this
// client. Package, message, field and service names and field numbers are the API's, so the farm's
// server, which implements the whole API, reads these messages and answers them; what is left out
// is fields and calls the client never sets or makes. A field a server sends that is not here is
// skipped when a message is decoded, so a message decoded and encoded again can differ from the
// server's bytes: where a digest of those bytes matters (the directories of an output's Tree),
// the client keeps them as sent (src/mac_farm/outputs.rs).
syntax = "proto3";

package build.bazel.remote.execution.v2;

import "google/longrunning/operations.proto";
import "google/protobuf/duration.proto";
import "google/rpc/status.proto";

// Runs an action and follows it to its end.
service Execution {
  rpc Execute(ExecuteRequest) returns (stream google.longrunning.Operation);
  rpc WaitExecution(WaitExecutionRequest) returns (stream google.longrunning.Operation);
}

// The farm's content-addressed storage.
service ContentAddressableStorage {
  rpc FindMissingBlobs(FindMissingBlobsRequest) returns (FindMissingBlobsResponse);
  rpc BatchUpdateBlobs(BatchUpdateBlobsRequest) returns (BatchUpdateBlobsResponse);
}

message Digest {
  string hash = 1;
  int64 size_bytes = 2;
}

message Action {
  Digest command_digest = 1;
  Digest input_root_digest = 2;
  google.protobuf.Duration timeout = 6;
  Platform platform = 10;
}

message Command {
  message EnvironmentVariable {
    string name = 1;
    string value = 2;
  }
  repeated string arguments = 1;
  repeated EnvironmentVariable environment_variables = 2;
  string working_directory = 6;
  repeated string output_paths = 7;
}

message Platform {
  message Property {
    string name = 1;
    string value = 2;
  }
  repeated Property properties = 1;
}

message Directory {
  repeated FileNode files = 1;
  repeated DirectoryNode directories = 2;
  repeated SymlinkNode symlinks = 3;
}

message FileNode {
  string name = 1;
  Digest digest = 2;
  bool is_executable = 4;
}

message DirectoryNode {
  string name = 1;
  Digest digest = 2;
}

message SymlinkNode {
  string name = 1;
  string target = 2;
}

// An output directory as the farm returns it: its root and every directory below it.
message Tree {
  Directory root = 1;
  repeated Directory children = 2;
}

message ActionResult {
  repeated OutputFile output_files = 2;
  repeated OutputDirectory output_directories = 3;
  int32 exit_code = 4;
  bytes stdout_raw = 5;
  Digest stdout_digest = 6;
  bytes stderr_raw = 7;
  Digest stderr_digest = 8;
  repeated OutputSymlink output_file_symlinks = 10;
  repeated OutputSymlink output_directory_symlinks = 11;
  repeated OutputSymlink output_symlinks = 12;
}

message OutputFile {
  string path = 1;
  Digest digest = 2;
  bool is_executable = 4;
  bytes contents = 5;
}

message OutputDirectory {
  string path = 1;
  Digest tree_digest = 3;
}

message OutputSymlink {
  string path = 1;
  string target = 2;
}

message ExecuteRequest {
  string instance_name = 1;
  Digest action_digest = 6;
}

message ExecuteResponse {
  ActionResult result = 1;
  bool cached_result = 2;
  google.rpc.Status status = 3;
  string message = 5;
}

message ExecutionStage {
  enum Value {
    UNKNOWN = 0;
    CACHE_CHECK = 1;
    QUEUED = 2;
    EXECUTING = 3;
    COMPLETED = 4;
  }
}

message ExecuteOperationMetadata {
  ExecutionStage.Value stage = 1;
}

message WaitExecutionRequest {
  string name = 1;
}

message FindMissingBlobsRequest {
  string instance_name = 1;
  repeated Digest blob_digests = 2;
}

message FindMissingBlobsResponse {
  repeated Digest missing_blob_digests = 2;
}

message BatchUpdateBlobsRequest {
  message Request {
    Digest digest = 1;
    bytes data = 2;
  }
  string instance_name = 1;
  repeated Request requests = 2;
}

message BatchUpdateBlobsResponse {
  message Response {
    Digest digest = 1;
    google.rpc.Status status = 2;
  }
  repeated Response responses = 1;
}
