// The status of a call or of an action, and the detail the farm attaches to a failed one: the end
// of the job's output (`cargo xtask mac-farm`). Names and field numbers are Google's RPC API's
// (see remote_execution.proto in this directory tree for why this is a part).
syntax = "proto3";

package google.rpc;

import "google/protobuf/any.proto";

message Status {
  int32 code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}

message ErrorInfo {
  string reason = 1;
  string domain = 2;
  map<string, string> metadata = 3;
}
