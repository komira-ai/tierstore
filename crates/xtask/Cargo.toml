[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "The CI and release steps of this repository (cargo xtask <verb>)."
# `cargo xtask` runs this bin.
default-run = "xtask"

# `gh-fake`, the program tests/attestations.rs runs in place of `gh attestation verify`. Never
# run by CI itself.
[[bin]]
name = "gh-fake"
path = "src/bin/gh-fake.rs"
test = false

[dependencies]
# The statement a provenance bundle's DSSE envelope carries (`bundles`): its subject is
# compared with the tarball's digest.
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
# `mac-farm`: its uploads in flight at once, and the messages of a streamed upload.
futures.workspace = true
# gzip for the tarballs `package` writes and `fetch` unpacks; the pure-Rust backend.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
hex = "0.4.3"
# hostkeeper's own code for its package, as a host runs it: the release index (`index.json`, its
# strict reader and canonical writer, and the platform and name types) that `release
# hostkeeper-index` writes and `verify-assets hostkeeper-index` reads, and the unpacker and
# manifest loader `verify-assets hostkeeper-package` unpacks each package with. Taken from
# hostkeeper's public repository at a pinned commit (the root `Cargo.toml` says which).
hostkeeper-config.workspace = true
hostkeeper-unpack.workspace = true
# xz for the tar.xz archive of cargo-cyclonedx that `fetch` unpacks.
lzma-rs = "0.3.0"
# The launchd plist the macOS installer package holds, read as XML by `release check-macos-pkg`.
roxmltree.workspace = true
# The MD5 sums a Debian package lists its files with (`release deb`).
md-5 = "0.11.0"
# `mac-farm`: the Remote Execution API messages it encodes and decodes (an Action's timeout is a
# protobuf Duration, an operation's metadata and response protobuf Anys).
prost.workspace = true
prost-types.workspace = true
# The RPM packages `release rpm` builds and `release rpm-info` reads back; the builder and reader
# only (no signing, no zstd, xz or bzip2), so no C library.
rpm = { version = "0.30.2", default-features = false, features = ["payload", "gzip-compression"] }
# The TLS client of `fetch`: the host's trusted roots and nothing else.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.4"
# The one zstd frame of the hostkeeper package (`release hostkeeper-package`), and the zstd file
# `fetch --extract zst` installs (buck2).
ruzstd.workspace = true
# The pins of the Rust toolchain `mac-farm` sends to a farm Mac (src/mac_farm/toolchain.toml).
serde.workspace = true
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
# The runtime `mac-farm`'s calls to the farm run on.
tokio = { workspace = true, features = ["rt-multi-thread"] }
# The farm's Remote Execution services (`mac-farm`): the generated client over tonic's channel,
# with TLS and the system's roots when the farm serves TLS. `tonic-prost` is the prost codec of
# the generated code.
tonic = { workspace = true, features = ["channel", "codegen", "tls-ring", "tls-native-roots"] }
tonic-prost.workspace = true
# The toolchain pins of `mac-farm`, and in the tests the manifest of the hostkeeper package.
toml.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider"] }

[build-dependencies]
# The generated code of the part of the Remote Execution API `mac-farm` speaks (build.rs), with the
# pure-Rust protobuf compiler, so no build needs `protoc`.
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
# The fake farm of the `mac-farm` tests (tests/mac_farm/fake.rs): tonic's server on loopback.
tonic = { workspace = true, features = ["server", "router"] }
# The tests of the hostkeeper package (tests/hostkeeper_package) also check it with hostkeeper's
# placed-path lint, at the commit of hostkeeper's loader and unpacker (the root `Cargo.toml` says
# which).
hostkeeper-placed.workspace = true
# The YAML parser the workflow lint (tests/workflows.rs) reads each workflow with.
saphyr-parser = "0.1.0"
# The scratch directories of the tests that read files (tests/banned_names.rs), and the
# refusing loopback port of the download test (src/fetch/tests.rs).
tierstore-testkit.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but does
# not run its tests: they read the git checkout (the workflows, AGENTS.md, every tracked file) and
# run git, cargo, sh, bash, jq and tar, none of which a farm action has. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
