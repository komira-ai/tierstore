[package]
name = "tierstore"
# Its own version, not the workspace's: 0.2.0 is the first release whose cache node can write
# through (`[local_cache] write_through`), which `tierstore --version` shows.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A generic hot/cold object store over S3-compatible backends. It knows nothing of kbf and its
# normal dependencies include no kbf crate unless the `s3` feature is on, so it can move to a
# repository of its own (crates/kbf-integration-test/tests/layering.rs keeps it that way). The
# tests use `kbf-testkit` as a dev-dependency, which stays behind when it moves.

[features]
# `S3Backend`, a `Backend` over the S3 client of `objstore-s3`. Off by default: without it the
# crate's own dependencies include no kbf crate (crates/kbf-integration-test/tests/layering.rs
# checks the normal dependencies without it; the tests always build `objstore-s3`, see
# `[dev-dependencies]`). `server` turns it on. CI runs the tests and clippy with it on
# (.github/workflows/ci.yml).
s3 = ["dep:objstore-s3"]
# `server`: the S3 API front of the proxy (the `server` module) and the `tierstore` binary that
# runs it. Off by default, so the library carries no HTTP stack; the crate's own tests turn it on
# through the dev-dependency on itself, so the workspace runs build and test it. It turns `s3`
# on, since the binary's tiers may be S3 buckets; that is why the dependencies of the crate
# without features, and not those of the whole workspace, are what layering.rs checks.
server = [
    "dep:base64",
    "dep:clap",
    "dep:crc32c",
    "dep:crc32fast",
    "dep:hmac",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:md-5",
    "dep:percent-encoding",
    "dep:ring",
    "dep:rustix",
    "dep:roxmltree",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:x509-parser",
    "dep:toml",
    "s3",
    "tokio/macros",
    "tokio/net",
    "tokio/rt-multi-thread",
    "tokio/signal",
]

[[bin]]
name = "tierstore"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
# The backend trait is used as `dyn Backend`, so its async methods are boxed.
async-trait.workspace = true
# The checksums a client sends in the headers of a request are base64 (`server`).
base64 = { workspace = true, optional = true }
bytes.workspace = true
# The flags of the `tierstore` binary (`server`).
clap = { workspace = true, optional = true }
# The CRC-32C and the CRC-32 a client may send as the checksum of a body (`server`).
crc32c = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
# The reconciler's bounded number of parallel copies, and the streams of the parts of an upload.
futures.workspace = true
# The content tag of the in-memory backend: the hex of the body's SHA-256.
hex.workspace = true
# The SigV4 check of a request's signature (`server`).
hmac = { workspace = true, optional = true }
# The request bodies the S3 front reads and the answers it sends (`server`).
http-body-util = { workspace = true, optional = true }
# The HTTP/1.1 server under the S3 front (`server`).
hyper = { workspace = true, features = ["http1", "server"], optional = true }
hyper-util = { workspace = true, features = ["tokio"], optional = true }
# The MD5 a client may send as the `Content-MD5` of a body (`server`).
md-5 = { workspace = true, optional = true }
# `s3` only: the S3 client that `S3Backend` adapts.
objstore-s3 = { workspace = true, optional = true }
# The decoding of a request's path and query, and the encoding SigV4 signs (`server`).
percent-encoding = { workspace = true, optional = true }
# The SHA-1 a client may send as the `x-amz-checksum-sha1` of a body (`server`).
ring = { workspace = true, optional = true }
# The user id the server runs as, which a key file must belong to, and the free space, the link count and
# the times of the files of the local cache, and the listening sockets, which `std` cannot bind
# with `IPV6_V6ONLY` set (`server`).
rustix = { workspace = true, features = ["fs", "net", "process"], optional = true }
# The body of a CompleteMultipartUpload request (`server`).
roxmltree = { workspace = true, optional = true }
# The TLS of the OCI read front (`server`): the certificate and key are read at start, and the
# acceptor is made with the ring provider the rest of the workspace uses.
rustls = { workspace = true, optional = true }
# The journal objects, the checkpoints and the usage object are JSON.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The `--config` file of the `tierstore` binary and the file `--print-config` writes (`server`).
toml = { workspace = true, optional = true }
# `fs` and `io-util` for the directory backend, `rt` to journal a copy-back in the background,
# `sync` for the batches of the journal, `time` for the linger, the back-pressure and the
# injected delays.
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
# The handshake of the OCI read front's connections (`server`).
tokio-rustls = { workspace = true, optional = true }
# The IP subjectAltNames of the OCI front's certificate, which the start checks (`server`).
x509-parser = { workspace = true, optional = true }

[dev-dependencies]
# A stock S3 SDK (aws-sdk-rust) and its plain-HTTP client, which tests/s3_front/sdk.rs drives
# the front with, configured as packaging/tierstore/README.md says. Dev-dependencies only: no
# build of the library or the binary has them.
aws-sdk-s3.workspace = true
aws-smithy-http-client.workspace = true
# Signs the requests the tests of the S3 front send by hand, apart from the code that checks them.
hmac.workspace = true
# The S3 client (the one kbf itself uses), which the tests of the S3 front drive it with, and the loopback
# S3 service of the tests of `S3Backend`. A dev-dependency is built for every test build, with
# the `s3` feature or without it, though only the `s3` tests use the service.
objstore-s3 = { workspace = true, features = ["testkit"] }
# Scratch directories and key files of the tests of the binary.
kbf-testkit.workspace = true
# A test CA and a leaf with IP subjectAltNames, for the tests of the OCI read front.
rcgen.workspace = true
# Sends the requests the S3 client does not: unsigned ones and ones signed by hand.
reqwest.workspace = true
# The TLS client of the tests of the OCI read front.
rustls.workspace = true
tokio-rustls.workspace = true
# SIGTERM to the binary.
rustix = { workspace = true, features = ["process"] }
# Turns the `server` feature on for this crate's own tests, and for the clippy and coverage
# runs over the workspace that build them.
tierstore = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["io-util", "macros", "test-util"] }

[lints]
workspace = true
