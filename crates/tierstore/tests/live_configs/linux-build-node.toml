[[interface]]
type   = "s3"
params = { port = 9300 }

[[interface]]
type   = "mount-provider"
params = { socket = "/var/lib/tierstore/provider.sock", mountpoint = "/run/tierstore/fs" }

[[interface]]
type = "fs"
[interface.params]
mountpoint   = "/run/tierstore/fs"
client_group = "tierstore"
owner        = { subids_of = "jsjob", id = 1000 }
tree_list_ram_bytes = 2147483648
[interface.params.put]
enabled              = true
prefixes             = ["cas/b/"]
stage_dir            = "/var/lib/tierstore-cache/build-cas/put-stage"
stage_ttl_secs       = 86400
commit_deadline_secs = 120
min_free_bytes       = 21474836480

[server]
handoff_socket = "/var/lib/tierstore/handoff.sock"
proxy_id_from_facts = { path = "/var/lib/hostkeeper/facts.json", prefix = "tierstore-" }
bucket = "build-cas"
max_request_bytes = 536870912
access_key_file = "/etc/tierstore/access.key"
read_only_key_files = ["/etc/tierstore/mac-build-upstream-1.key"]
presign_key_files = []
presign_max_expires = "4h"
scoped_key_files = ["/etc/tierstore/build-cold.key"]
gc_key_files = []

[local_cache]
path = "/var/lib/tierstore-cache/build-cas"
layout = "digest-v1"
budget = "185GiB"
high_water = 90
low_water = 75
critical = 95
free_floor = 10
write_through = true
whole_fill_limit = "1MiB"

[cold_store]
kind = "s3"
bucket = "build-cas"
endpoint = "http://127.0.0.1:8333"
credentials_file = "/etc/tierstore/swfs.credentials"

[[policy]]
prefix = "cas/"
cache = true

[[policy]]
prefix = "tools/"
cache = true

[[policy]]
prefix = ""
cache = false
