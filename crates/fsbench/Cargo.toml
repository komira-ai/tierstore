[package]
name = "fsbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The FUSE benchmark of tierstore fs: open/read/close processes over a real tree beside CPU burners, and a null file system to compare it with."

# The harness is Linux only: it reads /proc and /sys and mounts FUSE. On another system the
# binary says so and exits 2 (src/main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
# The command line of `fsbench`.
clap.workspace = true
# The null file system (`fsbench null-fs`): the same FUSE library, at the same commit, as
# `tierstore fs`, so the control differs from tierstore in what it serves alone.
fuser.workspace = true
# The digest of a file list, written lowercase.
hex.workspace = true
# `posix_fadvise` (a cold read), `stat` (the device of a mount), the clock ticks of /proc, the
# effective user of a mount and the page size; pipes for the tests of `tsnull` (a device that
# takes spliced replies, one that ends before INIT); the CPU a storm thread or probe is pinned to
# (`sched_setaffinity`, `fsbench storm`).
rustix = { workspace = true, features = ["fs", "param", "pipe", "process", "thread"] }
# The records of a run (one JSON object per line) and the messages between the processes.
serde.workspace = true
serde_json.workspace = true
# The digest of a file list and of the server's executable, recorded with every run.
sha2.workspace = true
thiserror.workspace = true
# The null file system of the redesign's variants (`fsbench tsfuse-null-fs`, V3, V4 and V5 of
# docs/design/fetch-cache-serve.md, 17.1) and the storm's (`fsbench storm`): the FUSE library of
# tierstore, with cloned readers, the splice reply path and the io_uring transport.
tsfuse.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Scratch directories of the tests.
tierstore-testkit.workspace = true

[lints]
workspace = true
