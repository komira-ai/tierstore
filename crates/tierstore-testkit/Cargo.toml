[package]
name = "tierstore-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Test support only: a dev-dependency of `tierstore` and `objstore-s3`, and of nothing else.
# rustix makes the socket calls of `port`; libc is for the signals, `close_range` and
# `prctl` of `reaped`; reqwest and rustls make the client of `http`.
[dependencies]
libc.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls.workspace = true
rustix = { workspace = true, features = ["net", "process"] }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but does
# not run its tests: the tests of its socket directories bind a Unix socket under the test's TMPDIR,
# which on the farm is too deep for a socket's path (komira-ai/buildrules#170). They run in ci.yml
# alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
