[package]
name = "tierstore-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Test support only, and the one place that builds two releases side by side: the tests in
# `tests/` run the previous release's `tierstore` library (the dev-dependency `tierstore_prev`,
# pinned to the commit of its tag) and this branch's against the same directory and the same S3
# service, to show that each reads what the other wrote. `src/lib.rs` holds the fixtures the
# tests share. It is a dev-dependency of nothing and no release builds it.

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
objstore-s3 = { workspace = true, features = ["testkit"] }
rcgen.workspace = true
tierstore = { workspace = true, features = ["s3", "server"] }
# The previous release, pinned in the root `[workspace.dependencies]`.
tierstore_prev = { workspace = true, features = ["s3", "server"] }
tierstore-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
