[package]
name = "tierstore-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Test support only, and the one place that builds two releases side by side: the tests in
# `tests/` run the previous release's `tierstore` library (the dev-dependency `tierstore_prev`,
# pinned to the commit of its tag) and this branch's against the same directory and the same S3
# service, to show that each reads what the other wrote. `src/lib.rs` holds the fixtures the
# tests share. It is a dev-dependency of nothing and no release builds it.

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
objstore-s3 = { workspace = true, features = ["testkit"] }
rcgen.workspace = true
# The process-wide crypto provider the previous release's S3 client needs here (`tests/s3.rs`).
rustls.workspace = true
# `server` for the binary's own entry point (`server::cli::main`), which `tests/config.rs` runs on
# a configuration file with `--check-config`, in each release.
tierstore = { workspace = true, features = ["s3", "server"] }
# The previous release, pinned in the root `[workspace.dependencies]`.
tierstore_prev = { workspace = true, features = ["s3", "server"] }
tierstore-testkit.workspace = true
# This branch's new cache (`[cache]`): its entry store, the types of its entries and the boot id
# of its journal, which `tests/cache_root.rs` writes `packs-v2/` with.
tierstore-entry.workspace = true
tierstore-fetch-api.workspace = true
tierstore-format.workspace = true
tierstore-journal.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.buildrules]
# Policy only: `actions = { name = ["lint", "test"] }`, `default-action`, `[package.metadata.buildrules.lint]`.
# Absent keys inherit [workspace.metadata.buildrules]. See docs/contract.md.
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but does
# not run its tests: `tests/s3.rs` builds the previous release's S3 client, which is built on
# reqwest's defaults, and with the rustls of this release's client those read the system's CA
# certificates and refuse to build where there are none, as in a farm action. They run in ci.yml
# alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
