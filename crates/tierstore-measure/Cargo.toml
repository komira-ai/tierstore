[package]
name = "tierstore-measure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The farm measurements that set the constants of the fetch, cache and cold-tier design: HDDs, the cache device, silo ranged GETs, a cold-tier prototype, writes and churn, CPU, node facts."

[[bin]]
name = "ts-measure"
path = "src/main.rs"

# The arms are Linux only: they read block devices, /proc and /sys, and use `O_DIRECT`,
# `posix_fadvise`, `fdatasync`, `fallocate` hole punching and `sendfile`. On another system the
# library is empty and the binary says so and exits 2 (src/main.rs).
[target.'cfg(target_os = "linux")'.dependencies]
blake3.workspace = true
clap.workspace = true
crc32c.workspace = true
futures.workspace = true
objstore-s3.workspace = true
ring.workspace = true
rustix = { workspace = true, features = ["fs", "net", "pipe"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
bytes.workspace = true
objstore-s3 = { workspace = true, features = ["testkit"] }
tierstore-testkit.workspace = true
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but does
# not run its tests: its one integration test, tests/unsupported.rs, is for systems other than
# Linux, so on Linux its target lists no test, which buildrules' test gate refuses; and its
# measurements read block devices, /proc and /sys. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
