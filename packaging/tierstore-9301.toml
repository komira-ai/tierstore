# /etc/tierstore/tierstore-9301.toml: the configuration of tierstore@9301.service, the slot of
# the update hook's hand-over whose private port is 9301, root:tierstore, mode 0640. The other slot
# has its own file, which differs from this file in the port, the proxy id and `slot` and in
# nothing else. crates/tierstore/docs/configuration.md says what every key does.
#
# Edit before use: the buckets, the endpoints (http://host[:port], no path) and the hot tier's
# budget, the same in both slot files. Keep the s3 interface, `proxy_id`, `slot` and `lock_file` as
# they are: the hook probes the slot on 127.0.0.1:9301 and reads the slot label of the build
# gauge, the proxy id gives each slot its own registration and entries in the hot tier, and the lock file is the
# same for both slots, so that the slot that starts beside a running one serves at once and
# reconciles once the other has exited. The s3 interface is the wildcard of both families, since
# a packet that the hook's redirect sends here arrives with the address of the interface it came in on.
#
# The key files are owned by the account of the unit (User=), mode 0600; the process refuses one
# that its group or others can read. The file holds no secret, only their paths.

[[interface]]
type   = "s3"
params = { addresses = ["0.0.0.0:9301", "[::]:9301"] }

[server]
proxy_id            = "tierstore-9301"
slot                = 9301
bucket              = "tierstore"
access_key_file     = "/etc/tierstore/access.key"
read_only_key_files = ["/etc/tierstore/daemons.key"]

[hot_store]
kind             = "s3"
bucket           = "tierstore-hot"
endpoint         = "http://s3-hot.example:9000"
credentials_file = "/etc/tierstore/hot.credentials"
budget           = "1TiB"
lock_file        = "/var/lib/tierstore/instance.lock"

[cold_store]
kind             = "s3"
bucket           = "tierstore-cold"
endpoint         = "http://s3-cold.example:9000"
credentials_file = "/etc/tierstore/cold.credentials"
