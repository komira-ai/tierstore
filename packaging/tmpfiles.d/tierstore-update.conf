# tmpfiles.d: the state directory of tierstore's update hook, the declaration's state_dir, and its
# slots directory. Owner and group tierstore-update (packaging/tierstore-update.conf), mode 0750:
# the hook writes, the group (which lists the service account) reads and traverses, and nobody
# else gets in. The group has no write bit: the service must not change the record or a link.
# The hook refuses a state directory of any other mode or owner, and never repairs one; the age
# field is "-", so nothing here is ever cleaned.
d /var/lib/updater/hooks/tierstore 0750 tierstore-update tierstore-update -
d /var/lib/updater/hooks/tierstore/slots 0750 tierstore-update tierstore-update -
