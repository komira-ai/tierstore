# /usr/local/etc/updater.d/tierstore.toml: tierstore's declaration for the host updater on a Mac.
# root:wheel, mode 0644, in directories root owns that no group or others can write (the hook
# refuses it otherwise; /etc is a link on macOS, so the declaration is not under it). It names
# the hook (`tierstore update-hook <step>`, crates/tierstore/docs/update-hook.md), the account
# the service runs as, and the one launchd job the hook stops and starts. The hook reads uid,
# health_ports, state_dir and hook.service before every step; the rest is the updater's.
#
# A Mac runs one instance (com.komira.tierstore.plist), and an update is a plain restart: the
# hook stops the job, points /usr/local/tierstore/current at the staged release and starts it
# again, so the instance does not serve for the length of that restart.
#
# Top-level keys come first: in TOML a key after a table header belongs to that table.
name = "tierstore"
# The hook executable, inside the verified release; the updater runs `tierstore update-hook`.
binary = "tierstore"
# Whose attestation the release must carry: this repository's artifacts workflow.
signer = { repository = "komira-ai/tierstore", workflow = "artifacts.yml" }
# The account the service runs as (the plist's UserName). Required here.
uid = "_tierstore"
registration_ttl_secs = 300
# The one port of the one instance, on loopback (the s3 interface and `slot` in tierstore.toml).
health_ports = [9300]
# After cutover, verify must succeed by then (at least verify plus rollback, below), or the
# updater rolls back.
verify_deadline_secs = 3200
# The one ceiling on a pending promotion: the updater applies it, the hook never does.
promotion_ceiling_secs = 3600
# A cleanup that fails after its commit is run again forward this many times.
cleanup_retries = 3
# The hook's record and lock: owner root, mode 0700. The service never reads it: it runs from
# the release links, which are in /usr/local/tierstore (owner root, mode 0755).
state_dir = "/var/db/updater/hooks/tierstore"
# At the updater's start: `tierstore update-hook restore` starts the job if it is not running
# (launchd starts it at boot by itself, RunAtLoad).
boot = "restore"

[hook]
# The hook runs as root: only root may bootstrap and boot out a job of the system domain.
user = "root"
group = "wheel"
# The launchd label of the one job the hook may stop and start. No slot units: there are none.
service = "com.komira.tierstore"
read_paths = [
    "/bin/launchctl",
    "/usr/local/etc/updater.d/tierstore.toml",
    "/Library/LaunchDaemons/com.komira.tierstore.plist",
]
# The release links current and previous; no step touches the service's cache or its keys.
write_paths = ["/usr/local/tierstore"]
environment = {}

[hook.timeout_secs]
# Each is at least the longest the step may take within the hook's own bounds: every launchctl
# call to its time limit (10 s; a bootout 120 s, then up to 30 looks for the job to go), every
# look at the instance to its connect timeout, its whole-request deadline and its pause (8 s), 120 looks for
# /readyz and 60 for the probe. src/server/update_hook/launchd_system_tests.rs adds them up and
# holds these numbers to them.
# Only files are read and written.
prepare = 60
# A re-run's look again (start, /readyz, probe), the swap (stop, start, /readyz, probe) and the
# rollback that follows a failure (stop, start, /readyz): 4820 s at most.
cutover = 5000
# A look, the probe, promotion_bound_secs and a last look: 1396 s at most.
verify = 1500
# The restart of the previous release and its /readyz: 1440 s at most.
rollback = 1500
# A look and the probe: 488 s at most.
cleanup = 600

[hook.params]
# How long verify waits, after the restart, for the new instance to say read-write.
promotion_bound_secs = 900
# One instance: a plain restart, whatever the releases can do.
mode = "restart"
