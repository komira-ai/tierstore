# /usr/local/tierstore/etc/tierstore.toml: tierstore on a Mac, as hostkeeper/units/tierstore.plist
# starts it. root:_tierstore, mode 0640. crates/tierstore/docs/configuration.md says what every key does.
#
# One process serves the whole Mac: the S3 cache on loopback and, from the `fs` interface below, the
# trees as a file system, NFS on loopback mounted at /private/var/tierstore/fs. No other process
# serves that mount: `tierstore fs` serves nothing since 0.3.196. There is no hot tier, no server
# role, no hand-off socket and no firewall redirect. Reads that miss the cache go to the tierstore S3 servers of the storage
# nodes, port 9300. It writes one kind of object there: the objects the Mac's jobs commit into their
# put directories under the put ingest's root (crates/tierstore/docs/operations.md, "The put
# ingest"), so the node takes writes (write_through) and its upstream key may write cas/b/.
#
# Edit before use: replace the six addresses in [cold_store] (documentation addresses here) with
# the addresses of the storage nodes, and set the bucket and the cache budget. Keep the s3 interface as
# it is: the update hook probes the instance on 127.0.0.1:9300 (PUBLIC_PORT in
# src/server/update_hook/mod.rs) and matches the version of its build gauge, and the jobs of this
# Mac read through it on that address. `slot` is kept at the same port only because the packaging
# test expects it; the hook does not read it. Nothing else on the network reaches it.
#
# The proxy id is "tierstore-cache-" and the host id of the facts file hostkeeper writes
# (/var/lib/hostkeeper/facts.json), read at each start; a change of the facts takes a restart.
#
# The key files are owned by _tierstore, mode 0600; the process refuses one its group or others
# can read.

[[interface]]
type   = "s3"
params = { addresses = ["127.0.0.1:9300"] }

# The trees of the node as a file system, served by this process (crates/tierstore/docs/operations.md,
# "The fs interface on a Mac"): the NFS export is on loopback only, at a fixed port so that a restart
# or a hand-over finds the clients' hard mount waiting at the same address, and the process mounts it
# at `mountpoint`, a directory _tierstore owns (the installer package makes it), and unmounts it when
# it stops. The params are those of an fs interface (crates/tierstore/docs/configuration.md);
# `fill_socket` and `cache_path` are refused by name: the interface calls the cache of `local_cache.path` in this
# process. `client_group` is the group of the control socket; `owner` is the user and group every
# entry of every tree reports, by name because the numeric id of _tierstore differs from Mac to Mac;
# `runtime_dir` holds the state that outlives the process (the table of tree numbers, the control
# socket), in the directory the package makes for it, which launchd does not make. `nfs.mount_user`
# is left out: the user of the process owns the mount point.
[[interface]]
type   = "fs"
params = { mountpoint = "/private/var/tierstore/fs", client_group = "_tierstore", owner = "_tierstore:_tierstore", runtime_dir = "/usr/local/tierstore/run/fs", nfs = { listen = "127.0.0.1:12049" } }

# The mount provider jobscheduler's agent on this Mac asks for a job's input tree
# (crates/tierstore/docs/operations.md, "The mount provider"): a Unix socket only, mode 0600, in a
# directory _tierstore owns. It answers with trees under the mount of the `fs` interface above, whose
# `mountpoint` it is (left out, it is taken from that interface; a different one is refused).
[[interface]]
type   = "mount-provider"
params = { socket = "/usr/local/tierstore/run/provider.sock", mountpoint = "/private/var/tierstore/fs" }

[server]
proxy_id_from_facts = { path = "/var/lib/hostkeeper/facts.json", prefix = "tierstore-cache-" }
slot                = 9300
bucket              = "tierstore"
access_key_file     = "/usr/local/tierstore/etc/access.key"
read_only_key_files = ["/usr/local/tierstore/etc/daemons.key"]

[local_cache]
path             = "/usr/local/tierstore/cache"
budget           = "200GiB"
whole_fill_limit = "128MiB"
write_through    = true
# The root of the jobs' put directories, made by the installer package (_tierstore, 0755);
# jobscheduler's agent makes each job's cas/b/<build>/<nonce> under it.
put_ingest       = "/usr/local/tierstore/put"

[cold_store]
kind             = "s3"
bucket           = "tierstore"
# The storage nodes' tierstore S3 servers. A read goes to the next one when a connect fails
# (docs/design/multi-endpoint-store.md).
endpoints        = [
    "http://192.0.2.1:9300",
    "http://192.0.2.2:9300",
    "http://192.0.2.3:9300",
    "http://192.0.2.4:9300",
    "http://192.0.2.5:9300",
    "http://192.0.2.6:9300",
]
# A key of the storage nodes that may read cas/ and write cas/b/: the put ingest's objects.
credentials_file = "/usr/local/tierstore/etc/upstream-write.key"

[[policy]]
prefix = "cas/"
cache  = true
