# /usr/local/tierstore/etc/fs.toml: `tierstore fs` on a Mac, as the package's tierstore-fs.plist
# starts it (`tierstore fs --config <this file>`). root:_tierstore, mode 0640.
# crates/tierstore/docs/configuration.md says what every key does.
#
# The file service serves the trees of the node's tierstore (tierstore.toml) read-only over NFSv3 on
# loopback and mounts the export itself at `mountpoint`. It holds no secret and no key file. Its keys
# repeat what tierstore.toml says, so that the two files agree: `cache_path` is its local_cache.path,
# and `mountpoint`, `runtime_dir`, `client_group`, `owner` and `nfs.listen` are the params of its fs
# interface; a packaging test holds them to it.

[fs]
# The group of the file service's control socket; the process must be a member of it. The job runs
# as _tierstore, so this is its group.
client_group = "_tierstore"

# The user and group every entry of every tree reports: the user the jobs run as, here the job's
# own account. Names, because the numeric id of _tierstore differs from Mac to Mac.
owner = "_tierstore:_tierstore"

# Read and ignored since 0.3.196: no fill socket is served, and tierstore.toml names none.
fill_socket = "/usr/local/tierstore/run/fill.sock"

# tierstore.toml's local_cache.path: the node's cache directory.
cache_path = "/usr/local/tierstore/cache"

# The directory of the NFS mount, a directory _tierstore owns (the package makes it): the mount
# provider of tierstore.toml puts the trees under it, and the jobs read them there.
mountpoint = "/private/var/tierstore/fs"

# The state that outlives the process (the table of tree numbers, the control socket), in the
# directory the package makes for it, which launchd does not make.
runtime_dir = "/usr/local/tierstore/run/fs"

[fs.nfs]
# Where NFS and MOUNT are served, on loopback only; a fixed port, so that a restart finds its mount
# and the clients' hard mount waits for the same address. `mount_user` is left out: the user of
# the process, _tierstore, owns the mount point.
listen = "127.0.0.1:12049"
