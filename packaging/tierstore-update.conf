# sysusers.d: the account of tierstore's update hook (`tierstore update-hook`, run by the host
# updater as the declaration's hook.user and hook.group). It owns the hook's state directory,
# /var/lib/updater/hooks/tierstore: the record, the lock and the slot links. It is an account of
# its own, not the service's, so that the service can never write what the hook trusts, and it
# is in no group of the service's, so that it cannot read the service's key files. Own group, no
# login, no home.
u tierstore-update - "tierstore update hook" /nonexistent /usr/sbin/nologin
# The service account (tierstore.conf) is a member of the hook's group: the state directory is
# mode 0750, so the service may traverse it and run the binary a slot link points at, and may
# write nothing there. The hook checks this listing in /etc/group before every step.
m tierstore tierstore-update
