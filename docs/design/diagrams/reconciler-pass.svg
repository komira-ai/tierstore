<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 956" width="960" height="956" role="img" aria-label="Flow of one leader pass: hold the lease, list registrations, for each node read its journal, copy objects to cold, write its checkpoint and delete journal objects, then evict, retire departed nodes and publish usage, then wait and repeat.">
<title>One leader pass</title>
<defs><marker id="reconciler-pass-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="reconciler-pass-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-n{fill:#5A5A57;font-size:13px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="956" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">One pass of the leader (the holder of _tiering/lease), in order</text>
<polygon points="30,101.0 245,64 460,101.0 245,138" class="box-b" stroke-linejoin="round"/>
<text x="245" y="97.0" class="b" text-anchor="middle">1  Hold the lease?</text>
<text x="245" y="115.0" class="t-n" text-anchor="middle">renew, acquire or take over</text>
<line x1="460" y1="101.0" x2="500" y2="101.0" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<text x="480" y="93.0" class="b lbl" text-anchor="middle">no</text>
<text x="512" y="95.0" class="b">The pass ends: this process copies and evicts nothing.</text>
<text x="512" y="115.0" class="t-n">Held: renew with If-Match on its tag (if that fails, stop).</text>
<text x="512" y="133.0" class="t-n">Not the holder: try the create-only acquire, or take over</text>
<text x="512" y="151.0" class="t-n">with If-Match once the 30 s ttl has passed.</text>
<line x1="245" y1="138" x2="245" y2="164" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<text x="257" y="155" class="b lbl">yes</text>
<rect x="30" y="164" width="430" height="58" rx="5" class="box-b"/>
<text x="44" y="188" class="b">2  List registrations</text>
<text x="44" y="208" class="t-n">list _tiering/proxies/ in the hot tier</text>
<text x="512" y="186" class="t-n">One registration per node boot: &lt;node&gt;-&lt;boot id&gt;.</text>
<text x="512" y="204" class="t-n">Each is rewritten every minute as a heartbeat.</text>
<line x1="245" y1="222" x2="245" y2="248" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<rect x="30" y="248" width="430" height="58" rx="5" class="box-b"/>
<text x="44" y="272" class="b">3  Read journal objects</text>
<text x="44" y="292" class="t-n">per node: those after its checkpoint, in order</text>
<text x="512" y="270" class="t-n">_journal/&lt;id&gt;/&lt;seq&gt; in the hot tier. Each lists keys whose</text>
<text x="512" y="288" class="t-n">reservations the node holds in the cold tier.</text>
<line x1="245" y1="306" x2="245" y2="332" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<rect x="30" y="332" width="430" height="92" rx="5" class="box-b"/>
<text x="44" y="356" class="b">4  Copy each object to cold</text>
<text x="44" y="376" class="t-n">replace the reservation with If-Match, streamed</text>
<text x="512" y="354" class="t-n">Read once from hot, streamed into the cold put, no whole-file</text>
<text x="512" y="372" class="t-n">buffer. If-Match on the reservation's tag: the copy replaces</text>
<text x="512" y="390" class="t-n">that reservation and nothing else; the key becomes real.</text>
<text x="512" y="408" class="t-n">Up to 16 copies in flight.</text>
<line x1="245" y1="424" x2="245" y2="450" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<rect x="30" y="450" width="430" height="58" rx="5" class="box-b"/>
<text x="44" y="474" class="b">5  Write the checkpoint</text>
<text x="44" y="494" class="t-n">_tiering/checkpoint/&lt;id&gt;, If-Match, never backwards</text>
<text x="512" y="472" class="t-n">Records how far this node's journal is applied.</text>
<text x="512" y="490" class="t-n">A write that would move it back is refused.</text>
<line x1="245" y1="508" x2="245" y2="534" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<rect x="30" y="534" width="430" height="58" rx="5" class="box-b"/>
<text x="44" y="558" class="b">6  Delete those journal objects</text>
<text x="44" y="578" class="t-n">at once, so each journal stays bounded</text>
<text x="512" y="556" class="t-n">Only objects at or below the checkpoint just written.</text>
<line x1="245" y1="592" x2="245" y2="618" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<rect x="30" y="618" width="430" height="74" rx="5" class="box-b"/>
<text x="44" y="642" class="b">7  Evict above high water</text>
<text x="44" y="662" class="t-n">down to low water, per object</text>
<text x="512" y="640" class="t-n">Cold must hold the real object for the key (not a reservation);</text>
<text x="512" y="658" class="t-n">then delete from hot, conditional on the hot tag just read.</text>
<text x="512" y="676" class="t-n">Tags are never compared across tiers.</text>
<line x1="245" y1="692" x2="245" y2="718" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<rect x="30" y="718" width="430" height="58" rx="5" class="box-b"/>
<text x="44" y="742" class="b">8  Retire departed nodes</text>
<text x="44" y="762" class="t-n">closed, or unchanged for 10 minutes</text>
<text x="512" y="740" class="t-n">Sentinel, apply below it, delete: see "One node: boot,</text>
<text x="512" y="758" class="t-n">heartbeat, stop or silence" (node lifecycle).</text>
<line x1="245" y1="776" x2="245" y2="802" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<rect x="30" y="802" width="430" height="58" rx="5" class="box-b"/>
<text x="44" y="826" class="b">9  Publish usage</text>
<text x="44" y="846" class="t-n">_tiering/usage in the hot tier</text>
<text x="512" y="824" class="t-n">Written every pass that holds the lease, by the leader only,</text>
<text x="512" y="842" class="t-n">to show how full the hot tier is.</text>
<polyline points="464,248 474,248 474,592 464,592" class="ln"/>
<text transform="translate(494 420.0) rotate(-90)" class="b" text-anchor="middle" font-size="12">for each node: steps 3 to 6</text>
<line x1="245" y1="860" x2="245" y2="886" class="ln" marker-end="url(#reconciler-pass-ak)"/>
<rect x="30" y="886" width="430" height="40" rx="5" class="box-b"/>
<text x="44" y="911" class="b">Wait (--reconcile-interval, 5 s), then the next pass</text>
<text x="512" y="911" class="t-n">back to step 1 (the lease is renewed once per pass)</text>
<path d="M30,906 L12,906 L12,101.0 L30,101.0" class="ln-d" marker-end="url(#reconciler-pass-ak)"/>
<text x="20" y="946" class="t-m">next pass</text>
</svg>
