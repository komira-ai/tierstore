<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 466" width="960" height="466" role="img" aria-label="Sequence diagram of a delete through the S3 front: the core takes or amends the entry, deletes cold (GCS) then hot, and finishes.">
<title>A delete through the S3 front, hot = s3, cold = gcs</title>
<defs><marker id="seq-iface-delete-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="seq-iface-delete-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="466" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">A delete through the S3 front, hot = s3, cold = gcs</text>
<rect x="55" y="44" width="110" height="32" rx="5" class="box-b"/><text x="110" y="65" class="b" text-anchor="middle">Client</text>
<line x1="110" y1="76" x2="110" y2="394" class="ln-d"/>
<rect x="245" y="44" width="110" height="32" rx="5" class="box-b"/><text x="300" y="65" class="b" text-anchor="middle">S3 front</text>
<line x1="300" y1="76" x2="300" y2="394" class="ln-d"/>
<rect x="435" y="44" width="110" height="32" rx="5" class="box"/><text x="490" y="65" class="b" text-anchor="middle">Proxy core</text>
<line x1="490" y1="76" x2="490" y2="394" class="ln-d"/>
<rect x="635" y="44" width="110" height="32" rx="5" class="box"/><text x="690" y="65" class="b" text-anchor="middle">Hot (s3)</text>
<line x1="690" y1="76" x2="690" y2="394" class="ln-d"/>
<rect x="805" y="44" width="110" height="32" rx="5" class="box"/><text x="860" y="65" class="b" text-anchor="middle">Cold (gcs)</text>
<line x1="860" y1="76" x2="860" y2="394" class="ln-d"/>
<text x="205.0" y="112" class="t-m lbl" text-anchor="middle">0  DELETE /bucket/K (signed)</text>
<line x1="110" y1="124" x2="300" y2="124" class="ln" marker-end="url(#seq-iface-delete-ak)"/>
<text x="395.0" y="150" class="t-m lbl" text-anchor="middle">1  verify; key rules; Proxy::delete(K')</text>
<line x1="300" y1="162" x2="490" y2="162" class="ln" marker-end="url(#seq-iface-delete-ak)"/>
<text x="590.0" y="188" class="t-m lbl" text-anchor="middle">2  take or amend the entry (create-only, or If-Match)</text>
<line x1="490" y1="200" x2="690" y2="200" class="ln" marker-end="url(#seq-iface-delete-ak)"/>
<text x="675.0" y="226" class="t-m lbl" text-anchor="middle">3  cold delete K'  (GCS objects.delete; 404 = success)</text>
<line x1="490" y1="238" x2="860" y2="238" class="ln" marker-end="url(#seq-iface-delete-ak)"/>
<text x="590.0" y="264" class="t-m lbl" text-anchor="middle">4  hot delete K'  (404 = success)</text>
<line x1="490" y1="276" x2="690" y2="276" class="ln" marker-end="url(#seq-iface-delete-ak)"/>
<text x="590.0" y="302" class="t-m lbl" text-anchor="middle">5  delete the entry, or (DEL, PENDING) for the leader;</text>
<text x="590.0" y="318" class="t-m lbl" text-anchor="middle">wait for its release if a copy was in flight</text>
<line x1="490" y1="330" x2="690" y2="330" class="ln" marker-end="url(#seq-iface-delete-ak)"/>
<text x="300.0" y="356" class="t-m lbl" text-anchor="middle">6  204 (also for an absent key)</text>
<line x1="490" y1="368" x2="110" y2="368" class="ln-o" marker-end="url(#seq-iface-delete-ao)"/>
<rect x="30" y="404" width="900" height="48" rx="5" class="box-o"/>
<text x="40" y="424" class="t-m">Cold is deleted first so a cold-served read cannot return what hot lost. The core does this for every front; the front authenticates, maps the key and renders 204 or 503.</text>
<text x="40" y="440" class="t-m">A missing object is 404 on GCS and the store maps it to success, as a missing S3 key is. The conditional delete (ifGenerationMatch) stays optional, a fence only.</text>
</svg>
