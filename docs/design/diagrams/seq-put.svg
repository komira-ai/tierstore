<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 776" width="960" height="776" role="img" aria-label="Sequence diagram of a put: Client, Node, Hot tier, Cold tier. The node takes an entry for the key in hot with a create-only write, checks both tiers for the key, lands the object in hot, then moves the entry to PENDING with a compare-and-swap, which is the acknowledgement point. The leader copies the object to cold later.">
<title>A put: take the entry of the key, check both tiers, land in hot, then acknowledge</title>
<defs><marker id="seq-put-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="seq-put-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-n{fill:#5A5A57;font-size:13px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="776" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">A put: take the entry of the key, check both tiers, land in hot, then acknowledge</text>
<rect x="55" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="110" y="65" class="b" text-anchor="middle">Client</text>
<rect x="285" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="340" y="65" class="b" text-anchor="middle">Node</text>
<rect x="545" y="44" width="110" height="32" rx="5" class="box"/>
<text x="600" y="65" class="b" text-anchor="middle">Hot tier</text>
<rect x="785" y="44" width="110" height="32" rx="5" class="box"/>
<text x="840" y="65" class="b" text-anchor="middle">Cold tier</text>
<line x1="110" y1="76" x2="110" y2="678" class="ln-d"/>
<line x1="340" y1="76" x2="340" y2="678" class="ln-d"/>
<line x1="600" y1="76" x2="600" y2="678" class="ln-d"/>
<line x1="840" y1="76" x2="840" y2="678" class="ln-d"/>
<text x="225.0" y="112" class="t-m lbl" text-anchor="middle">0  PUT key (streamed body)</text>
<text x="225.0" y="128" class="t-m lbl" text-anchor="middle">refuse a reserved key</text>
<line x1="110" y1="140" x2="340" y2="140" class="ln" marker-end="url(#seq-put-ak)"/>
<text x="470.0" y="166" class="t-m lbl" text-anchor="middle">1  hot HEAD key: present means 412 at once, no entry</text>
<line x1="340" y1="178" x2="600" y2="178" class="ln" marker-end="url(#seq-put-ak)"/>
<text x="470.0" y="204" class="t-m lbl" text-anchor="middle">2  create _entries/&lt;sha256(key)&gt;, create-only</text>
<text x="470.0" y="220" class="t-m lbl" text-anchor="middle">the entry (PUT, HELD, this node): the key is ours</text>
<line x1="340" y1="232" x2="600" y2="232" class="ln" marker-end="url(#seq-put-ak)"/>
<text x="470.0" y="258" class="t-m lbl" text-anchor="middle">created</text>
<line x1="600" y1="270" x2="340" y2="270" class="ln-d" marker-end="url(#seq-put-ak)"/>
<rect x="30" y="284" width="900" height="48" rx="5" fill="#FFFFFF"/>
<rect x="30" y="284" width="900" height="48" rx="5" class="box-p"/>
<text x="40" y="304" class="t-m">EXISTS: read the entry. A delete in flight, or another put still HELD: 503 SlowDown. A put or copy-back PENDING, or any SEALED entry: one lockless</text>
<text x="40" y="320" class="t-m">HEAD of each tier; the key found in either is 412, else 503. Never a wait inside the proxy.</text>
<text x="470.0" y="358" class="t-m lbl" text-anchor="middle">3a  hot HEAD key (again, now under the entry)</text>
<line x1="340" y1="370" x2="600" y2="370" class="ln" marker-end="url(#seq-put-ak)"/>
<text x="590.0" y="396" class="t-m lbl" text-anchor="middle">3b  cold HEAD key: this decides write-once</text>
<text x="590.0" y="412" class="t-m lbl" text-anchor="middle">present: free the entry, 412. Cold error: free the entry, 503</text>
<line x1="340" y1="424" x2="840" y2="424" class="ln" marker-end="url(#seq-put-ak)"/>
<text x="590.0" y="450" class="t-m lbl" text-anchor="middle">absent in both</text>
<line x1="840" y1="462" x2="340" y2="462" class="ln-d" marker-end="url(#seq-put-ak)"/>
<text x="470.0" y="488" class="t-m lbl" text-anchor="middle">4  hot create key, create-only, streamed</text>
<text x="470.0" y="504" class="t-m lbl" text-anchor="middle">(hot Full: cold create-only instead; a presigned put at Full is</text>
<text x="470.0" y="520" class="t-m lbl" text-anchor="middle">503)</text>
<line x1="340" y1="532" x2="600" y2="532" class="ln" marker-end="url(#seq-put-ak)"/>
<text x="470.0" y="558" class="t-m lbl" text-anchor="middle">durable</text>
<line x1="600" y1="570" x2="340" y2="570" class="ln-d" marker-end="url(#seq-put-ak)"/>
<text x="470.0" y="596" class="t-m lbl" text-anchor="middle">5  CAS the entry, If-Match: (PUT,HELD) to (PUT,PENDING)</text>
<text x="470.0" y="612" class="t-m lbl" text-anchor="middle">the CAS is the acknowledgement point</text>
<line x1="340" y1="624" x2="600" y2="624" class="ln-o" marker-end="url(#seq-put-ao)"/>
<text x="225.0" y="650" class="t-m lbl" text-anchor="middle">6  200: ACK POINT</text>
<line x1="340" y1="662" x2="110" y2="662" class="ln-o" marker-end="url(#seq-put-ao)"/>
<rect x="30" y="676" width="900" height="80" rx="5" class="box-o"/>
<text x="40" y="696" class="t-m">After the ack: hot holds the object and a PENDING entry; cold holds nothing for the key yet. The leader finds the entry by LIST, copies hot to</text>
<text x="40" y="712" class="t-m">cold create-only and deletes the entry (entry lifecycle). A put never waits for the leader or for eviction. If the CAS fails (the entry was reaped</text>
<text x="40" y="728" class="t-m">or amended by a DELETE): 503, and the node never touches the entry or the data again. An ambiguous CAS is read back by its nonce, never treated as</text>
<text x="40" y="744" class="t-m">failed. A 503 after landing is an unknown outcome: the key may exist.</text>
</svg>
