<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" role="img" aria-label="Table of every path in the hot and cold tiers: client objects, entries, registrations, the lease, the usage object, the format marker, self-test probes, and the old journal and checkpoint objects that the bridge release leaves in place until a later release removes them. For each: the tier, the writer, the write mode and the lifetime.">
<title>Where each key lives: every path, who writes it, how, and when it goes</title>
<defs><marker id="store-paths-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="store-paths-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-n{fill:#5A5A57;font-size:13px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="664" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">Where each key lives: every path, who writes it, how, and when it goes</text>
<rect x="20" y="44" width="920" height="28" rx="5" class="box-b"/>
<text x="30" y="63" class="b">Path (tier)</text>
<text x="230" y="63" class="b">Written by</text>
<text x="410" y="63" class="b">Write mode</text>
<text x="590" y="63" class="b">Goes when</text>
<rect x="20" y="78" width="920" height="46" rx="5" class="box"/>
<text x="30" y="98" class="b">&lt;client key&gt;  (hot)</text>
<line x1="220" y1="78" x2="220" y2="124" class="ln"/>
<text x="230" y="98" class="t-m">a put, under its entry; the</text>
<text x="230" y="114" class="t-m">leader's copy-back</text>
<line x1="400" y1="78" x2="400" y2="124" class="ln"/>
<text x="410" y="98" class="t-m">create-only</text>
<line x1="580" y1="78" x2="580" y2="124" class="ln"/>
<text x="590" y="98" class="t-m">evicted (under its own entry) or deleted by the client</text>
<rect x="20" y="130" width="920" height="78" rx="5" class="box-o"/>
<text x="30" y="150" class="b">_entries/&lt;sha256 of key&gt;</text>
<text x="30" y="166" class="b">(hot)</text>
<line x1="220" y1="130" x2="220" y2="208" class="ln-o"/>
<text x="230" y="150" class="t-m">a put, delete or copy-back;</text>
<text x="230" y="166" class="t-m">the leader (HELD before a</text>
<text x="230" y="182" class="t-m">copy, eviction, strays,</text>
<text x="230" y="198" class="t-m">reap)</text>
<line x1="400" y1="130" x2="400" y2="208" class="ln-o"/>
<text x="410" y="150" class="t-m">create-only; changed only</text>
<text x="410" y="166" class="t-m">by If-Match</text>
<line x1="580" y1="130" x2="580" y2="208" class="ln-o"/>
<text x="590" y="150" class="t-m">deleted by its holder: a fresh delete frees its own, the</text>
<text x="590" y="166" class="t-m">leader releases the rest</text>
<rect x="20" y="214" width="920" height="46" rx="5" class="box"/>
<text x="30" y="234" class="b">_tiering/proxies/&lt;id&gt;</text>
<text x="30" y="250" class="b">(hot)</text>
<line x1="220" y1="214" x2="220" y2="260" class="ln"/>
<text x="230" y="234" class="t-m">node &lt;id&gt;: boot, then every</text>
<text x="230" y="250" class="t-m">10 s</text>
<line x1="400" y1="214" x2="400" y2="260" class="ln"/>
<text x="410" y="234" class="t-m">create-only, then If-Match</text>
<line x1="580" y1="214" x2="580" y2="260" class="ln"/>
<text x="590" y="234" class="t-m">deleted by the leader 10 D after departure, if no entry</text>
<text x="590" y="250" class="t-m">names it</text>
<rect x="20" y="266" width="920" height="62" rx="5" class="box"/>
<text x="30" y="286" class="b">_tiering/lease  (hot)</text>
<line x1="220" y1="266" x2="220" y2="328" class="ln"/>
<text x="230" y="286" class="t-m">the leader</text>
<line x1="400" y1="266" x2="400" y2="328" class="ln"/>
<text x="410" y="286" class="t-m">create-only to acquire; If-</text>
<text x="410" y="302" class="t-m">Match to renew and take</text>
<text x="410" y="318" class="t-m">over</text>
<line x1="580" y1="266" x2="580" y2="328" class="ln"/>
<text x="590" y="286" class="t-m">deleted on release if the tag is still the holder's</text>
<rect x="20" y="334" width="920" height="46" rx="5" class="box"/>
<text x="30" y="354" class="b">_tiering/usage  (hot)</text>
<line x1="220" y1="334" x2="220" y2="380" class="ln"/>
<text x="230" y="354" class="t-m">the leader, every 10 s</text>
<line x1="400" y1="334" x2="400" y2="380" class="ln"/>
<text x="410" y="354" class="t-m">overwrite (only the leader</text>
<text x="410" y="370" class="t-m">writes it)</text>
<line x1="580" y1="334" x2="580" y2="380" class="ln"/>
<text x="590" y="354" class="t-m">replaced by the next publish</text>
<rect x="20" y="386" width="920" height="46" rx="5" class="box"/>
<text x="30" y="406" class="b">_tiering/format  (hot)</text>
<line x1="220" y1="386" x2="220" y2="432" class="ln"/>
<text x="230" y="406" class="t-m">the operator verb, rollout</text>
<text x="230" y="422" class="t-m">only</text>
<line x1="400" y1="386" x2="400" y2="432" class="ln"/>
<text x="410" y="406" class="t-m">If-Match</text>
<line x1="580" y1="386" x2="580" y2="432" class="ln"/>
<text x="590" y="406" class="t-m">removed after the cut-over release</text>
<g transform="translate(0,-52)">
<rect x="20" y="490" width="920" height="62" rx="5" class="box"/>
<text x="30" y="510" class="b">&lt;client key&gt;  (cold)</text>
<line x1="220" y1="490" x2="220" y2="552" class="ln"/>
<text x="230" y="510" class="t-m">the leader's copy; a put at</text>
<text x="230" y="526" class="t-m">hot Full; a multipart</text>
<text x="230" y="542" class="t-m">completion</text>
<line x1="400" y1="490" x2="400" y2="552" class="ln"/>
<text x="410" y="510" class="t-m">create-only</text>
<line x1="580" y1="490" x2="580" y2="552" class="ln"/>
<text x="590" y="510" class="t-m">deleted by the client's delete (and again by the leader</text>
<text x="590" y="526" class="t-m">when it finishes one)</text>
<rect x="20" y="558" width="920" height="62" rx="5" class="box-p"/>
<text x="30" y="578" class="b">_journal/*,</text>
<text x="30" y="594" class="b">_tiering/checkpoint/*</text>
<text x="30" y="610" class="b">(hot)</text>
<line x1="220" y1="558" x2="220" y2="620" class="ln"/>
<text x="230" y="578" class="t-m">nobody, after cut-over</text>
<line x1="400" y1="558" x2="400" y2="620" class="ln"/>
<text x="410" y="578" class="t-m">read only by the bridge</text>
<text x="410" y="594" class="t-m">release</text>
<line x1="580" y1="558" x2="580" y2="620" class="ln"/>
<text x="590" y="578" class="t-m">left in place for one release so a rollback finds them;</text>
<text x="590" y="594" class="t-m">then deleted</text>
<text x="20" y="642" class="t-m">Hot holds the data and all coordination state; cold holds client keys only. D = the departure time, 60 s by default.</text>
</g>
</svg>
