<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-label="Two-column timeline: a second put of key K against the reconciler copying K to cold and evicting it from hot; the second ask closes the window.">
<title>Demotion race: a put against copy-then-evict</title>
<defs><marker id="race-demotion-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="race-demotion-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="700" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">Race: a second put of K meets copy-then-evict</text>
<text x="380" y="64" class="b" text-anchor="middle">Proxy: second put of K</text>
<text x="765" y="64" class="b" text-anchor="middle">Reconciler</text>
<line x1="380" y1="72" x2="380" y2="600" class="ln-d"/>
<line x1="765" y1="72" x2="765" y2="600" class="ln-d"/>
<rect x="190" y="80" width="380" height="40" rx="5" class="box"/>
<text x="200" y="105">1  cold.head(K): NotFound</text>
<text x="20" y="105" class="t-m">hot: K    cold: -</text>
<rect x="590" y="150" width="350" height="40" rx="5" class="box"/>
<text x="600" y="175">2  hot.get(K); cold.put(K), create-only: ok</text>
<text x="20" y="175" class="t-m">hot: K    cold: K</text>
<rect x="590" y="220" width="350" height="40" rx="5" class="box"/>
<text x="600" y="245">3  hot.delete(K): evicted (K was copied)</text>
<text x="20" y="245" class="t-m">hot: -    cold: K</text>
<rect x="190" y="290" width="380" height="40" rx="5" class="box"/>
<text x="200" y="315">4  hot.put_stream(K), create-only: ok (name free)</text>
<text x="20" y="315" class="t-m">hot: K2   cold: K</text>
<rect x="190" y="390" width="380" height="40" rx="5" class="box-o"/>
<text x="200" y="415">5  cold.head(K) again: found</text>
<text x="20" y="415" class="t-m">hot: K2   cold: K</text>
<rect x="190" y="460" width="380" height="40" rx="5" class="box-o"/>
<text x="200" y="485">6  hot.delete(K2) best effort; 412 AlreadyExists</text>
<text x="20" y="485" class="t-m">hot: -    cold: K</text>
<polyline points="185,100 160,100 160,310 185,310" class="ln-o"/>
<text x="395" y="350" class="t-m">Window: from the first ask to the create.</text>
<text x="395" y="367" class="t-m">Without step 5 the put is acknowledged while the</text>
<text x="395" y="384" class="t-m">copy in cold already holds K: create-only is broken.</text>
<rect x="30" y="530" width="900" height="86" rx="5" class="box-o"/>
<text x="44" y="554" class="b">How the code closes it</text>
<text x="44" y="574" class="t-m">The second ask (confirm_not_tiered) after the hot create. It is sound only because the reconciler copies to cold before it</text>
<text x="44" y="590" class="t-m">deletes from hot. Cost: two cold HEADs per put. The same check removes the new hot object if cold cannot be asked.</text>
<text x="30" y="640" class="t-m">Stays open: an unsigned put sent to cold (hot full) against a put to hot of the same key can both succeed; presigned puts are hot-only.</text>
</svg>
