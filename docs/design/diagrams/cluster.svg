<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 624" width="960" height="624" role="img" aria-label="Three nodes, one of them the leader, above the hot tier and the cold tier. The hot tier holds client objects, one entry per key being changed, node registrations, the lease and the usage object. The cold tier holds client objects only. Nodes write entries and objects to hot and read cold; the leader copies hot to cold and evicts.">
<title>The cluster at a glance: nodes, the two tiers, and what each writes</title>
<defs><marker id="cluster-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="cluster-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-n{fill:#5A5A57;font-size:13px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="624" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">The cluster at a glance: nodes, the two tiers, and what each writes</text>
<text x="30" y="58" class="b">Nodes: any number of processes; each is a proxy with its own id, and one of them also leads</text>
<rect x="30" y="70" width="290" height="86" rx="5" class="box-o"/>
<text x="42" y="94" class="b">node A, boot id A-4</text>
<text x="42" y="114" class="t-m">LEADER: holds _tiering/lease</text>
<text x="42" y="134" class="t-n">also copies to cold, evicts, reaps</text>
<rect x="335" y="70" width="290" height="86" rx="5" class="box-b"/>
<text x="347" y="94" class="b">node B, boot id B-7</text>
<text x="347" y="114" class="t-m">serves puts and gets</text>
<text x="347" y="134" class="t-n">copies and evicts nothing</text>
<rect x="640" y="70" width="290" height="86" rx="5" class="box-b"/>
<text x="652" y="94" class="b">node C, boot id C-2</text>
<text x="652" y="114" class="t-m">serves puts and gets</text>
<text x="652" y="134" class="t-n">copies and evicts nothing</text>
<line x1="175" y1="156" x2="175" y2="226" class="ln" marker-end="url(#cluster-ak)"/>
<text x="185" y="200" class="t-m lbl">every node writes: entries, objects, heartbeat</text>
<line x1="700" y1="156" x2="700" y2="226" class="ln" marker-end="url(#cluster-ak)"/>
<text x="710" y="184" class="t-m lbl">every node: cold HEAD under</text>
<text x="710" y="200" class="t-m lbl">the entry; read on a hot miss</text>
<rect x="30" y="226" width="520" height="376" rx="5" class="box-p"/>
<text x="44" y="250" class="b" font-size="15">HOT tier</text>
<text x="122" y="250" class="t-n">fast; holds the data until evicted, and all coordination state</text>
<rect x="44" y="268" width="490" height="42" rx="5" class="box"/>
<text x="56" y="286" class="b">&lt;client key&gt;</text>
<text x="56" y="302" class="t-m">the object, under its own key; a hot hit is one read of it</text>
<rect x="44" y="318" width="490" height="42" rx="5" class="box-o"/>
<text x="56" y="336" class="b">_entries/&lt;sha256 of key&gt;</text>
<text x="56" y="352" class="t-m">one per key being changed: the journal record and the lock</text>
<rect x="44" y="368" width="490" height="42" rx="5" class="box"/>
<text x="56" y="386" class="b">_tiering/proxies/&lt;id&gt;</text>
<text x="56" y="402" class="t-m">the node's registration and heartbeat (every 10 s)</text>
<rect x="44" y="418" width="490" height="42" rx="5" class="box"/>
<text x="56" y="436" class="b">_tiering/lease</text>
<text x="56" y="452" class="t-m">whoever holds it is the leader</text>
<rect x="44" y="468" width="490" height="42" rx="5" class="box"/>
<text x="56" y="486" class="b">_tiering/usage</text>
<text x="56" y="502" class="t-m">how full the hot tier is; published by the leader</text>
<rect x="44" y="518" width="490" height="42" rx="5" class="box"/>
<text x="56" y="536" class="b">_tiering/format</text>
<text x="56" y="552" class="t-m">rollout only: the write-pause and activation marker</text>
<text x="44" y="582" class="t-m">plus _tiering/selftest/&lt;run&gt;/ probes at start-up (never client data)</text>
<rect x="600" y="226" width="330" height="200" rx="5" class="box-p"/>
<text x="614" y="250" class="b" font-size="15">COLD tier</text>
<text x="690" y="250" class="t-n">durable</text>
<rect x="614" y="268" width="302" height="52" rx="5" class="box"/>
<text x="626" y="288" class="b">&lt;client key&gt;: the real object</text>
<text x="626" y="306" class="t-m">bytes; the key exists for good</text>
<text x="614" y="346" class="t-m">No reservation, no coordination state:</text>
<text x="614" y="362" class="t-m">the cold tier holds client keys only.</text>
<text x="614" y="386" class="t-m">A cold HEAD under the entry decides write-once.</text>
<rect x="600" y="446" width="330" height="120" rx="5" class="box-o"/>
<text x="612" y="468" class="b">the leader, per entry</text>
<text x="612" y="490" class="t-m">LIST the entries; read each one</text>
<text x="612" y="508" class="t-m">copy hot to cold, create-only, streamed</text>
<text x="612" y="526" class="t-m">seal, then delete the entry</text>
<text x="612" y="544" class="t-m">evict from hot under its own entry</text>
<line x1="600" y1="500" x2="550" y2="500" class="ln-o" marker-end="url(#cluster-ao)"/>
<line x1="765" y1="446" x2="765" y2="426" class="ln-o" marker-end="url(#cluster-ao)"/>
</svg>
