<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 462" width="960" height="462" role="img" aria-label="Sequence diagram of a head: Client, Node, Hot tier, Cold tier. Hot is asked first. On a miss cold is asked directly; no entry is read. A head asks for no copy-back.">
<title>A head: hot first, then cold on a miss; no entry is read</title>
<defs><marker id="seq-head-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="seq-head-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-n{fill:#5A5A57;font-size:13px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="462" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">A head: hot first, then cold on a miss; no entry is read</text>
<rect x="55" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="110" y="65" class="b" text-anchor="middle">Client</text>
<rect x="285" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="340" y="65" class="b" text-anchor="middle">Node</text>
<rect x="545" y="44" width="110" height="32" rx="5" class="box"/>
<text x="600" y="65" class="b" text-anchor="middle">Hot tier</text>
<rect x="785" y="44" width="110" height="32" rx="5" class="box"/>
<text x="840" y="65" class="b" text-anchor="middle">Cold tier</text>
<line x1="110" y1="76" x2="110" y2="412" class="ln-d"/>
<line x1="340" y1="76" x2="340" y2="412" class="ln-d"/>
<line x1="600" y1="76" x2="600" y2="412" class="ln-d"/>
<line x1="840" y1="76" x2="840" y2="412" class="ln-d"/>
<text x="225.0" y="112" class="t-m lbl" text-anchor="middle">0  HEAD key</text>
<line x1="110" y1="124" x2="340" y2="124" class="ln" marker-end="url(#seq-head-ak)"/>
<text x="470.0" y="150" class="t-m lbl" text-anchor="middle">1  hot open_read key (metadata only)</text>
<line x1="340" y1="162" x2="600" y2="162" class="ln" marker-end="url(#seq-head-ak)"/>
<text x="470.0" y="188" class="t-m lbl" text-anchor="middle">found: size, tag, time</text>
<line x1="600" y1="200" x2="340" y2="200" class="ln-d" marker-end="url(#seq-head-ak)"/>
<text x="225.0" y="226" class="t-m lbl" text-anchor="middle">2  200 (a hit is one hot round trip)</text>
<line x1="340" y1="238" x2="110" y2="238" class="ln-o" marker-end="url(#seq-head-ao)"/>
<line x1="20" y1="256" x2="940" y2="256" class="ln-d"/>
<text x="20" y="280" class="b lbl">Hot miss</text>
<text x="590.0" y="308" class="t-m lbl" text-anchor="middle">3  cold HEAD key (no entry is read)</text>
<line x1="340" y1="320" x2="840" y2="320" class="ln" marker-end="url(#seq-head-ak)"/>
<text x="590.0" y="346" class="t-m lbl" text-anchor="middle">found or not found</text>
<line x1="840" y1="358" x2="340" y2="358" class="ln-d" marker-end="url(#seq-head-ak)"/>
<text x="225.0" y="384" class="t-m lbl" text-anchor="middle">4  200 from cold, or 404</text>
<line x1="340" y1="396" x2="110" y2="396" class="ln-o" marker-end="url(#seq-head-ao)"/>
<rect x="30" y="410" width="900" height="32" rx="5" class="box-o"/>
<text x="40" y="430" class="t-m">A head creates no copy-back entry. A hot error other than not-found is returned without asking cold.</text>
</svg>
