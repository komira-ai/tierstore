<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 539" width="960" height="539" role="img" aria-label="Sequence diagram of a head: hot tier first, cold tier on not-found, no copy-back.">
<title>A head: hot first, cold only on a hot NotFound</title>
<defs><marker id="seq-head-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="seq-head-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.6;stroke-dasharray:7 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="539" fill="#FFFFFF"/>
<rect x="55" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="110" y="65" class="b" text-anchor="middle">Client</text>
<line x1="110" y1="76" x2="110" y2="439" class="ln-d"/>
<rect x="285" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="340" y="65" class="b" text-anchor="middle">Proxy</text>
<line x1="340" y1="76" x2="340" y2="439" class="ln-d"/>
<rect x="545" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="600" y="65" class="b" text-anchor="middle">Hot tier</text>
<line x1="600" y1="76" x2="600" y2="439" class="ln-d"/>
<rect x="785" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="840" y="65" class="b" text-anchor="middle">Cold tier</text>
<line x1="840" y1="76" x2="840" y2="439" class="ln-d"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">A head: hot first, cold only on a hot NotFound</text>
<text x="225.0" y="110" class="t-m lbl" text-anchor="middle">0  HEAD key</text>
<line x1="110" y1="119" x2="340" y2="119" class="ln" marker-end="url(#seq-head-ak)"/>
<text x="360" y="137" class="t-m lbl" text-anchor="start">The S3 front refuses a reserved key (403)</text>
<text x="360" y="150" class="t-m lbl" text-anchor="start">before the proxy is called.</text>
<text x="470.0" y="183" class="t-m lbl" text-anchor="middle">1  head(key)</text>
<line x1="340" y1="192" x2="600" y2="192" class="ln" marker-end="url(#seq-head-ak)"/>
<text x="470.0" y="220" class="t-m lbl" text-anchor="middle">found: meta, go to the reply</text>
<text x="470.0" y="233" class="t-m lbl" text-anchor="middle">NotFound: go on</text>
<line x1="600" y1="242" x2="340" y2="242" class="ln-d" marker-end="url(#seq-head-ak)"/>
<text x="360" y="260" class="t-m lbl" text-anchor="start">Any other hot error is returned at once;</text>
<text x="360" y="273" class="t-m lbl" text-anchor="start">the cold tier is not asked.</text>
<text x="590.0" y="306" class="t-m lbl" text-anchor="middle">2  head(key), on a hot NotFound only</text>
<line x1="340" y1="315" x2="840" y2="315" class="ln" marker-end="url(#seq-head-ak)"/>
<text x="590.0" y="343" class="t-m lbl" text-anchor="middle">meta (NotFound: 404; error: error)</text>
<line x1="840" y1="352" x2="340" y2="352" class="ln-d" marker-end="url(#seq-head-ak)"/>
<rect x="30" y="368" width="900" height="60" rx="5" class="box-o"/>
<text x="225.0" y="384" class="t-m lbl" text-anchor="middle">3  200: size, tag, last-modified</text>
<text x="225.0" y="397" class="t-m lbl" text-anchor="middle">(the front first checks If-* headers)</text>
<line x1="340" y1="406" x2="110" y2="406" class="ln-o" marker-end="url(#seq-head-ao)"/>
<text x="40" y="424" class="t-m lbl" text-anchor="start">No body. The reply is the same whichever tier answered.</text>
<rect x="30" y="451" width="900" height="64" rx="5" class="box"/>
<text x="42" y="471" class="b" text-anchor="start">A head never changes either tier</text>
<text x="42" y="489" class="t-m" text-anchor="start">No copy-back and no journal entry: only a get copies an object from cold into hot.</text>
<text x="42" y="505" class="t-m" text-anchor="start">Hot is asked first, so a key that was copied to cold and then evicted from hot is still found, in cold.</text>
</svg>
