<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1230" width="960" height="1230" role="img" aria-label="The life of one write: a reservation in the cold tier, the object and a journal entry in the hot tier, the ack, the leader copy to cold, the checkpoint, the journal delete, and later eviction from hot.">
<title>The life of one write through the hot and cold tier paths</title>
<defs><marker id="journal-lifecycle-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="journal-lifecycle-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-n{fill:#5A5A57;font-size:13px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="1230" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">The life of one write: which tier each step touches</text>
<rect x="25" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="80.0" y="65" class="b" text-anchor="middle">Client</text>
<rect x="175" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="230.0" y="65" class="b" text-anchor="middle">Node</text>
<rect x="385" y="44" width="110" height="32" rx="5" class="box"/>
<text x="440.0" y="65" class="b" text-anchor="middle">Hot tier</text>
<rect x="595" y="44" width="110" height="32" rx="5" class="box"/>
<text x="650.0" y="65" class="b" text-anchor="middle">Cold tier</text>
<rect x="805" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="860.0" y="65" class="b" text-anchor="middle">Leader</text>
<line x1="80" y1="76" x2="80" y2="1200" class="ln-d"/>
<line x1="230" y1="76" x2="230" y2="1200" class="ln-d"/>
<line x1="440" y1="76" x2="440" y2="1200" class="ln-d"/>
<line x1="650" y1="76" x2="650" y2="1200" class="ln-d"/>
<line x1="860" y1="76" x2="860" y2="1200" class="ln-d"/>
<text x="20" y="104" class="b lbl">A  The put (touches cold once, hot twice; the same put as the put sequence)</text>
<line x1="80" y1="148" x2="230" y2="148" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="155.0" y="140" class="t-m lbl" text-anchor="middle">1  PUT key, streamed</text>
<line x1="230" y1="208" x2="650" y2="208" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="184" class="t-m lbl" text-anchor="middle">2  put reservation object for key,</text>
<text x="545" y="200" class="t-m lbl" text-anchor="middle">create-only (If-None-Match: *)</text>
<line x1="650" y1="236" x2="230" y2="236" class="ln-d" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="230" class="t-m lbl" text-anchor="middle">ok: the key is ours</text>
<text x="545" y="248" class="t-m lbl" text-anchor="middle">(already exists: put refused)</text>
<rect x="212" y="268" width="250" height="126" rx="5" class="box-p"/>
<text x="222" y="286" class="t-m">concurrently</text>
<line x1="230" y1="320" x2="440" y2="320" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="335" y="312" class="t-m lbl" text-anchor="middle">3a  put object under its own key</text>
<line x1="230" y1="366" x2="440" y2="366" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="335" y="358" class="t-m lbl" text-anchor="middle">3b  put _journal/&lt;id&gt;/&lt;seq&gt;</text>
<line x1="440" y1="388" x2="230" y2="388" class="ln-d" marker-end="url(#journal-lifecycle-ak)"/>
<text x="335" y="382" class="t-m lbl" text-anchor="middle">both durable</text>
<rect x="30" y="412" width="900" height="86" rx="5" class="box-o"/>
<line x1="230" y1="436" x2="80" y2="436" class="ln-o" marker-end="url(#journal-lifecycle-ao)"/>
<text x="155" y="430" class="t-m lbl" text-anchor="middle">4  200: ACK POINT</text>
<text x="42" y="472" class="t-m">Cold holds only the marked reservation. Hot holds the object and the journal entry.</text>
<text x="42" y="488" class="t-m">The bytes are not in cold yet.</text>
<line x1="20" y1="522" x2="940" y2="522" class="ln-d"/>
<text x="20" y="546" class="b lbl">B  The leader copies it to cold (the one node holding the _tiering/lease object in hot)</text>
<line x1="860" y1="594" x2="440" y2="594" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="586" class="t-m lbl" text-anchor="middle">5  get _journal/&lt;id&gt;/&lt;seq&gt;</text>
<line x1="440" y1="620" x2="860" y2="620" class="ln-d" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="614" class="t-m lbl" text-anchor="middle">the keys in the batch</text>
<line x1="860" y1="668" x2="440" y2="668" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="660" class="t-m lbl" text-anchor="middle">6  get object, streamed</text>
<line x1="440" y1="694" x2="860" y2="694" class="ln-d" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="688" class="t-m lbl" text-anchor="middle">bytes, read once</text>
<line x1="860" y1="752" x2="650" y2="752" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="755" y="728" class="t-m lbl" text-anchor="middle">7  put key (streamed), replaces</text>
<text x="755" y="744" class="t-m lbl" text-anchor="middle">the reservation, If-Match its tag</text>
<line x1="650" y1="778" x2="860" y2="778" class="ln-d" marker-end="url(#journal-lifecycle-ak)"/>
<text x="755" y="772" class="t-m lbl" text-anchor="middle">ok</text>
<line x1="860" y1="828" x2="440" y2="828" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="804" class="t-m lbl" text-anchor="middle">8  put _tiering/checkpoint/&lt;id&gt;</text>
<text x="545" y="820" class="t-m lbl" text-anchor="middle">If-Match, never backwards</text>
<line x1="860" y1="884" x2="440" y2="884" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="860" class="t-m lbl" text-anchor="middle">9  delete _journal/&lt;id&gt;/&lt;seq&gt;</text>
<text x="545" y="876" class="t-m lbl" text-anchor="middle">at once: journals stay small</text>
<rect x="30" y="908" width="900" height="60" rx="5" class="box-o"/>
<text x="42" y="932" class="t-m">Cold now holds the real object. Hot holds the object and the checkpoint; the journal entry is gone.</text>
<text x="42" y="950" class="t-m">Other nodes never copy or evict.</text>
<line x1="20" y1="990" x2="940" y2="990" class="ln-d"/>
<text x="20" y="1014" class="b lbl">C  Later, above high water (down to low water): evict from hot</text>
<line x1="860" y1="1062" x2="650" y2="1062" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="755" y="1054" class="t-m lbl" text-anchor="middle">10  head key</text>
<line x1="650" y1="1088" x2="860" y2="1088" class="ln-d" marker-end="url(#journal-lifecycle-ak)"/>
<text x="755" y="1082" class="t-m lbl" text-anchor="middle">the real object</text>
<text x="755" y="1100" class="t-m lbl" text-anchor="middle">(not a reservation)</text>
<line x1="860" y1="1144" x2="440" y2="1144" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="1136" class="t-m lbl" text-anchor="middle">11  head key: read hot tag T</text>
<line x1="860" y1="1184" x2="440" y2="1184" class="ln" marker-end="url(#journal-lifecycle-ak)"/>
<text x="545" y="1176" class="t-m lbl" text-anchor="middle">12  delete key, If-Match T</text>
<rect x="30" y="1202" width="900" height="22" rx="5" class="box"/>
<text x="42" y="1218" class="t-m">Hot copy gone; cold keeps the real object. If the hot tag changed, the delete fails and the copy stays. Tags are never compared across tiers.</text>
</svg>
