<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 606" width="960" height="606" role="img" aria-label="Sequence diagram of a put through the S3 front over an S3 hot tier and a GCS cold tier. The front checks the signature and maps the key; the core takes the entry with a create-only write, checks both tiers, lands the object in hot, and acknowledges with an If-Match write. The leader later copies the object to GCS with ifGenerationMatch=0.">
<title>A put through the S3 front, hot = s3, cold = gcs</title>
<defs><marker id="seq-iface-put-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="seq-iface-put-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="606" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">A put through the S3 front, hot = s3, cold = gcs</text>
<rect x="55" y="44" width="110" height="32" rx="5" class="box-b"/><text x="110" y="65" class="b" text-anchor="middle">Client</text>
<line x1="110" y1="76" x2="110" y2="518" class="ln-d"/>
<rect x="245" y="44" width="110" height="32" rx="5" class="box-b"/><text x="300" y="65" class="b" text-anchor="middle">S3 front</text>
<line x1="300" y1="76" x2="300" y2="518" class="ln-d"/>
<rect x="435" y="44" width="110" height="32" rx="5" class="box"/><text x="490" y="65" class="b" text-anchor="middle">Proxy core</text>
<line x1="490" y1="76" x2="490" y2="518" class="ln-d"/>
<rect x="635" y="44" width="110" height="32" rx="5" class="box"/><text x="690" y="65" class="b" text-anchor="middle">Hot (s3)</text>
<line x1="690" y1="76" x2="690" y2="518" class="ln-d"/>
<rect x="805" y="44" width="110" height="32" rx="5" class="box"/><text x="860" y="65" class="b" text-anchor="middle">Cold (gcs)</text>
<line x1="860" y1="76" x2="860" y2="518" class="ln-d"/>
<text x="205.0" y="112" class="t-m lbl" text-anchor="middle">0  PUT /bucket/K (signed)</text>
<line x1="110" y1="124" x2="300" y2="124" class="ln" marker-end="url(#seq-iface-put-ak)"/>
<text x="395.0" y="150" class="t-m lbl" text-anchor="middle">1  verify signature; S3 API rules; canonical key K'</text>
<text x="395.0" y="166" class="t-m lbl" text-anchor="middle">(if either fails: 403 or 400, no store is touched)</text>
<line x1="300" y1="178" x2="490" y2="178" class="ln" marker-end="url(#seq-iface-put-ak)"/>
<text x="590.0" y="204" class="t-m lbl" text-anchor="middle">2  create-only write of the entry (If-None-Match: *)</text>
<line x1="490" y1="216" x2="690" y2="216" class="ln" marker-end="url(#seq-iface-put-ak)"/>
<text x="675.0" y="242" class="t-m lbl" text-anchor="middle">3  cold HEAD of K'  (GCS objects.get; 404 = free)</text>
<line x1="490" y1="254" x2="860" y2="254" class="ln" marker-end="url(#seq-iface-put-ak)"/>
<text x="590.0" y="280" class="t-m lbl" text-anchor="middle">4  hot HEAD, then create-only write of K'</text>
<line x1="490" y1="292" x2="690" y2="292" class="ln" marker-end="url(#seq-iface-put-ak)"/>
<text x="590.0" y="318" class="t-m lbl" text-anchor="middle">5  If-Match write: entry to (PUT, PENDING) = acknowledgement</text>
<line x1="490" y1="330" x2="690" y2="330" class="ln" marker-end="url(#seq-iface-put-ak)"/>
<text x="300.0" y="356" class="t-m lbl" text-anchor="middle">6  200 (the S3 front renders the answer)</text>
<line x1="490" y1="368" x2="110" y2="368" class="ln-o" marker-end="url(#seq-iface-put-ao)"/>
<line x1="20" y1="398" x2="940" y2="398" class="ln-d"/>
<text x="20" y="420" class="b lbl">Later, by the leader</text>
<text x="675.0" y="442" class="t-m lbl" text-anchor="middle">7  copy K' to cold: GCS upload with ifGenerationMatch=0</text>
<line x1="490" y1="454" x2="860" y2="454" class="ln" marker-end="url(#seq-iface-put-ak)"/>
<text x="590.0" y="480" class="t-m lbl" text-anchor="middle">8  delete the entry (hot)</text>
<line x1="490" y1="492" x2="690" y2="492" class="ln" marker-end="url(#seq-iface-put-ak)"/>
<rect x="30" y="528" width="900" height="64" rx="5" class="box-o"/>
<text x="40" y="548" class="t-m">The front owns steps 0, 1 and 6 (wire, auth, key rules, error rendering). Steps 2 to 5 and 7 to 8 are the core's, the same for every front.</text>
<text x="40" y="564" class="t-m">Each store adapter converts the canonical call: S3 gets If-None-Match / If-Match, GCS gets ifGenerationMatch=0 (create-only). A multipart put reaches a GCS cold tier as the same canonical calls, served by staged parts and a compose.</text>
<text x="40" y="580" class="t-m">A GCS 412 on step 7 is Backend AlreadyExists, as an S3 412 is. The tag a store returns (GCS: the generation) is never compared across tiers.</text>
</svg>
