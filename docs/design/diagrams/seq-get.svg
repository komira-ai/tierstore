<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 694" width="960" height="694" role="img" aria-label="Sequence diagram of a get: Client, Node, Hot tier, Cold tier. A hot hit is one hot read that returns the tag and the body together. On a miss the node reads the entry first; a DEL entry in any state means 404 and cold is not read. Otherwise it reads cold, and below the Critical level may ask for a copy-back by creating a CB entry.">
<title>A get: one hot round trip on a hit; on a miss the entry is read before cold</title>
<defs><marker id="seq-get-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="seq-get-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-od{stroke:#FD4F1D;fill:none;stroke-width:1.6;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-n{fill:#5A5A57;font-size:13px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="694" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">A get: one hot round trip on a hit; on a miss the entry is read before cold</text>
<rect x="55" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="110" y="65" class="b" text-anchor="middle">Client</text>
<rect x="285" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="340" y="65" class="b" text-anchor="middle">Node</text>
<rect x="545" y="44" width="110" height="32" rx="5" class="box"/>
<text x="600" y="65" class="b" text-anchor="middle">Hot tier</text>
<rect x="785" y="44" width="110" height="32" rx="5" class="box"/>
<text x="840" y="65" class="b" text-anchor="middle">Cold tier</text>
<line x1="110" y1="76" x2="110" y2="628" class="ln-d"/>
<line x1="340" y1="76" x2="340" y2="628" class="ln-d"/>
<line x1="600" y1="76" x2="600" y2="628" class="ln-d"/>
<line x1="840" y1="76" x2="840" y2="628" class="ln-d"/>
<text x="225.0" y="112" class="t-m lbl" text-anchor="middle">0  GET key (optionally a range)</text>
<line x1="110" y1="124" x2="340" y2="124" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="470.0" y="150" class="t-m lbl" text-anchor="middle">1  hot open_read key: tag and body in one call</text>
<line x1="340" y1="162" x2="600" y2="162" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="470.0" y="188" class="t-m lbl" text-anchor="middle">hit: the bytes at the client's key</text>
<line x1="600" y1="200" x2="340" y2="200" class="ln-d" marker-end="url(#seq-get-ak)"/>
<text x="225.0" y="226" class="t-m lbl" text-anchor="middle">2  200 (hot hit ends here: one hot round trip, no entry read)</text>
<line x1="340" y1="238" x2="110" y2="238" class="ln-o" marker-end="url(#seq-get-ao)"/>
<rect x="30" y="252" width="900" height="32" rx="5" fill="#FFFFFF"/>
<rect x="30" y="252" width="900" height="32" rx="5" class="box-p"/>
<text x="40" y="272" class="t-m">A hot error other than not-found is returned as it is; cold is not tried (fail closed).</text>
<line x1="20" y1="302" x2="940" y2="302" class="ln-d"/>
<text x="20" y="326" class="b lbl">Hot miss</text>
<text x="470.0" y="354" class="t-m lbl" text-anchor="middle">3  hot GET _entries/&lt;sha256(key)&gt;, before any cold read</text>
<line x1="340" y1="366" x2="600" y2="366" class="ln" marker-end="url(#seq-get-ak)"/>
<rect x="30" y="380" width="900" height="48" rx="5" fill="#FFFFFF"/>
<rect x="30" y="380" width="900" height="48" rx="5" class="box-p"/>
<text x="40" y="400" class="t-m">The entry is a DEL in any state (HELD, PENDING, SEALED): 404 now. Cold is not read. This closes the one path by which a cold copy the leader has</text>
<text x="40" y="416" class="t-m">not yet deleted again could be served after an acknowledged delete.</text>
<text x="590.0" y="454" class="t-m lbl" text-anchor="middle">4  cold read key (streamed; a range reads only the range)</text>
<line x1="340" y1="466" x2="840" y2="466" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="590.0" y="492" class="t-m lbl" text-anchor="middle">bytes, or not found</text>
<line x1="840" y1="504" x2="340" y2="504" class="ln-d" marker-end="url(#seq-get-ak)"/>
<text x="470.0" y="530" class="t-m lbl" text-anchor="middle">5  create a (CB, PENDING) entry, create-only, best effort</text>
<text x="470.0" y="546" class="t-m lbl" text-anchor="middle">only below Critical, with no entry, under the cap of 1000 open</text>
<text x="470.0" y="562" class="t-m lbl" text-anchor="middle">ones</text>
<line x1="340" y1="574" x2="600" y2="574" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="225.0" y="600" class="t-m lbl" text-anchor="middle">6  200 with the cold bytes (or 404)</text>
<line x1="340" y1="612" x2="110" y2="612" class="ln-o" marker-end="url(#seq-get-ao)"/>
<rect x="30" y="626" width="900" height="48" rx="5" class="box-o"/>
<text x="40" y="646" class="t-m">The reply never waits for step 5; any failure there is ignored. The node copies nothing into hot itself: the leader does, later, under the entry</text>
<text x="40" y="662" class="t-m">(entry lifecycle). LIST is the union of both tiers as before, with _entries/ filtered out like the other reserved prefixes.</text>
</svg>
