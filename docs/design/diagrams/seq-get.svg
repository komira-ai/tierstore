<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 888" width="960" height="888" role="img" aria-label="Sequence diagram of a get: hot first, cold on a hot miss, copy-back to hot unless at the critical level, background journal entry.">
<title>A get: store calls in order, and where the copy-back happens</title>
<defs><marker id="seq-get-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="seq-get-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.6;stroke-dasharray:7 5}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="888" fill="#FFFFFF"/>
<rect x="55" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="110" y="65" class="b" text-anchor="middle">Client</text>
<line x1="110" y1="76" x2="110" y2="776" class="ln-d"/>
<rect x="285" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="340" y="65" class="b" text-anchor="middle">Proxy</text>
<line x1="340" y1="76" x2="340" y2="776" class="ln-d"/>
<rect x="545" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="600" y="65" class="b" text-anchor="middle">Hot tier</text>
<line x1="600" y1="76" x2="600" y2="776" class="ln-d"/>
<rect x="785" y="44" width="110" height="32" rx="5" class="box-b"/>
<text x="840" y="65" class="b" text-anchor="middle">Cold tier</text>
<line x1="840" y1="76" x2="840" y2="776" class="ln-d"/>
<text x="20" y="28" class="b" font-size="16" text-anchor="start">A get: store calls in order, and where the copy-back happens</text>
<text x="225.0" y="110" class="t-m lbl" text-anchor="middle">GET key (optional Range)</text>
<line x1="110" y1="119" x2="340" y2="119" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="360" y="137" class="t-m lbl" text-anchor="start">The S3 front refuses a reserved key (403), calls proxy.head</text>
<text x="360" y="150" class="t-m lbl" text-anchor="start">(see Head), then proxy.get: the steps below.</text>
<text x="470.0" y="183" class="t-m lbl" text-anchor="middle">1  get(key, range)</text>
<line x1="340" y1="192" x2="600" y2="192" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="470.0" y="220" class="t-m lbl" text-anchor="middle">found: body, go to the reply (5), no copy</text>
<text x="470.0" y="233" class="t-m lbl" text-anchor="middle">NotFound: go on. Any other error: returned, cold not asked</text>
<line x1="600" y1="242" x2="340" y2="242" class="ln-d" marker-end="url(#seq-get-ak)"/>
<text x="590.0" y="270" class="t-m lbl" text-anchor="middle">2  get(key): the whole body</text>
<line x1="340" y1="279" x2="840" y2="279" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="590.0" y="307" class="t-m lbl" text-anchor="middle">body (NotFound: 404; error: error)</text>
<line x1="840" y1="316" x2="340" y2="316" class="ln-d" marker-end="url(#seq-get-ak)"/>
<text x="40" y="334" class="t-m lbl" text-anchor="start">Ranged get at Critical or Full: step 3 is read before this step,</text>
<text x="40" y="347" class="t-m lbl" text-anchor="start">and cold is asked for the range only (206, no copy-back).</text>
<text x="470.0" y="380" class="t-m lbl" text-anchor="middle">3  get _tiering/usage</text>
<text x="470.0" y="393" class="t-m lbl" text-anchor="middle">(cached 1 s; skipped when latched Full)</text>
<line x1="340" y1="402" x2="600" y2="402" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="470.0" y="430" class="t-m lbl" text-anchor="middle">level (missing or stale = Open)</text>
<line x1="600" y1="439" x2="340" y2="439" class="ln-d" marker-end="url(#seq-get-ak)"/>
<text x="612" y="457" class="t-m lbl" text-anchor="start">Critical or Full: no copy-back,</text>
<text x="612" y="470" class="t-m lbl" text-anchor="start">go to the reply.</text>
<text x="470.0" y="503" class="t-m lbl" text-anchor="middle">4  put(key, body), create-only</text>
<line x1="340" y1="512" x2="600" y2="512" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="470.0" y="540" class="t-m lbl" text-anchor="middle">ok. Full, AlreadyExists or any</text>
<text x="470.0" y="553" class="t-m lbl" text-anchor="middle">error: copy skipped, get goes on</text>
<line x1="600" y1="562" x2="340" y2="562" class="ln-d" marker-end="url(#seq-get-ak)"/>
<rect x="30" y="574" width="900" height="60" rx="5" class="box-o"/>
<text x="225.0" y="590" class="t-m lbl" text-anchor="middle">5  200 + body</text>
<text x="225.0" y="603" class="t-m lbl" text-anchor="middle">(206 + the part if ranged)</text>
<line x1="340" y1="612" x2="110" y2="612" class="ln-o" marker-end="url(#seq-get-ao)"/>
<text x="40" y="630" class="t-m lbl" text-anchor="start">The reply waits for the copy-back put (step 4), not for the journal entry.</text>
<text x="470.0" y="671" class="t-m lbl" text-anchor="middle">b  put _journal/&lt;proxy&gt;/&lt;seq&gt;</text>
<text x="470.0" y="684" class="t-m lbl" text-anchor="middle">(PUT entry for the copy)</text>
<line x1="340" y1="693" x2="600" y2="693" class="ln" marker-end="url(#seq-get-ak)"/>
<text x="470.0" y="721" class="t-m lbl" text-anchor="middle">ok (not awaited by the reply)</text>
<line x1="600" y1="730" x2="340" y2="730" class="ln-d" marker-end="url(#seq-get-ak)"/>
<text x="360" y="748" class="t-m lbl" text-anchor="start">Started after step 4 and not awaited. If it</text>
<text x="360" y="761" class="t-m lbl" text-anchor="start">fails, the copied hot object is removed.</text>
<rect x="30" y="784" width="900" height="80" rx="5" class="box"/>
<text x="42" y="804" class="b" text-anchor="start">Ranged get (Range header) that misses hot</text>
<text x="42" y="822" class="t-m" text-anchor="start">Below Critical: as above, the whole object from cold, copy-back, reply with the requested part.</text>
<text x="42" y="838" class="t-m" text-anchor="start">At Critical or Full (usage read first, as in step 3): cold is asked for that part alone, 206 with it, no copy-back (4 and b skipped).</text>
<text x="42" y="854" class="t-m" text-anchor="start">A hot error other than NotFound returns at once; cold is not asked.</text>
</svg>
