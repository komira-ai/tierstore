<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 498" width="960" height="498" role="img" aria-label="Sequence diagram of a get through the S3 front: hot first, then a GCS cold read on a hot miss.">
<title>A get through the S3 front, hot = s3, cold = gcs</title>
<defs><marker id="seq-iface-get-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="seq-iface-get-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="960" height="498" fill="#FFFFFF"/>
<text x="20" y="28" class="b" font-size="16">A get through the S3 front, hot = s3, cold = gcs</text>
<rect x="55" y="44" width="110" height="32" rx="5" class="box-b"/><text x="110" y="65" class="b" text-anchor="middle">Client</text>
<line x1="110" y1="76" x2="110" y2="426" class="ln-d"/>
<rect x="245" y="44" width="110" height="32" rx="5" class="box-b"/><text x="300" y="65" class="b" text-anchor="middle">S3 front</text>
<line x1="300" y1="76" x2="300" y2="426" class="ln-d"/>
<rect x="435" y="44" width="110" height="32" rx="5" class="box"/><text x="490" y="65" class="b" text-anchor="middle">Proxy core</text>
<line x1="490" y1="76" x2="490" y2="426" class="ln-d"/>
<rect x="635" y="44" width="110" height="32" rx="5" class="box"/><text x="690" y="65" class="b" text-anchor="middle">Hot (s3)</text>
<line x1="690" y1="76" x2="690" y2="426" class="ln-d"/>
<rect x="805" y="44" width="110" height="32" rx="5" class="box"/><text x="860" y="65" class="b" text-anchor="middle">Cold (gcs)</text>
<line x1="860" y1="76" x2="860" y2="426" class="ln-d"/>
<text x="205.0" y="112" class="t-m lbl" text-anchor="middle">0  GET /bucket/K (signed, optional Range)</text>
<line x1="110" y1="124" x2="300" y2="124" class="ln" marker-end="url(#seq-iface-get-ak)"/>
<text x="395.0" y="150" class="t-m lbl" text-anchor="middle">1  verify; effective key rule; Proxy::open_read(K', span)</text>
<line x1="300" y1="162" x2="490" y2="162" class="ln" marker-end="url(#seq-iface-get-ak)"/>
<text x="590.0" y="188" class="t-m lbl" text-anchor="middle">2  hot open_read K': tag and body in one call</text>
<line x1="490" y1="200" x2="690" y2="200" class="ln" marker-end="url(#seq-iface-get-ak)"/>
<text x="300.0" y="226" class="t-m lbl" text-anchor="middle">hit: the front renders headers (ETag = hot tag) and streams, 200 or 206</text>
<line x1="490" y1="238" x2="110" y2="238" class="ln-o" marker-end="url(#seq-iface-get-ao)"/>
<line x1="20" y1="268" x2="940" y2="268" class="ln-d"/>
<text x="20" y="290" class="b lbl">Hot miss</text>
<text x="675.0" y="312" class="t-m lbl" text-anchor="middle">3  cold open_read K'  (GCS objects.get alt=media, with Range)</text>
<line x1="490" y1="324" x2="860" y2="324" class="ln" marker-end="url(#seq-iface-get-ak)"/>
<text x="675.0" y="350" class="t-m lbl" text-anchor="middle">bytes, or 404</text>
<line x1="860" y1="362" x2="490" y2="362" class="ln-d" marker-end="url(#seq-iface-get-ak)"/>
<text x="300.0" y="388" class="t-m lbl" text-anchor="middle">4  200, 206 or 404 (the front renders the S3 NoSuchKey XML)</text>
<line x1="490" y1="400" x2="110" y2="400" class="ln-o" marker-end="url(#seq-iface-get-ao)"/>
<rect x="30" y="436" width="900" height="48" rx="5" class="box-o"/>
<text x="40" y="456" class="t-m">The front turns the Range into a span for the Proxy call, and the Meta (size, tag, time) and the body into S3 headers. It never sees which tier answered, or that cold is GCS.</text>
<text x="40" y="472" class="t-m">No entry is read. A hot error other than not-found is returned as it is; cold is not tried (fail closed), whatever the stores are.</text>
</svg>
